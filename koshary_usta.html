<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#150F0C">
<title>كشري الأسطى — Koshary Usta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800;900&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  /* CARTOON PALETTE — everything a shade louder than life, with one
     consistent ink colour that outlines every solid shape. */
  --ink:#241109; --ink-soft:#3D2113;
  --night:#2A1410; --wall:#4A2418; --wall2:#6B3A22;
  --steel:#B9C6D4; --steel-hi:#F4F9FF; --steel-lo:#5C6B7C; --steel-dk:#33404F;
  --brass:#F0A82E; --brass-hi:#FFD97A; --brass-lo:#B06E12;
  --saffron:#FFDFA0; --lentil:#8E5A2E; --ward:#FFA82E; --ward-hi:#FFD27A;
  --salsa:#E0361F; --salsa-hi:#FF6A45; --shatta:#FF2D18; --daqqa:#FFF6E0;
  --neonB:#4FC8FF; --neonR:#FF4F7A; --neonG:#5CE6A8;
  --paper:#FFF3D8; --sky:#3E5C8C;
  --good:#59D97C; --bad:#FF5F52; --warn:#FFC93C;
  --combo:#FF7AD9;
  --ui: "Cairo", "Segoe UI", system-ui, -apple-system, sans-serif;
  --disp: "Lalezar", "Cairo", system-ui, sans-serif;
  --ow:2.5px;               /* standard cartoon outline weight */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#160A06}
body{font-family:var(--ui);color:#F2E9DC;overscroll-behavior:none;
  touch-action:manipulation;user-select:none;-webkit-user-select:none}
/* The frame is sized and zoomed by frameFit() so one layout serves a phone,
   a tablet and a desktop: width/height are set in unzoomed px, `zoom` scales
   the whole chrome with the viewport. margin:auto centres it in the letterbox. */
#app{position:fixed;inset:0;margin:auto;display:flex;flex-direction:column;
  width:100%;height:100%;background:var(--night);overflow:hidden;
  box-shadow:0 0 60px rgba(0,0,0,.8)}
#app.shake{animation:shakeIt .32s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shakeIt{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}

/* ---------- HUD : a brushed steel rail ---------- */
#hud{flex:0 0 auto;position:relative;display:flex;align-items:center;gap:5px;padding:6px 9px;
  padding-top:max(6px,env(safe-area-inset-top));
  background:linear-gradient(180deg,#8F9BAA 0%,#6B7888 40%,#54606E 62%,#3A4552 100%);
  border-bottom:var(--ow) solid var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.45);z-index:6}
#hud::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:rgba(255,255,255,.5)}
.chip{display:flex;align-items:center;gap:4px;background:#2B1A12;
  border:2px solid var(--ink);border-radius:999px;padding:3px 9px;
  font-size:12.5px;font-weight:800;letter-spacing:.2px;white-space:nowrap;
  box-shadow:0 2px 0 rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.14)}
.chip b{font-weight:900;font-size:13.5px}
.chip.money b{color:var(--brass-hi)}
.chip.rep b{color:var(--ward-hi)}
.chip.bump{animation:chipBump .36s cubic-bezier(.34,1.7,.5,1)}
@keyframes chipBump{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-3deg)}100%{transform:scale(1)}}
#hudSpacer{flex:1}
.iconbtn{width:32px;height:32px;border-radius:9px;border:2px solid var(--ink);
  background:#3A2A1E;color:#FFEDD2;font-size:14px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;font-family:var(--ui);padding:0;
  box-shadow:0 2px 0 rgba(0,0,0,.45)}
.iconbtn:active{transform:translateY(2px);box-shadow:none}

/* combo / koshary-symphony meter, rides under the HUD */
/* tucked under the patience bar, clear of both the slip and the bowl */
#combo{position:absolute;top:26px;inset-inline-end:8px;
  transform:scale(.55);transform-origin:top right;z-index:7;pointer-events:none;opacity:0;
  transition:opacity .18s, transform .22s cubic-bezier(.34,1.8,.5,1)}
html[dir="ltr"] #combo{transform-origin:top left}
#combo.on{opacity:1;transform:scale(1)}
#comboIn{display:flex;align-items:center;gap:6px;background:#2A1020;
  border:var(--ow) solid var(--ink);border-radius:999px;padding:3px 12px;
  box-shadow:0 3px 0 rgba(0,0,0,.45)}
#comboIn b{font-family:var(--disp);font-size:19px;line-height:1;color:var(--combo);
  text-shadow:0 2px 0 var(--ink)}
#comboIn span{font-size:11px;font-weight:800;color:#FFD9F4;letter-spacing:.4px}
#comboBar{width:54px;height:6px;border-radius:4px;background:rgba(0,0,0,.55);
  overflow:hidden;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.2)}
#comboBar i{display:block;height:100%;background:var(--combo);transition:width .12s linear}

/* ---------- stage ---------- */
#stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;background:var(--night)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{position:absolute;inset:0;pointer-events:none}

/* order slip */
#slip{position:absolute;top:8px;inset-inline-start:8px;width:min(52%,200px);
  background:linear-gradient(178deg,#FFF8E6,#F3E3C0);color:var(--ink);
  border:var(--ow) solid var(--ink);border-radius:5px;padding:7px 9px 8px;
  font-size:12px;line-height:1.45;
  box-shadow:0 5px 0 rgba(0,0,0,.35), 0 9px 20px rgba(0,0,0,.45);
  transform-origin:top center;pointer-events:none;z-index:3;
  animation:slipIn .34s cubic-bezier(.34,1.7,.5,1)}
@keyframes slipIn{0%{transform:translateY(-18px) rotate(-6deg) scale(.86);opacity:0}
  100%{transform:none;opacity:1}}
#slip.tick{animation:slipTick .22s ease-out}
@keyframes slipTick{0%{transform:scale(1)}45%{transform:scale(1.035) rotate(.6deg)}100%{transform:scale(1)}}
#slip.hide{display:none}
#slip::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:6px;
  background:repeating-linear-gradient(90deg,#E4D5B4 0 5px,transparent 5px 10px)}
#slip .sTop{display:flex;justify-content:space-between;align-items:baseline;
  border-bottom:1.5px dashed rgba(42,31,23,.35);padding-bottom:3px;margin-bottom:4px}
#slip .sName{font-family:var(--disp);font-size:16px;line-height:1}
#slip .sWho{font-size:10px;font-weight:800;color:#8A5A12;letter-spacing:.2px;
  margin:-1px 0 3px;display:flex;align-items:center;gap:3px}
#slip .sNo{font-size:10.5px;opacity:.65;font-weight:700}
#slip ul{margin:0;padding:0;list-style:none}
#slip li{display:flex;justify-content:space-between;gap:6px;font-weight:600}
#slip li.ex{color:#8A5A12}
#slip li.no{color:#9A3226;text-decoration:line-through;opacity:.8}
#slip .sFoot{margin-top:4px;padding-top:3px;border-top:1.5px dashed rgba(42,31,23,.35);
  display:flex;justify-content:space-between;font-size:11px;font-weight:800}

/* patience bar */
#pat{position:absolute;top:8px;inset-inline-end:8px;width:74px;height:11px;
  background:#1B0E08;border:2.5px solid var(--ink);border-radius:999px;overflow:hidden;
  box-shadow:0 2px 0 rgba(0,0,0,.4);z-index:3}
#patF{height:100%;width:100%;background:var(--good);
  transition:width .18s linear,background .3s}
#pat.panic{animation:patPanic .38s infinite}
@keyframes patPanic{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#pat.hide,#dock.hide{display:none}

/* floating score pops */
.pop{position:absolute;font-family:var(--disp);font-size:21px;color:#fff;
  -webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(0,0,0,.35);animation:popUp 1.1s cubic-bezier(.2,1.5,.4,1) forwards;
  z-index:5;white-space:nowrap}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,10px) scale(.4) rotate(-12deg)}
  22%{opacity:1;transform:translate(-50%,-10px) scale(1.25) rotate(4deg)}
  38%{transform:translate(-50%,-16px) scale(1) rotate(-2deg)}
  100%{opacity:0;transform:translate(-50%,-58px) scale(.95) rotate(0)}}
.pop.big{font-size:31px;-webkit-text-stroke:4.5px var(--ink)}

/* shout bubble from the shop */
/* a proper comic speech balloon with a tail */
#shout{position:absolute;top:calc(10px + 17%);inset-inline-end:10px;max-width:42%;
  background:var(--paper);border:var(--ow) solid var(--ink);
  border-radius:14px;padding:6px 11px;font-size:12.5px;font-weight:800;color:var(--ink);
  opacity:0;transform:scale(.5) translateY(8px);transform-origin:bottom right;
  transition:opacity .18s, transform .26s cubic-bezier(.34,1.8,.5,1);
  z-index:4;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#shout::after{content:"";position:absolute;bottom:-13px;inset-inline-end:18px;
  width:0;height:0;border:7px solid transparent;border-top-color:var(--ink);
  border-bottom:0;filter:drop-shadow(0 3px 0 rgba(0,0,0,.2))}
#shout::before{content:"";position:absolute;bottom:-8px;inset-inline-end:21px;z-index:1;
  width:0;height:0;border:5px solid transparent;border-top-color:var(--paper);border-bottom:0}
#shout.on{opacity:1;transform:none}

/* the day's news banner (daily modifier) */
#event{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);
  width:min(86%,340px);background:var(--paper);border:var(--ow) solid var(--ink);
  border-radius:16px;padding:12px 14px;text-align:center;color:var(--ink);
  box-shadow:0 8px 0 rgba(0,0,0,.4), 0 18px 40px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;z-index:8;transition:opacity .2s, transform .34s cubic-bezier(.34,1.7,.5,1)}
#event.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#event .eK{font-size:11px;font-weight:900;letter-spacing:1px;color:#A2620C}
#event .eT{font-family:var(--disp);font-size:22px;line-height:1.15;margin:2px 0 3px}
#event .eD{font-size:12.5px;font-weight:700;line-height:1.5;opacity:.85}

/* RUSH HOUR flash */
#rush{position:absolute;top:0;left:0;right:0;z-index:9;pointer-events:none;
  text-align:center;font-family:var(--disp);font-size:38px;color:#FFD97A;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;
  text-shadow:0 6px 0 rgba(0,0,0,.4);
  padding-top:34%;opacity:0}
#rush.on{animation:rushIn 1.7s ease-out forwards}
@keyframes rushIn{0%{opacity:0;transform:scale(.3) rotate(-14deg)}
  16%{opacity:1;transform:scale(1.3) rotate(5deg)}
  26%{transform:scale(1) rotate(-2deg)}
  74%{opacity:1;transform:scale(1)}
  100%{opacity:0;transform:scale(1.35)}}
#stage.rushing::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:2;
  box-shadow:inset 0 0 60px 12px rgba(255,60,60,.28);animation:rushPulse 1.1s infinite}
@keyframes rushPulse{0%,100%{opacity:.55}50%{opacity:1}}

/* ---------- dock (action bar) ---------- */
#dock{flex:0 0 auto;display:flex;gap:7px;padding:8px 9px;
  padding-bottom:max(8px,env(safe-area-inset-bottom));
  background:linear-gradient(180deg,#3A2318,#1E1009);
  border-top:var(--ow) solid var(--ink);z-index:6}
.btn{flex:1;min-height:46px;border-radius:13px;cursor:pointer;
  border:var(--ow) solid var(--ink);
  font-family:var(--ui);font-weight:900;font-size:14px;color:#2A1608;
  background:linear-gradient(180deg,var(--brass-hi) 0%,var(--brass) 55%,var(--brass-lo) 100%);
  box-shadow:0 4px 0 var(--ink), 0 8px 16px rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;gap:5px;padding:0 8px;
  transition:transform .07s, box-shadow .07s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink),0 2px 6px rgba(0,0,0,.45)}
.btn.ghost{background:linear-gradient(180deg,#6B5140,#42301F);color:#FFEBCD;
  box-shadow:0 4px 0 var(--ink),0 8px 16px rgba(0,0,0,.4)}
.btn.ghost:active{box-shadow:0 0 0 var(--ink)}
.btn.hot{background:linear-gradient(180deg,#FF8C6B,var(--salsa));color:#FFF3E6}
.btn.go{background:linear-gradient(180deg,#8CF0A8,#2FB566);color:#0E2E19}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn small{display:block;font-size:10px;font-weight:700;opacity:.8;margin-top:-2px}
.btn.wide{flex:2}
.btn.pulse{animation:btnPulse 1.1s infinite}
@keyframes btnPulse{0%,100%{transform:none}50%{transform:translateY(-3px) scale(1.02)}}

/* ---------- overlay / cards ---------- */
#ov{position:absolute;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  padding:16px;background:radial-gradient(120% 90% at 50% 30%,rgba(70,30,16,.80),rgba(8,4,2,.92));
  backdrop-filter:blur(3px)}
#ov.on{display:flex}
#ovIn{width:100%;max-width:430px;max-height:92%;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:linear-gradient(172deg,#50301E,#2E1A10);border:var(--ow) solid var(--ink);
  border-radius:20px;padding:16px 15px;
  box-shadow:0 7px 0 var(--ink), 0 26px 54px rgba(0,0,0,.7);
  animation:cardIn .38s cubic-bezier(.34,1.6,.5,1)}
@keyframes cardIn{0%{opacity:0;transform:translateY(22px) scale(.93)}100%{opacity:1;transform:none}}
.card h2{font-family:var(--disp);font-size:27px;margin:0 0 3px;color:#FFE9BC;line-height:1.15;font-weight:400;
  text-shadow:0 2.5px 0 var(--ink)}
.card h3{font-family:var(--disp);font-size:19px;margin:14px 0 7px;color:var(--brass-hi);font-weight:400;
  text-shadow:0 2px 0 var(--ink)}
.card p{margin:0 0 9px;font-size:13.5px;line-height:1.65;color:#EBD9C0}
.card p.lead{color:#FFF1DC}
.eyebrow{display:inline-block;font-size:11px;font-weight:900;color:#2A1608;margin-bottom:5px;
  letter-spacing:.4px;background:var(--brass);border:2px solid var(--ink);
  border-radius:999px;padding:2px 9px;box-shadow:0 2px 0 var(--ink)}
.rule{height:2.5px;border-radius:2px;background:rgba(255,220,160,.25);margin:12px 0}

/* framed photo for story beats */
.photo{border:var(--ow) solid var(--ink);border-radius:12px;
  box-shadow:0 5px 0 var(--ink), 0 14px 30px rgba(0,0,0,.5);
  margin:0 0 15px;overflow:hidden;background:#5C86C4;aspect-ratio:16/9;
  transform:rotate(-1deg)}
.photo canvas,.photo img{display:block;width:100%;height:100%}
/* the title hero is wider and sits straight */
.hero{border:var(--ow) solid var(--ink);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 0 var(--ink), 0 16px 34px rgba(0,0,0,.5);
  margin:2px 0 14px;background:#5C86C4;aspect-ratio:20/9;transform:none}
.hero canvas,.hero img{display:block;width:100%;height:100%}

/* stat rows */
.rows{display:flex;flex-direction:column;gap:2.5px;background:var(--ink);
  border:var(--ow) solid var(--ink);border-radius:12px;overflow:hidden;margin:10px 0;
  box-shadow:0 4px 0 rgba(0,0,0,.4)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:#3C2417;padding:9px 12px;font-size:13px;font-weight:700}
.row span:first-child{color:#D6C0A4}
.row b{font-weight:900;color:#FFF0D6}
.row.tot{background:#5A3720}.row.tot b{color:var(--brass-hi);font-size:16px}
.row.neg b{color:#FF9B92} .row.pos b{color:#9BF0B2}
.row.tap{cursor:pointer} .row.tap:active{transform:scale(.985)}

/* meters */
.meter{height:10px;border-radius:999px;background:#1B0E08;overflow:hidden;
  border:2px solid var(--ink);flex:1}
.meter i{display:block;height:100%;border-radius:999px;transition:width .35s cubic-bezier(.34,1.5,.5,1)}

/* star rating on the day-end card */
.stars{display:flex;gap:7px;justify-content:center;margin:6px 0 12px}
.stars span{font-size:31px;line-height:1;color:#5A4636;transform:scale(.78)}
.stars span.lit{color:var(--brass-hi);transform:scale(1);
  text-shadow:0 0 0 var(--ink), 0 3px 0 rgba(0,0,0,.45), 0 0 16px rgba(255,190,90,.55);
  -webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;
  animation:starPop .45s cubic-bezier(.34,1.9,.5,1) both}
.stars span.lit:nth-child(2){animation-delay:.16s}
.stars span.lit:nth-child(3){animation-delay:.32s}
@keyframes starPop{0%{opacity:0;transform:scale(.2) rotate(-40deg)}
  60%{opacity:1;transform:scale(1.35) rotate(9deg)}
  100%{opacity:1;transform:scale(1) rotate(0)}}

/* upgrade list */
.up{display:flex;gap:10px;align-items:flex-start;background:#3C2417;border-radius:14px;
  padding:10px;margin-bottom:9px;border:var(--ow) solid var(--ink);
  box-shadow:0 4px 0 rgba(0,0,0,.4)}
.up.own{opacity:.62}
.up.locked{opacity:.45;filter:grayscale(.6)}
.upIco{flex:0 0 46px;height:46px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(160deg,#6B4F3A,#3A2618);border:2.5px solid var(--ink)}
.upIco canvas,.upIco img{width:38px;height:38px;display:block}
.upB{flex:1;min-width:0}
.upT{font-family:var(--disp);font-size:16px;color:#FFE9BC;line-height:1.2;font-weight:400;
  text-shadow:0 2px 0 var(--ink)}
.upD{font-size:11.5px;color:#CBB69C;line-height:1.45;margin-top:2px}
.upBuy{flex:0 0 auto;align-self:center;min-width:66px;min-height:38px;border-radius:11px;
  border:2.5px solid var(--ink);
  font-family:var(--ui);font-weight:900;font-size:12.5px;color:#2A1608;cursor:pointer;
  background:linear-gradient(180deg,var(--brass-hi),var(--brass));box-shadow:0 3px 0 var(--ink)}
.upBuy:active{transform:translateY(3px);box-shadow:none}
.upBuy[disabled]{background:#4A3A2C;color:#9A8973;box-shadow:0 3px 0 var(--ink)}
.upBuy.owned{background:#2E6B45;color:#C8FFD9;box-shadow:0 3px 0 var(--ink)}

/* prep board */
.prep{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pc{background:#3C2417;border:var(--ow) solid var(--ink);border-radius:14px;padding:9px;
  cursor:pointer;position:relative;overflow:hidden;text-align:start;
  box-shadow:0 4px 0 rgba(0,0,0,.4);transition:transform .08s}
.pc:active{transform:translateY(3px) scale(.99)}
.pc.done{background:#33452F}
.pc.empty{background:#4E2420;animation:pcWarn 1.5s infinite}
@keyframes pcWarn{0%,100%{box-shadow:0 4px 0 rgba(0,0,0,.4)}
  50%{box-shadow:0 4px 0 rgba(0,0,0,.4), 0 0 0 3px rgba(255,95,82,.4)}}
.pcT{font-family:var(--disp);font-size:15.5px;color:#FFE9BC;font-weight:400;line-height:1.2;
  text-shadow:0 2px 0 var(--ink)}
.pcS{font-size:11px;color:#C6B098;margin:3px 0 6px;font-weight:700}
.pcBars{display:flex;gap:5px;align-items:center}
.pcQ{font-size:10.5px;font-weight:800;min-width:30px;text-align:end}
.pcSw{position:absolute;top:8px;inset-inline-end:8px;width:15px;height:15px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.25)}

/* generic tiny table for orders */
.ord{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0}
.tag{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;
  background:#54341F;border:2px solid var(--ink);color:#F2DFC4}
.tag.ok{background:#2E6B45;color:#C8FFD9}
.tag.no{background:#8C2E26;color:#FFD4CE}

.ovBtns{display:flex;gap:8px;margin-top:13px}
.hintline{font-size:12px;color:#C3AE94;font-weight:700;text-align:center;margin-top:10px;line-height:1.5;
  cursor:pointer}
.hintline:active{opacity:.6}
kbd{background:rgba(255,255,255,.1);border-radius:4px;padding:1px 5px;font-family:var(--ui);
  font-size:11px;font-weight:700;color:#EBD9BC}

/* title screen */
#titleWrap{text-align:center;padding:2px 0 6px}
#titleWrap .t1{font-family:var(--disp);font-size:16px;color:var(--brass-hi);letter-spacing:2px;font-weight:400;
  text-shadow:0 2px 0 var(--ink)}
#titleWrap .t2{font-family:var(--disp);font-size:50px;line-height:.95;margin:0 0 5px;
  color:#FFD97A;font-weight:400;
  text-shadow:0 3px 0 var(--ink), 0 5px 0 var(--ink), 0 7px 0 rgba(0,0,0,.35),
              0 0 26px rgba(255,150,60,.45);
  animation:titleBob 3.2s ease-in-out infinite}
@keyframes titleBob{0%,100%{transform:rotate(-1.4deg) translateY(0)}50%{transform:rotate(1.4deg) translateY(-4px)}}
#titleWrap .t3{font-size:12px;color:#D8C3A6;font-weight:700}
.langRow{display:flex;gap:8px;justify-content:center;margin:11px 0 3px}
.langRow button{flex:1;max-width:180px}

/* toast */

function rollEvent(){

  let r=Math.random()*tot;
  for(const e of pool){ r-=e.w; if(r<=0) return e; }
  return EVENTS[0];
}
