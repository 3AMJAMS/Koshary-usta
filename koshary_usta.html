  ctx:null, on:true, master:null, musicOn:false, beat:0, bpm:104, t0:0,
  init(){
    if(this.ctx) return;
    try{
      const C = window.AudioContext||window.webkitAudioContext; if(!C) return;
      this.ctx = new C();
      this.master = this.ctx.createGain();
      this.master.gain.value = .65; this.master.connect(this.ctx.destination);
      this.t0 = this.ctx.currentTime;
    }catch(e){ this.ctx=null; }
  },
  resume(){ if(this.ctx && this.ctx.state==='suspended') this.ctx.resume(); },
  noise(dur){
    const n = Math.max(1,Math.floor(this.ctx.sampleRate*dur));
    const b = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1);
    const s = this.ctx.createBufferSource(); s.buffer = b; return s;
  },
  /* metal rim strike */
  clang(freq, vel){
    if(!this.on||!this.ctx) return;
    const c=this.ctx, now=c.currentTime, v=(vel==null?1:vel);
    const out=c.createGain(); out.gain.value=.34*v; out.connect(this.master);
    [1,2.76,5.4,8.9].forEach((m,i)=>{
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.value=freq*m;
      const d=.42/(1+i*.85);
      g.gain.setValueAtTime(0,now);
      g.gain.linearRampToValueAtTime(.42/(i+1),now+.004);
      g.gain.exponentialRampToValueAtTime(.0008,now+d);
      o.connect(g); g.connect(out); o.start(now); o.stop(now+d+.02);
    });
    const n=this.noise(.05), ng=c.createGain(), bp=c.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.value=freq*4.2; bp.Q.value=1.1;
    ng.gain.setValueAtTime(.3*v,now); ng.gain.exponentialRampToValueAtTime(.001,now+.05);
    n.connect(bp); bp.connect(ng); ng.connect(out); n.start(now); n.stop(now+.06);
  },
  /* soft wet scoop */
  scoop(){
    if(!this.on||!this.ctx) return;
    const c=this.ctx, now=c.currentTime;
    const n=this.noise(.13), g=c.createGain(), f=c.createBiquadFilter();
    f.type='lowpass'; f.frequency.setValueAtTime(1600,now);
    f.frequency.exponentialRampToValueAtTime(380,now+.12);
    g.gain.setValueAtTime(.12,now); g.gain.exponentialRampToValueAtTime(.001,now+.13);
    n.connect(f); f.connect(g); g.connect(this.master); n.start(now); n.stop(now+.14);
  },
  tone(freq,dur,type,vol){
    if(!this.on||!this.ctx) return;
    const c=this.ctx, now=c.currentTime;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'triangle'; o.frequency.value=freq;
    g.gain.setValueAtTime(0,now); g.gain.linearRampToValueAtTime(vol==null?.2:vol,now+.012);
    g.gain.exponentialRampToValueAtTime(.001,now+dur);
    o.connect(g); g.connect(this.master); o.start(now); o.stop(now+dur+.02);
  },
  chord(freqs,dur,vol){ freqs.forEach((f,i)=>setTimeout(()=>this.tone(f,dur,'triangle',vol||.16), i*62)); },
  coin(){ this.tone(1180,.07,'square',.13); setTimeout(()=>this.tone(1720,.11,'square',.11),58); },
  bad(){ this.tone(150,.22,'sawtooth',.13); },
  /* continuous frying hiss, level 0..1 */
  sizzle:{src:null,gain:null,filt:null},
  fryStart(){
    if(!this.on||!this.ctx||this.sizzle.src) return;
    const c=this.ctx;
    const n=this.noise(2); n.loop=true;
    const f=c.createBiquadFilter(); f.type='bandpass'; f.frequency.value=3000; f.Q.value=.6;
    const g=c.createGain(); g.gain.value=0;
    n.connect(f); f.connect(g); g.connect(this.master); n.start();
    this.sizzle={src:n,gain:g,filt:f};
  },
  fryLevel(v,heat){
    if(!this.sizzle.gain||!this.ctx) return;
    const now=this.ctx.currentTime;
    this.sizzle.gain.gain.setTargetAtTime(clamp(v,0,1)*.15,now,.08);
    this.sizzle.filt.frequency.setTargetAtTime(1800+3200*clamp(heat,0,1),now,.15);
  },
  fryStop(){
    if(!this.sizzle.src) return;
    try{ this.sizzle.gain.gain.setTargetAtTime(0,this.ctx.currentTime,.05);
         const s=this.sizzle.src; setTimeout(()=>{try{s.stop()}catch(e){}},300); }catch(e){}
    this.sizzle={src:null,gain:null,filt:null};
  },
  bubbleTick(){ if(!this.on||!this.ctx) return;
    this.tone(rnd(210,340),.06,'sine',.045); },
  murmur:null,
  crowd(on){
    if(!this.ctx) return;
    if(on && !this.murmur && this.on){
      const c=this.ctx, n=this.noise(3); n.loop=true;
      const f=c.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
      const g=c.createGain(); g.gain.value=.028;
      n.connect(f); f.connect(g); g.connect(this.master); n.start();
      this.murmur={src:n,gain:g};
    } else if(!on && this.murmur){
      try{this.murmur.src.stop()}catch(e){}; this.murmur=null;
    }
  }
};
const VATTONE = {rzmix:392, ruz:392, maca:466, ads:523, homos:587, salsa:659, taqleya:784};
/* ================================================================== canvas */
const cv = $('#cv'), cx = cv.getContext('2d');
let W=0, H=0, DPR=1, Z=1;

/* The chrome is authored against a ~420px-wide phone. Rather than rewrite every
   fixed size, the frame is zoomed: on a phone Z is 1 and nothing changes, on a
   desktop the whole panel scales up instead of stranding the game in a column.
   Wide viewports get a centred portrait panel sized off the height. */
function frameFit(){
  const vw = innerWidth, vh = innerHeight;
  const w = Math.min(vw, Math.max(320, vh*0.62));
  Z = Math.min(2, Math.max(1, w/420));
  const app = $('#app');
  app.style.zoom = Z;
  app.style.width  = (w/Z)+'px';
  app.style.height = (vh/Z)+'px';
}

function fit(){
  frameFit();
  const r = $('#stage').getBoundingClientRect();
  DPR = Math.min(window.devicePixelRatio||1, 2.5);
  /* the rect is in visual px; the canvas draws in unzoomed px */
  W = Math.max(280, Math.round(r.width/Z)); H = Math.max(320, Math.round(r.height/Z));
  const ss = DPR*Z;   /* keep art crisp when the frame is zoomed up */
  cv.width = Math.round(W*ss); cv.height = Math.round(H*ss);
  cv.style.width = W+'px'; cv.style.height = H+'px';
  cx.setTransform(ss,0,0,ss,0,0);
  layout();
}
addEventListener('resize', ()=>{ fit(); });
addEventListener('orientationchange', ()=>{ fit(); });

/* deterministic pseudo-random so speckle patterns don't strobe */
function sr(i){ const x = Math.sin(i*127.1+11.3)*43758.5453; return x-Math.floor(x); }

/* ------------------------------------------------------------- primitives */
function rr(x,y,w,h,r){
  const k=Math.min(r,w/2,h/2); cx.beginPath();
  cx.moveTo(x+k,y); cx.arcTo(x+w,y,x+w,y+h,k); cx.arcTo(x+w,y+h,x,y+h,k);
  cx.arcTo(x,y+h,x,y,k); cx.arcTo(x,y,x+w,y,k); cx.closePath();
}
function ell(x,y,rx,ry){ cx.beginPath(); cx.ellipse(x,y,rx,ry,0,0,Math.PI*2); }
function lg(x0,y0,x1,y1,stops){
  const g=cx.createLinearGradient(x0,y0,x1,y1);
  stops.forEach(s=>g.addColorStop(s[0],s[1])); return g;
}
function rg(x,y,r0,r1,stops){
  const g=cx.createRadialGradient(x,y,r0,x,y,r1);
  stops.forEach(s=>g.addColorStop(s[0],s[1])); return g;
}
function txt(s,x,y,size,col,weight,align,font){
  cx.font = (weight||700)+' '+size+'px '+(font||'Cairo, system-ui, sans-serif');
  cx.textAlign = align||'center'; cx.textBaseline='middle';
  cx.fillStyle = col; cx.fillText(s,x,y);
}
function shadowOn(c,b,ox,oy){ cx.shadowColor=c; cx.shadowBlur=b; cx.shadowOffsetX=ox||0; cx.shadowOffsetY=oy||0; }
function shadowOff(){ cx.shadowColor='transparent'; cx.shadowBlur=0; cx.shadowOffsetX=0; cx.shadowOffsetY=0; }

/* =====================================================================
   CARTOON TOOLKIT
   The whole look hangs on three things: every solid shape gets a thick
   ink outline, highlights are flat blobs rather than gradients, and
   anything that moves squashes on the way there and stretches on the
   way back. These helpers are used by every draw call below.
   ===================================================================== */
const INK = '#241109';
/* outline weight scales with the screen so it reads the same on a phone */
function iw(mult){ return Math.max(1.6, W*0.0075*(mult==null?1:mult)); }
/* stroke whatever path is currently open, in ink */
function inkPath(mult,col){
  cx.lineJoin='round'; cx.lineCap='round';
  cx.lineWidth = iw(mult); cx.strokeStyle = col||INK; cx.stroke();
}
/* fill + outline in one go */
function inkFill(fill,mult,col){ cx.fillStyle=fill; cx.fill(); inkPath(mult,col); }
function inkEll(x,y,rx,ry,fill,mult){ ell(x,y,rx,ry); inkFill(fill,mult); }
function inkRR(x,y,w,h,r,fill,mult){ rr(x,y,w,h,r); inkFill(fill,mult); }

/* a flat cartoon specular blob — no gradient, just a bright shape */
function gloss(x,y,rx,ry,rot,a){
  cx.save(); cx.globalAlpha=a==null?.42:a; cx.fillStyle='#FFFFFF';
  cx.beginPath(); cx.ellipse(x,y,rx,ry,rot||0,0,6.283); cx.fill(); cx.restore();
}

/* squash & stretch: volume-preserving scale about a base point */
function squashAt(x,y,k){
  cx.translate(x,y); cx.scale(1+k, 1/(1+k)); cx.translate(-x,-y);
}

/* a lumpy cloud, built from overlapping circles and outlined as one shape */
function cloud(x,y,r,seed,fill,alpha,mult){
  const lobes=5, ow=iw(mult==null?0.55:mult);
  const pos=[];
  for(let i=0;i<lobes;i++){
    const a = i/lobes*6.283 + sr(seed+i)*0.5;
    const d = r*(0.40+sr(seed+i+30)*0.22);
    pos.push({x:x+Math.cos(a)*d, y:y+Math.sin(a)*d*0.72,
              r:r*(0.52+sr(seed+i+60)*0.30)});
  }
  cx.save(); cx.globalAlpha = alpha==null?1:alpha;
  /* the outline, laid down as a slightly larger silhouette */
  cx.fillStyle = INK; cx.beginPath();
  pos.forEach(q=>{ cx.moveTo(q.x+q.r+ow, q.y); cx.arc(q.x,q.y,q.r+ow,0,6.283); });
  cx.fill();
  /* the body on top */
  cx.fillStyle = fill||'#FFF6E8'; cx.beginPath();
  pos.forEach(q=>{ cx.moveTo(q.x+q.r, q.y); cx.arc(q.x,q.y,q.r,0,6.283); });
  cx.fill();
  cx.restore();
}

/* comic impact star — the flash on a rim strike */
function burst(x,y,r,spikes,col,rot){
  cx.save(); cx.translate(x,y); cx.rotate(rot||0);
  cx.beginPath();
  const n=(spikes||8)*2;
  for(let i=0;i<n;i++){
    const a=i/n*6.283, rad = (i%2? r*0.44 : r) * (0.82+sr(i*7.3)*0.36);
    const px=Math.cos(a)*rad, py=Math.sin(a)*rad;
    i? cx.lineTo(px,py) : cx.moveTo(px,py);
  }
  cx.closePath(); inkFill(col||'#FFEB9C', 0.5);
  cx.restore();
}

/* radiating speed lines, the classic "this thing moved fast" mark */
function speedLines(x,y,r0,r1,n,ang,spread,col,w){
  cx.save(); cx.strokeStyle=col||'rgba(255,244,214,.8)';
  cx.lineWidth=w||iw(0.45); cx.lineCap='round';
  for(let i=0;i<n;i++){
    const a = ang + (i/(n-1)-0.5)*spread + (sr(i*4.1)-0.5)*0.12;
    const k = 0.7+sr(i*9.7)*0.6;
    cx.beginPath();
    cx.moveTo(x+Math.cos(a)*r0, y+Math.sin(a)*r0);
    cx.lineTo(x+Math.cos(a)*r1*k, y+Math.sin(a)*r1*k);
    cx.stroke();
  }
  cx.restore();
}

/* an outlined display word, drawn straight onto the canvas */
function inkText(str,x,y,size,fill,mult,font,rot){
  cx.save(); cx.translate(x,y); if(rot) cx.rotate(rot);
  cx.font='400 '+size+'px '+(font||'Lalezar, Cairo, sans-serif');
  cx.textAlign='center'; cx.textBaseline='middle';
  cx.lineJoin='round'; cx.lineWidth=Math.max(3,size*(mult==null?0.19:mult));
  cx.strokeStyle=INK; cx.strokeText(str,0,0);
  cx.fillStyle=fill; cx.fillText(str,0,0);
  cx.restore();
}

/* screen shake — one CSS animation retriggered, so it costs nothing */
function kick(power){
  const el=$('#app'); if(!el) return;
  el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake');
  if(navigator.vibrate && (power||1)>0.7){ try{navigator.vibrate(12)}catch(e){} }
}

/* short-lived flourishes the scene draws on top of everything */
const FLAIR = [];
function flair(o){ o.t=0; o.dur=o.dur||0.42; FLAIR.push(o); }
function stepFlair(dt){
  for(let i=FLAIR.length-1;i>=0;i--){ FLAIR[i].t+=dt; if(FLAIR[i].t>=FLAIR[i].dur) FLAIR.splice(i,1); }
}
function drawFlair(tm){
  FLAIR.forEach(f=>{
    const u=clamp(f.t/f.dur,0,1);
    if(f.kind==='burst'){
      cx.save(); cx.globalAlpha=(1-u)*(1-u);
      burst(f.x,f.y, f.r*(0.4+u*1.5), f.spikes||9, f.col||'#FFEB9C', f.rot||0);
      cx.restore();
    } else if(f.kind==='ring'){
      cx.save(); cx.globalAlpha=(1-u)*0.85;
      cx.beginPath(); cx.ellipse(f.x,f.y,f.r*(0.2+u*1.7),f.r*(0.2+u*1.7)*0.42,0,0,6.283);
      cx.lineWidth=iw(0.5)*(1-u*0.6); cx.strokeStyle=f.col||'#FFF0C8'; cx.stroke();
      cx.restore();
    } else if(f.kind==='lines'){
      cx.save(); cx.globalAlpha=(1-u);
      speedLines(f.x,f.y,f.r*(0.5+u*0.9),f.r*(1.1+u*1.2),f.n||7,f.ang||0,f.spread||1.6,f.col);
      cx.restore();
    } else if(f.kind==='confetti'){
      cx.save();
      f.bits.forEach((b,i)=>{
        const px=f.x+b.vx*u*f.r, py=f.y+b.vy*u*f.r + 0.9*f.r*u*u;
        cx.save(); cx.translate(px,py); cx.rotate(b.rot+u*b.spin);
        cx.globalAlpha=clamp(1-u*1.1,0,1);
        inkRR(-b.s,-b.s*0.42,b.s*2,b.s*0.84,b.s*0.3,b.col,0.32);
        cx.restore();
      });
      cx.restore();
    }
  });
}
function confetti(x,y,r,n){
  const cols=['#FFD97A','#FF6A45','#5CE6A8','#4FC8FF','#FF7AD9','#FFF3D8'];
  const bits=[];
  for(let i=0;i<(n||18);i++){
    const a=rnd(-3.0,-0.15);
    bits.push({vx:Math.cos(a)*rnd(.5,1.3), vy:Math.sin(a)*rnd(.6,1.35),
               rot:rnd(0,6.28), spin:rnd(-9,9), s:rnd(2.6,5.2), col:pick(cols)});
  }
  flair({kind:'confetti', x, y, r:r||H*0.3, bits, dur:1.15});
}

/* Cartoon stainless: two flat bands of tone, one hard white stripe, and a
   heavy ink outline. Reads as steel from a metre away without a gradient
   mesh, which is what the old version spent its pixels on. */
function steelBody(x,yTop,rx,ry,depth,tintDark){
  cx.beginPath();
  cx.moveTo(x-rx,yTop);
  cx.lineTo(x-rx*0.94, yTop+depth);
  cx.ellipse(x, yTop+depth, rx*0.94, ry*0.94, 0, Math.PI, 0, true);
  cx.lineTo(x+rx, yTop);
  cx.ellipse(x, yTop, rx, ry, 0, 0, Math.PI, false);
  cx.closePath();
  inkFill(tintDark? '#7F8FA0' : '#93A3B4', 0.95);
  /* flat shadow side */
  cx.save(); cx.clip();
  cx.fillStyle='rgba(38,54,72,.42)';
  cx.fillRect(x+rx*0.16, yTop-ry*2, rx, depth+ry*4);
  cx.fillStyle='rgba(24,34,48,.30)';
  cx.fillRect(x-rx*1.2, yTop+depth*0.62, rx*2.4, depth);
  /* the one hard highlight stripe */
  cx.fillStyle='rgba(255,255,255,.62)';
  rr(x-rx*0.74, yTop+ry*0.4, rx*0.26, depth*0.74, rx*0.13); cx.fill();
  cx.fillStyle='rgba(255,255,255,.30)';
  rr(x-rx*0.40, yTop+ry*0.5, rx*0.12, depth*0.60, rx*0.06); cx.fill();
  cx.restore();
}
function steelRim(x,y,rx,ry,th){
  ell(x,y,rx,ry);
  cx.lineWidth = th; cx.strokeStyle = '#D9E4EF'; cx.stroke();
  cx.lineWidth = th*0.42; cx.strokeStyle='#FFFFFF';
  cx.beginPath(); cx.ellipse(x,y-th*.26,rx*.97,ry*.92,0,Math.PI*1.12,Math.PI*1.86); cx.stroke();
  ell(x,y,rx+th*0.5,ry+th*0.5); inkPath(0.8);
  ell(x,y,rx-th*0.5,ry-th*0.5); inkPath(0.6);
}

/* ------------------------------------------------------- vat contents fill */
function fillRice(x,y,rx,ry,seed,col,col2,heap){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle=col; ell(x,y+(heap?-ry*.12:0),rx,ry*(heap?1.05:1)); cx.fill();
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,255,255,.22)'],[1,'rgba(0,0,0,.3)']]);
  ell(x,y,rx,ry); cx.fill();
  const n=Math.floor(rx*ry*0.055)+22;
  for(let i=0;i<n;i++){
    const a=sr(seed+i)*6.283, r=Math.sqrt(sr(seed+i+900));
    const px=x+Math.cos(a)*rx*r*.93, py=y+Math.sin(a)*ry*r*.93;
    cx.fillStyle = sr(seed+i+300)>.72 ? col2 : 'rgba(255,255,255,.42)';
    cx.beginPath(); cx.ellipse(px,py,1.5+sr(seed+i+7)*1.3,.85+sr(seed+i+13)*.7,sr(seed+i+21)*3,0,6.283); cx.fill();
  }
  cx.restore();
}
function fillMac(x,y,rx,ry,seed){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle='#D9C285'; ell(x,y,rx,ry); cx.fill();
  const n=Math.floor(rx*.9)+18;
  for(let i=0;i<n;i++){
    const a=sr(seed+i)*6.283, r=Math.sqrt(sr(seed+i+500));
    const px=x+Math.cos(a)*rx*r*.9, py=y+Math.sin(a)*ry*r*.9, rot=sr(seed+i+80)*3.14;
    cx.save(); cx.translate(px,py); cx.rotate(rot);
    cx.fillStyle='#F3E3B2'; rr(-4.5,-1.9,9,3.8,1.9); cx.fill();
    cx.fillStyle='rgba(160,130,70,.55)'; rr(-4.5,-1.9,2,3.8,1); cx.fill();
    cx.restore();
  }
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,255,255,.18)'],[1,'rgba(0,0,0,.3)']]);
  ell(x,y,rx,ry); cx.fill(); cx.restore();
}
function fillLentil(x,y,rx,ry,seed){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle='#4A3220'; ell(x,y,rx,ry); cx.fill();
  const n=Math.floor(rx*1.5)+26;
  for(let i=0;i<n;i++){
    const a=sr(seed+i)*6.283, r=Math.sqrt(sr(seed+i+400));
    const px=x+Math.cos(a)*rx*r*.92, py=y+Math.sin(a)*ry*r*.92;
    cx.fillStyle = sr(seed+i+60)>.5?'#7C5432':'#93683E';
    cx.beginPath(); cx.ellipse(px,py,2.1+sr(seed+i)*.9,1.6+sr(seed+i+3)*.7,0,0,6.283); cx.fill();
    cx.fillStyle='rgba(255,225,185,.3)';
    cx.beginPath(); cx.ellipse(px-.5,py-.6,.9,.6,0,0,6.283); cx.fill();
  }
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,255,255,.13)'],[1,'rgba(0,0,0,.36)']]);
  ell(x,y,rx,ry); cx.fill(); cx.restore();
}
function fillChick(x,y,rx,ry,seed){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle='#9A7C45'; ell(x,y,rx,ry); cx.fill();
  const n=Math.floor(rx*.8)+14;
  for(let i=0;i<n;i++){
    const a=sr(seed+i)*6.283, r=Math.sqrt(sr(seed+i+700));
    const px=x+Math.cos(a)*rx*r*.88, py=y+Math.sin(a)*ry*r*.88, s=2.9+sr(seed+i+9)*1.5;
    cx.fillStyle=rg(px-s*.3,py-s*.4,s*.1,s*1.2,[[0,'#F0DCA6'],[.55,'#D7B673'],[1,'#A8853F']]);
    cx.beginPath(); cx.ellipse(px,py,s,s*.88,sr(seed+i+2)*3,0,6.283); cx.fill();
  }
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,255,255,.15)'],[1,'rgba(0,0,0,.32)']]);
  ell(x,y,rx,ry); cx.fill(); cx.restore();
}
function fillSalsa(x,y,rx,ry,seed,tm){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle='#8E2413'; ell(x,y,rx,ry); cx.fill();
  cx.fillStyle=rg(x-rx*.25,y-ry*.4,1,rx*1.5,[[0,'#C9432A'],[.6,'#AA2C18'],[1,'#77190D']]);
  ell(x,y,rx,ry); cx.fill();
  for(let i=0;i<7;i++){
    const ph=(tm*.0006+i*.9)%1, a=sr(seed+i)*6.283;
    const px=x+Math.cos(a)*rx*.55, py=y+Math.sin(a)*ry*.5;
    const s=(1-Math.abs(ph*2-1))*(3+sr(seed+i+5)*3);
    cx.fillStyle='rgba(255,170,140,.2)';
    cx.beginPath(); cx.ellipse(px,py,s,s*.7,0,0,6.283); cx.fill();
  }
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,190,160,.3)'],[.5,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,.4)']]);
  ell(x,y,rx,ry); cx.fill(); cx.restore();
}
function fillOnion(x,y,rx,ry,seed,crisp){
  cx.save(); ell(x,y,rx,ry); cx.clip();
  cx.fillStyle='#6E3D12'; ell(x,y,rx,ry); cx.fill();
  const n=Math.floor(rx*1.9)+32;
  const hi = crisp==null?1:crisp;
  for(let i=0;i<n;i++){
    const a=sr(seed+i)*6.283, r=Math.sqrt(sr(seed+i+200));
    const px=x+Math.cos(a)*rx*r*.94, py=y+Math.sin(a)*ry*r*.94;
    const rot=sr(seed+i+40)*3.14, len=5+sr(seed+i+11)*6;
    cx.save(); cx.translate(px,py); cx.rotate(rot);
    const v=sr(seed+i+77);
    cx.strokeStyle = v>.78 ? '#7C4409' : (v>.4? (hi>.6?'#EEA847':'#C8862F') : (hi>.6?'#D98A2B':'#A9681E'));
    cx.lineWidth=1.5+sr(seed+i+31)*.9; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(-len/2,0);
    cx.quadraticCurveTo(0,(sr(seed+i+53)-.5)*5*hi, len/2,0); cx.stroke();
    cx.restore();
  }
  cx.fillStyle=lg(0,y-ry,0,y+ry,[[0,'rgba(255,230,180,.2)'],[1,'rgba(0,0,0,.3)']]);
  ell(x,y,rx,ry); cx.fill(); cx.restore();
}
const FILL = {
  rzmix:(x,y,rx,ry,s,tm)=>fillRice(x,y,rx,ry,s,'#CFA96F','#5E3D22',1),
  ruz:  (x,y,rx,ry,s,tm)=>fillRice(x,y,rx,ry,s,'#E3CE9C','#A8793F',1),
  maca: (x,y,rx,ry,s,tm)=>fillMac(x,y,rx,ry,s),
  ads:  (x,y,rx,ry,s,tm)=>fillLentil(x,y,rx,ry,s),
  homos:(x,y,rx,ry,s,tm)=>fillChick(x,y,rx,ry,s),
  salsa:(x,y,rx,ry,s,tm)=>fillSalsa(x,y,rx,ry,s,tm),
  taqleya:(x,y,rx,ry,s,tm,cr)=>fillOnion(x,y,rx,ry,s,cr)
};

/* ------------------------------------------------------------------ steam
   Outlined cloud lobes that grow and drift, not a soft gradient wash —
   this is the single biggest tell that the scene is drawn, not rendered. */
function steam(x,y,rx,strength,tm,tint){
  const n = Math.round(2+strength*3);
  for(let i=0;i<n;i++){
    const ph = ((tm*0.00018) + i/n + sr(x*3+i)*.4) % 1;
    const sx = x + Math.sin(ph*4.2 + i*2.1)*rx*.40 + (sr(i+x)-.5)*rx*.38;
    const sy = y - ph*rx*1.45;
    const r  = rx*(.20+ph*.42);
    const a  = clamp((1-ph)*(1-ph)*0.72*strength, 0, .8);
    if(a<0.02) continue;
    cloud(sx, sy, r, i*13+Math.floor(x), tint||'#FFF6EA', a, 0.30);
  }
}

/* ------------------------------------------------------------ people (POV)
   Big heads, small bodies, one ink line around everything. Faces are the
   game's second HUD: the eyes, brows and mouth all read off how much
   patience the person has left, so you can feel a queue souring without
   looking at a bar. */
const SKIN = ['#C98A5E','#E0A877','#F0C79A','#A9683F','#D79B6B','#B87A4E'];
const CLOTH= ['#3E7BA8','#8C5AA8','#2FA878','#C4523F','#5A62B8','#D49A2A',
              '#6FA83E','#E0713A','#3A8FA8','#8A8F99'];
function makeLook(i,arch){
  const r=n=>sr(i*13.7+n);
  return {
    skin: SKIN[Math.floor(r(1)*SKIN.length)],
    cloth: CLOTH[Math.floor(r(2)*CLOTH.length)],
    hat: arch==='tourist' ? 'sun' : (r(3)<.22?'taqiya' : (r(3)<.34?'cap':null)),
    hijab: arch==='tourist' ? false : r(4)<.32,
    hijabCol: CLOTH[Math.floor(r(9)*CLOTH.length)],
    beard: r(5)<.34, glasses: arch==='critic' || r(6)<.16,
    tourist: arch==='tourist', arch: arch||'walkin',
    blinkOff: r(10)*4, h: .92+r(8)*.16
  };
}
/* mood 1 = delighted and patient, 0 = about to walk out */
function drawPerson(x,baseY,h,lk,tm,i,mood,hot){
  if(mood==null) mood=1;
  const hw = h*0.30, headR = h*0.145;          /* bigger head = more cartoon */
  const anx = 1-mood;                           /* anxiety */
  const bobRate = 0.0022 + anx*0.0075;
  const bob = Math.sin(tm*bobRate + i*1.7)*h*(0.012+anx*0.020);
  const jitter = anx>0.72 ? Math.sin(tm*0.048+i)*h*0.010 : 0;
  const y = baseY + bob;
  const lean = Math.sin(tm*0.0013+i*2.2)*0.035 + anx*0.05;
  cx.save();
  cx.translate(x+jitter, y); cx.rotate(lean); cx.translate(-x, -y);

  /* ground shadow keeps them planted */
  cx.save(); cx.globalAlpha=.28; cx.fillStyle='#1A0B05';
  cx.beginPath(); cx.ellipse(x, y+h*0.015, hw*0.80, h*0.022,0,0,6.283); cx.fill(); cx.restore();

  /* ---- body: one rounded bell, ink outlined */
  cx.beginPath();
  cx.moveTo(x-hw*.74, y);
  cx.quadraticCurveTo(x-hw*.92, y-h*.44, x-hw*.54, y-h*.62);
  cx.quadraticCurveTo(x, y-h*.72, x+hw*.54, y-h*.62);
  cx.quadraticCurveTo(x+hw*.92, y-h*.44, x+hw*.74, y);
  cx.closePath();
  inkFill(lk.cloth, 0.85);
  cx.save(); cx.clip();
  cx.fillStyle='rgba(0,0,0,.20)';
  cx.fillRect(x+hw*.14, y-h*.8, hw, h);
  cx.fillStyle='rgba(255,255,255,.20)';
  rr(x-hw*.54, y-h*.56, hw*.22, h*.34, hw*.11); cx.fill();
  cx.restore();
  /* collar notch */
  cx.beginPath();
  cx.moveTo(x-hw*.30,y-h*.60); cx.lineTo(x,y-h*.46); cx.lineTo(x+hw*.30,y-h*.60);
  cx.lineTo(x,y-h*.53); cx.closePath();
  inkFill('rgba(255,255,255,.70)', 0.35);

  /* ---- arms: a simple raised arm when they are waving a ticket */
  if(i===0){
    cx.save();
    const swing = Math.sin(tm*0.004)*0.12 + anx*0.20;
    const arm=()=>{ cx.beginPath(); cx.moveTo(x+hw*.55, y-h*.50);
      cx.quadraticCurveTo(x+hw*1.00, y-h*(.46+swing), x+hw*1.12, y-h*(.32+swing)); };
    cx.lineCap='round';
    cx.strokeStyle=INK;      cx.lineWidth=hw*0.26+iw(0.8); arm(); cx.stroke();
    cx.strokeStyle=lk.cloth; cx.lineWidth=hw*0.26;         arm(); cx.stroke();
    /* the hand at the end of it, holding the ticket out */
    const px=x+hw*1.12, py=y-h*(.32+swing);
    inkEll(px, py, headR*0.30, headR*0.30, lk.skin, 0.42);
    cx.save(); cx.translate(px+hw*0.10, py-h*0.02); cx.rotate(-0.24);
    rr(-hw*0.24,-h*0.045,hw*0.48,h*0.090,2); inkFill('#FFF3D8',0.32);
    cx.fillStyle='rgba(60,44,30,.5)';
    for(let l=0;l<2;l++) cx.fillRect(-hw*0.16,-h*0.022+l*h*0.024,hw*0.32,1.4);
    cx.restore();
    cx.restore();
  }

  /* ---- neck + head */
  const hy = y-h*.70-headR*.62;
  inkRR(x-headR*.30, y-h*.74, headR*.60, h*.10, headR*.2, lk.skin, 0.5);
  inkEll(x, hy, headR*.92, headR, lk.skin, 0.85);
  /* cheek blush — small, warm, very cartoon */
  cx.save(); cx.globalAlpha=.30; cx.fillStyle='#E0563F';
  cx.beginPath(); cx.ellipse(x-headR*.58, hy+headR*.26, headR*.22, headR*.14,0,0,6.283); cx.fill();
  cx.beginPath(); cx.ellipse(x+headR*.58, hy+headR*.26, headR*.22, headR*.14,0,0,6.283); cx.fill();
  cx.restore();

  /* hair / hijab / hat */
  if(lk.hijab){
    cx.beginPath();
    cx.ellipse(x, hy-headR*.04, headR*1.14, headR*1.20, 0, Math.PI*.84, Math.PI*2.16);
    cx.lineTo(x+headR*1.00, y-h*.56); cx.lineTo(x-headR*1.00, y-h*.56); cx.closePath();
    inkFill(lk.hijabCol, 0.7);
    cx.save(); cx.globalAlpha=.30; cx.fillStyle='#000';
    cx.beginPath(); cx.ellipse(x+headR*.52,hy-headR*.02,headR*.46,headR*1.0,0,0,6.283); cx.fill();
    cx.restore();
  } else {
    cx.beginPath(); cx.ellipse(x, hy-headR*.34, headR*.94, headR*.62, 0, Math.PI, 0);
    inkFill('#2A170D', 0.5);
  }
  if(lk.hat==='taqiya'){
    cx.beginPath(); cx.ellipse(x, hy-headR*.52, headR*.84, headR*.56, 0, Math.PI, 0);
    inkFill('#FFF6E2', 0.5);
  } else if(lk.hat==='cap'){
    cx.beginPath(); cx.ellipse(x, hy-headR*.48, headR*.88, headR*.54, 0, Math.PI, 0);
    inkFill('#3E7BA8', 0.5);
    inkRR(x-headR*.16, hy-headR*.60, headR*1.32, headR*.28, headR*.12, '#31648A', 0.4);
  } else if(lk.hat==='sun'){
    cx.beginPath(); cx.ellipse(x, hy-headR*.42, headR*1.55, headR*.40, 0, 0, 6.283);
    inkFill('#F0D79A', 0.5);
    cx.beginPath(); cx.ellipse(x, hy-headR*.62, headR*.78, headR*.46, 0, Math.PI, 0);
    inkFill('#E8CB86', 0.45);
  }

  /* ---- face: the whole mood machine */
  const ey = hy-headR*.10, eo = headR*.34;
  const blink = ((tm*0.001 + lk.blinkOff) % 3.4) < 0.10;
  const angry = mood<0.24, worry = mood<0.52, glee = mood>0.88;
  cx.fillStyle='#20150E';
  if(blink){
    cx.lineWidth=headR*.11; cx.strokeStyle='#20150E'; cx.lineCap='round';
    [-1,1].forEach(sg=>{ cx.beginPath();
      cx.moveTo(x+sg*eo-headR*.13, ey); cx.lineTo(x+sg*eo+headR*.13, ey); cx.stroke(); });
  } else if(angry){
    /* narrowed, furious slits */
    cx.lineWidth=headR*.15; cx.strokeStyle='#20150E'; cx.lineCap='round';
    [-1,1].forEach(sg=>{ cx.beginPath();
      cx.moveTo(x+sg*eo-headR*.15, ey-headR*.04); cx.lineTo(x+sg*eo+headR*.15, ey+headR*.04); cx.stroke(); });
  } else {
    const er = headR*(glee?.155:.135);
    [-1,1].forEach(sg=>{
      cx.beginPath(); cx.ellipse(x+sg*eo, ey, er, er*1.12, 0,0,6.283); cx.fill();
      cx.save(); cx.fillStyle='#FFFFFF';
      cx.beginPath(); cx.arc(x+sg*eo-er*.32, ey-er*.38, er*.36, 0, 6.283); cx.fill(); cx.restore();
    });
  }
  /* brows say more than the eyes do */
  cx.lineWidth=headR*.12; cx.strokeStyle='#2A170D'; cx.lineCap='round';
  [-1,1].forEach(sg=>{
    const tilt = angry? sg*headR*.16 : (worry? -sg*headR*.13 : 0);
    cx.beginPath();
    cx.moveTo(x+sg*eo-headR*.19, ey-headR*.36+tilt);
    cx.lineTo(x+sg*eo+headR*.19, ey-headR*.36-tilt*0.7);
    cx.stroke();
  });
  /* mouth */
  cx.lineWidth=headR*.12; cx.strokeStyle='#3A1E12'; cx.lineCap='round';
  const my = hy+headR*.44;
  if(angry){
    cx.beginPath(); cx.ellipse(x, my+headR*.02, headR*.26, headR*.20, 0, 0, 6.283);
    inkFill('#7A2418', 0.30);
  } else if(worry){
    cx.beginPath(); cx.arc(x, my+headR*.26, headR*.28, Math.PI*1.22, Math.PI*1.78); cx.stroke();
  } else if(glee){
    cx.beginPath(); cx.arc(x, my-headR*.10, headR*.32, 0.30, Math.PI-0.30);
    inkFill('#8C2E26', 0.26);
    cx.save(); cx.fillStyle='#FFFFFF';
    cx.beginPath(); cx.ellipse(x, my-headR*.06, headR*.26, headR*.07,0,0,6.283); cx.fill(); cx.restore();
  } else {
    cx.beginPath(); cx.arc(x, my-headR*.06, headR*.24, 0.42, Math.PI-0.42); cx.stroke();
  }
  if(lk.beard && !lk.hijab){
    cx.save(); cx.globalAlpha=.85;
    cx.beginPath(); cx.ellipse(x, hy+headR*.46, headR*.66, headR*.44, 0, 0, Math.PI);
    inkFill('#32200F', 0.35); cx.restore();
  }
  if(lk.glasses){
    cx.strokeStyle='#1A1410'; cx.lineWidth=headR*.09;
    cx.beginPath(); cx.arc(x-eo,ey,headR*.28,0,6.283); cx.arc(x+eo,ey,headR*.28,0,6.283);
    cx.moveTo(x-headR*.07,ey); cx.lineTo(x+headR*.07,ey); cx.stroke();
  }
  /* a tourist takes a photograph of you; the flash is the joke */
  if(lk.tourist && i===0 && Math.sin(tm*0.0016+i)>0.93){
    cx.save(); cx.globalAlpha=.75; cx.fillStyle='#FFFFFF';
    cx.beginPath(); cx.arc(x+hw*1.1, hy, headR*.7,0,6.283); cx.fill(); cx.restore();
  }
  /* anger marks over the head when they are nearly gone */
  if(anx>0.78){
    const p=(tm*0.004)%1;
    cx.save(); cx.globalAlpha=clamp(1-p,0,1)*0.9; cx.strokeStyle='#FF5F52';
    cx.lineWidth=iw(0.4); cx.lineCap='round';
    for(let k=0;k<3;k++){
      const a=-1.9+k*0.55;
      cx.beginPath();
      cx.moveTo(x+Math.cos(a)*headR*(1.25+p*.3), hy+Math.sin(a)*headR*(1.25+p*.3));
      cx.lineTo(x+Math.cos(a)*headR*(1.62+p*.4), hy+Math.sin(a)*headR*(1.62+p*.4));
      cx.stroke();
    }
    cx.restore();
  }
  /* a heat shimmer of chili for the shatta-lovers */
  if(hot){
    cx.save(); cx.globalAlpha=.7;
    inkText('🌶', x+hw*0.95, hy-headR*0.5, headR*0.9, '#FF3B24', 0.12, 'Cairo, sans-serif');
    cx.restore();
  }
  cx.restore();
}

/* ------------------------------------------------------------ scene layout */
const LAY = {vats:[], bowl:{}, counterY:0, spoonPivot:{}};
function layout(){
  const vats = ch().vats;
  LAY.counterY = H*0.365;
  const far = [], near = [];
  const nFar = Math.ceil(vats.length/2);
  vats.forEach((v,i)=>{ (i < nFar ? far : near).push(v); });
  LAY.vats = [];
  /* both rows share one pitch so the near row tucks into the gaps of the far
     row instead of drifting apart when the counts differ */
  const span = W*0.90, pitch = span/nFar;
  const place = (arr,yc,rxCap,ratio,row,grow)=>{
    const n = arr.length;
    /* the near row spreads over its own span so two vessels never collide */
    const nearPitch = row===1 ? Math.min(pitch*1.35, W*0.86/Math.max(1,n)) : pitch;
    arr.forEach((k,i)=>{
      const x = W/2 + (i-(n-1)/2)*nearPitch;
      let rx = Math.min(W*rxCap, nearPitch*grow);
      /* the ward tray is the widest thing on the counter, but only just */
      if(ING[k].vessel==='tray') rx = Math.min(rx*1.06, nearPitch*0.42);
      LAY.vats.push({k, x, y:yc, rx, ry:rx*ratio, row});
    });
  };
  place(far,  H*0.436, .128, 0.38, 0, 0.42);
  place(near, H*0.628, .150, 0.40, 1, 0.44);
  LAY.bowl = {x:W*0.335, y:H*0.828, rx:Math.min(W*0.180,H*0.092), ry:0};
  LAY.bowl.ry = LAY.bowl.rx*0.37;
  LAY.spoonPivot = {x:W*1.02, y:H*1.00};
}
function vatAt(px,py){
  for(let i=LAY.vats.length-1;i>=0;i--){
    const v=LAY.vats[i];
    const dx=(px-v.x)/(v.rx*1.18), dy=(py-v.y)/(v.ry*2.0);
    if(dx*dx+dy*dy<=1) return v;
  }
  return null;
}

/* ------------------------------------------------------- background venues
   Flat colour blocks, hard outlines, saturated light. The old version was
   almost black; a cartoon needs the back of the room to be readable. */
function drawBeyond(tm){
  const venue = ch().venue, y0=0, y1=LAY.counterY+H*0.02;
  cx.save(); cx.beginPath(); cx.rect(0,y0,W,y1); cx.clip();

  if(venue==='cart'){
    /* dusk street, warm and open */
    cx.fillStyle = lg(0,0,0,y1,[[0,'#2E4A7A'],[.42,'#6B5480'],[.74,'#B0684E'],[1,'#7A4530']]);
    cx.fillRect(0,0,W,y1);
    /* a fat cartoon moon */
    cx.save(); cx.globalAlpha=.9;
    inkEll(W*.80, y1*.16, W*.062, W*.062, '#FFF0BE', 0.45);
    cx.globalAlpha=.16; cx.fillStyle='#FFE8A8';
    cx.beginPath(); cx.arc(W*.80, y1*.16, W*.20, 0, 6.283); cx.fill();
    cx.restore();
    /* building fronts, each its own outlined block */
    for(let b=0;b<5;b++){
      const bx=(b/5)*W - W*.04, bw=W*.26, bh=y1*(.50+sr(b*4)*.34);
      inkRR(bx, y1-bh, bw, bh+4, W*.012, b%2? '#4A3E5E':'#5B4352', 0.7);
      for(let r=0;r<4;r++) for(let c=0;c<3;c++){
        const on = sr(b*9+r*3+c)>.42;
        inkRR(bx+bw*(.13+c*.28), y1-bh+bh*(.10+r*.20), bw*.18, bh*.12, 2,
              on ? '#FFD97A' : '#2E2438', 0.22);
      }
    }
    /* streetlamp with a visible cone */
    const lx=W*.90;
    cx.save(); cx.globalAlpha=.30; cx.fillStyle='#FFD68A';
    cx.beginPath(); cx.moveTo(lx,y1*.16); cx.lineTo(lx-W*.32,y1); cx.lineTo(lx+W*.18,y1);
    cx.closePath(); cx.fill(); cx.restore();
    inkRR(lx-W*.012, y1*.16, W*.024, y1*.9, 3, '#3A2F3E', 0.5);
    inkEll(lx, y1*.15, W*.042, W*.030, '#FFE9A8', 0.5);
  } else {
    const neon = venue==='neon';
    /* warm shop interior wall */
    cx.fillStyle = neon ? '#5E2A38' : '#6B4028';
    cx.fillRect(0,0,W,y1);
    /* big glazed tiles, outlined, in two alternating tones */
    const tw=W*.155, th=tw*.80;
    for(let r=0;r*th<y1;r++) for(let c=0;c*tw<W;c++){
      const v=sr(r*17+c*3);
      const base = neon
        ? (v>.5? '#7A4050' : '#6A3646')
        : (v>.5? '#8A5730' : '#7A4B2A');
      inkRR(c*tw+2, r*th+2, tw-4, th-4, W*.012, base, 0.20);
      cx.save(); cx.globalAlpha=.20; cx.fillStyle='#FFFFFF';
      rr(c*tw+6, r*th+6, tw*.30, th*.16, 3); cx.fill(); cx.restore();
    }
    if(has('mirror')){
      for(let i=0;i<3;i++){
        const mx=W*(.10+i*.33);
        inkRR(mx, y1*.06, W*.22, y1*.62, W*.02, 'rgba(190,225,255,.30)', 0.55);
        cx.save(); cx.globalAlpha=.5; cx.fillStyle='#FFFFFF';
        cx.beginPath(); cx.moveTo(mx+W*.02, y1*.64); cx.lineTo(mx+W*.13, y1*.10);
        cx.lineTo(mx+W*.08, y1*.64); cx.closePath(); cx.fill(); cx.restore();
        cx.strokeStyle='#F0A82E'; cx.lineWidth=iw(0.5);
        rr(mx, y1*.06, W*.22, y1*.62, W*.02); cx.stroke();
      }
    }
    /* the founder's portrait and a framed newspaper clipping */
    for(let i=0;i<2;i++){
      const fx=W*(.07+i*.63), fy=y1*.13, fw=W*.17, fh=fw*.80;
      cx.save(); cx.translate(fx+fw/2, fy+fh/2); cx.rotate(i?0.035:-0.035);
      cx.translate(-(fx+fw/2), -(fy+fh/2));
      inkRR(fx,fy,fw,fh,W*.012,'#B07A2E',0.6);
      inkRR(fx+4,fy+4,fw-8,fh-8,W*.008, i? '#F2E6C8' : '#8AB4D8', 0.35);
      if(i){
        cx.fillStyle='rgba(50,36,24,.6)';
        for(let l=0;l<4;l++) cx.fillRect(fx+8,fy+10+l*(fh-20)/4,(fw-16)*(l===0?.72:.95),2);
      } else {
        inkEll(fx+fw/2, fy+fh*.40, fw*.15, fw*.17, '#D79B6B', 0.28);
        cx.beginPath(); cx.moveTo(fx+fw*.24,fy+fh-5);
        cx.quadraticCurveTo(fx+fw/2,fy+fh*.46,fx+fw*.76,fy+fh-5);
        cx.closePath(); inkFill('#C4523F',0.28);
      }
      cx.restore();
    }
    if(neon){
      const pulse = .72+Math.sin(tm*.004)*.28;
      for(let i=0;i<2;i++){
        const col = i? '#FF4F7A' : '#4FC8FF';
        cx.save(); cx.globalAlpha=pulse;
        cx.strokeStyle=col; cx.lineWidth=iw(1.1); cx.lineCap='round';
        shadowOn(col, 18);
        cx.beginPath(); cx.moveTo(W*.05, y1*(.05+i*.055)); cx.lineTo(W*.95, y1*(.05+i*.055));
        cx.stroke(); shadowOff();
        cx.strokeStyle='#FFFFFF'; cx.lineWidth=iw(0.30);
        cx.beginPath(); cx.moveTo(W*.05, y1*(.05+i*.055)); cx.lineTo(W*.95, y1*(.05+i*.055));
        cx.stroke();
        cx.restore();
      }
      cx.save(); cx.globalAlpha=.18*pulse;
      cx.fillStyle = rg(W*.5, 0, 2, W*.8, [[0,'#4FC8FF'],[.55,'#FF4F7A'],[1,'rgba(0,0,0,0)']]);
      cx.fillRect(0,0,W,y1); cx.restore();
    }
    /* hanging lamps with visible cones */
    for(let i=0;i<3;i++){
      const lx=W*(.2+i*.3), sway=Math.sin(tm*0.0011+i*2.2)*W*0.008;
      cx.strokeStyle=INK; cx.lineWidth=iw(0.35);
      cx.beginPath(); cx.moveTo(lx,0); cx.lineTo(lx+sway,y1*.10); cx.stroke();
      cx.save(); cx.globalAlpha=.22; cx.fillStyle='#FFDCA0';
      cx.beginPath(); cx.moveTo(lx+sway-W*.04,y1*.18); cx.lineTo(lx+sway-W*.17,y1*.62);
      cx.lineTo(lx+sway+W*.17,y1*.62); cx.lineTo(lx+sway+W*.04,y1*.18);
      cx.closePath(); cx.fill(); cx.restore();
      cx.beginPath();
      cx.moveTo(lx+sway-W*.045,y1*.18); cx.lineTo(lx+sway+W*.045,y1*.18);
      cx.lineTo(lx+sway+W*.016,y1*.10); cx.lineTo(lx+sway-W*.016,y1*.10); cx.closePath();
      inkFill('#C4523F', 0.55);
      inkEll(lx+sway, y1*.185, W*.020, W*.016, '#FFF3C8', 0.4);
    }
  }
  cx.restore();
}
/* =============================================== the hot counter + the vats */
function drawCounter(tm){
  const fy = LAY.counterY;
  /* the slab, in perspective, as one outlined shape */
  cx.beginPath(); cx.moveTo(W*0.02,fy); cx.lineTo(W*0.98,fy);
  cx.lineTo(W*1.08,H); cx.lineTo(-W*0.08,H); cx.closePath();
  inkFill('#A6B6C6', 1.15);
  cx.save(); cx.clip();
  /* two flat bands instead of a ten-stop gradient */
  cx.fillStyle='rgba(60,82,108,.20)'; cx.fillRect(-W,fy+(H-fy)*0.42,W*3,(H-fy)*0.62);
  cx.fillStyle='rgba(28,44,64,.22)'; cx.fillRect(-W,fy+(H-fy)*0.74,W*3,(H-fy)*0.40);
  /* long brushed highlights, few and deliberate */
  for(let i=0;i<9;i++){
    const yy = fy + (H-fy)*(0.06+sr(i*3.1)*0.86);
    cx.strokeStyle='rgba(255,255,255,'+(0.10+sr(i)*0.14)+')';
    cx.lineWidth=iw(0.22+sr(i+4)*0.22);
    cx.beginPath(); cx.moveTo(-12,yy); cx.lineTo(W+12,yy+(sr(i+7)-.5)*6); cx.stroke();
  }
  /* the hot glow of the counter surface */
  cx.fillStyle = rg(W*.5, fy+H*.02, 2, W*.9,
    [[0,'rgba(255,186,96,.22)'],[.55,'rgba(255,140,70,.07)'],[1,'rgba(0,0,0,0)']]);
  cx.fillRect(0,fy,W,H-fy);
  /* contact shadow under each vessel */
  LAY.vats.forEach(v=>{
    cx.save(); cx.globalAlpha=.32; cx.fillStyle='#24323F';
    cx.beginPath(); cx.ellipse(v.x, v.y+v.ry*2.35, v.rx*1.10, v.rx*.30, 0,0,6.283); cx.fill();
    cx.restore();
  });
  cx.restore();
  /* the front lip: white top line, ink under it */
  cx.strokeStyle='#F2F8FF'; cx.lineWidth=iw(0.8);
  cx.beginPath(); cx.moveTo(W*0.02,fy); cx.lineTo(W*0.98,fy); cx.stroke();
  cx.strokeStyle=INK; cx.lineWidth=iw(1.0);
  cx.beginPath(); cx.moveTo(W*0.02,fy+iw(0.9)); cx.lineTo(W*0.98,fy+iw(0.9)); cx.stroke();
  drawTubStack(W*0.055, fy+H*0.082, W*0.052);
  drawBowlStack(W*0.945, H*0.500, W*0.070);
  drawCondiments(W*0.16, fy+H*0.045, tm);
}
/* the two bottles that live on every koshary table: daqqa and shatta */
function drawCondiments(x,y,tm){
  const hgt=H*0.058, wid=W*0.030;
  [['#FFF6E0',0],['#FF2D18',1]].forEach((c,i)=>{
    const bx=x+i*wid*1.55;
    cx.beginPath();
    cx.moveTo(bx-wid/2, y);
    cx.lineTo(bx-wid/2, y-hgt*0.62);
    cx.quadraticCurveTo(bx-wid*0.16, y-hgt*0.74, bx-wid*0.16, y-hgt*0.92);
    cx.lineTo(bx+wid*0.16, y-hgt*0.92);
    cx.quadraticCurveTo(bx+wid*0.16, y-hgt*0.74, bx+wid/2, y-hgt*0.62);
    cx.lineTo(bx+wid/2, y); cx.closePath();
    inkFill(c[0], 0.45);
    inkRR(bx-wid*0.20, y-hgt*1.06, wid*0.40, hgt*0.16, 2, '#B07A2E', 0.28);
    gloss(bx-wid*0.22, y-hgt*0.34, wid*0.09, hgt*0.20, 0, .55);
  });
}
function drawTubStack(x,y,r){
  for(let i=0;i<6;i++){
    const yy=y-i*r*0.30, sc=r*(1-i*0.012);
    inkRR(x-sc, yy-r*0.30, sc*2, r*0.34, r*0.12, i%2?'#E8EEF4':'#D4DCE4', 0.30);
  }
  inkEll(x, y-5*r*0.30-r*0.28, r*0.96, r*0.22, '#F2F7FB', 0.30);
}
function drawBowlStack(x,y,r){
  const metal = has('bowl');
  for(let i=0;i<5;i++){
    const yy=y-i*r*0.26;
    inkEll(x,yy,r,r*0.30, metal? (i%2?'#C6D2DE':'#AEBCCA') : (i%2?'#E0CDAE':'#CDB894'), 0.32);
  }
  const ty=y-4*r*0.26;
  inkEll(x,ty,r*0.86,r*0.26, metal? '#4A5A6C':'#6A5440', 0.30);
  inkEll(x,ty+r*0.05,r*0.74,r*0.20, metal? '#8B9AAA':'#9C8A74', 0.26);
  gloss(x-r*0.34, ty-r*0.02, r*0.22, r*0.06, -0.2, .6);
}

/* a vat wobbles for a moment after you scoop from it */
const VATHIT = {};
function nudgeVat(k){ VATHIT[k] = 1; }
function stepVats(dt){ for(const k in VATHIT){ VATHIT[k]=Math.max(0,VATHIT[k]-dt*4.2); } }

function drawVat(v,tm){
  const q = S.batch[v.k];
  const empty = ch().kitchen && (!q || q.qty<=0);
  const hit = VATHIT[v.k]||0;
  cx.save();
  if(hit>0){
    /* squash on impact, then a decaying wobble — classic scoop feedback */
    const w = Math.sin(hit*22)*hit*0.09;
    squashAt(v.x, v.y+v.ry*2.4, w);
  }
  if(ING[v.k].vessel==='tray'){ drawTray(v,tm,empty); cx.restore(); return; }
  const depth = v.ry*2.45;
  steelBody(v.x, v.y, v.rx, v.ry, depth, false);
  /* rivets */
  cx.fillStyle='#E6EEF6';
  [-0.62,0.62].forEach(sg=>{ cx.beginPath();
    cx.arc(v.x+sg*v.rx, v.y+depth*0.55, Math.max(1.6,v.rx*0.030),0,6.283); cx.fill(); });
  /* the dark inside of the pot */
  inkEll(v.x, v.y, v.rx*0.90, v.ry*0.90, '#2A3846', 0.55);
  if(!empty){
    const fn = FILL[v.k];
    const crisp = v.k==='taqleya' && q ? crispOf(q) : 1;
    const lvl = ch().kitchen && q ? clamp(q.qty/Math.max(1,batchCap(v.k)),0,1) : 1;
    const rise = lerp(-v.ry*0.52, v.ry*0.02, clamp(lvl,0,1));
    const inset = lerp(0.62, 0.84, clamp(lvl,0,1));
    /* the surface bobs slightly after a scoop */
    const bobY = hit>0 ? Math.sin(hit*20)*hit*v.ry*0.22 : 0;
    fn(v.x, v.y - rise + bobY, v.rx*inset, v.ry*inset, v.x*7+v.y, tm, crisp);
    if(lvl>0.75) gloss(v.x-v.rx*0.26, v.y-v.ry*0.34, v.rx*0.30, v.ry*0.24, -0.25, .30);
    /* a running-low warning the eye catches without reading */
    if(lvl<0.22){
      const bl=0.5+0.5*Math.sin(tm*0.008);
      cx.save(); cx.globalAlpha=bl*0.85;
      inkText('!', v.x+v.rx*0.86, v.y-v.ry*1.5, Math.max(15,v.rx*0.5), '#FFC93C', 0.22);
      cx.restore();
    }
  } else {
    inkEll(v.x, v.y+v.ry*.28, v.rx*.66, v.ry*.62, '#1E2A36', 0.4);
  }
  if(v.k==='salsa' && !empty){
    /* the ladle standing in the sauce */
    cx.save();
    cx.strokeStyle=INK; cx.lineWidth=iw(0.9); cx.lineCap='round';
    cx.beginPath(); cx.moveTo(v.x+v.rx*0.22, v.y+v.ry*0.1);
    cx.lineTo(v.x+v.rx*0.86, v.y-v.ry*2.2); cx.stroke();
    cx.strokeStyle='#D9E4EF'; cx.lineWidth=iw(0.52);
    cx.beginPath(); cx.moveTo(v.x+v.rx*0.22, v.y+v.ry*0.1);
    cx.lineTo(v.x+v.rx*0.86, v.y-v.ry*2.2); cx.stroke();
    inkEll(v.x+v.rx*0.20, v.y+v.ry*0.14, v.rx*0.20, v.ry*0.30, '#C6D2DE', 0.36);
    cx.restore();
  }
  steelRim(v.x, v.y, v.rx, v.ry, Math.max(3.4, v.ry*0.32));
  /* side handles */
  cx.strokeStyle=INK; cx.lineWidth=iw(0.95);
  [-1,1].forEach(sg=>{ cx.beginPath();
    cx.arc(v.x+sg*v.rx*1.0, v.y+depth*0.5, v.ry*0.55, sg>0?-1.1:2.05, sg>0?1.1:4.25); cx.stroke(); });
  cx.strokeStyle='#C6D2DE'; cx.lineWidth=iw(0.52);
  [-1,1].forEach(sg=>{ cx.beginPath();
    cx.arc(v.x+sg*v.rx*1.0, v.y+depth*0.5, v.ry*0.55, sg>0?-1.1:2.05, sg>0?1.1:4.25); cx.stroke(); });
  if(!empty) steam(v.x, v.y-v.ry*1.2, v.rx*.72, v.k==='salsa'?1.15:0.85, tm+v.x*30,
                   v.k==='salsa'?'#FFDCD0':null);
  cx.restore();
  vatLabel(v, empty, v.y + v.ry + depth + Math.max(12,H*0.021));
}
function drawTray(v,tm,empty){
  const d = v.ry*1.15, x0=v.x-v.rx*1.16, y0=v.y-v.ry*0.55, w=v.rx*2.32, h=v.ry*1.5+d;
  inkRR(x0, y0, w, h, Math.max(5,v.rx*0.10), '#B9C6D4', 1.0);
  inkRR(x0+v.rx*0.07, y0+v.ry*0.22, w-v.rx*0.14, h-v.ry*0.48, Math.max(4,v.rx*0.07), '#33404F', 0.5);
  if(!empty){
    const q=S.batch[v.k], crisp = q?crispOf(q):1;
    const lvl = ch().kitchen && q ? clamp(q.qty/Math.max(1,batchCap(v.k)),0,1) : 1;
    cx.save();
    rr(x0+v.rx*0.07, y0+v.ry*0.22, w-v.rx*0.14, h-v.ry*0.48, Math.max(4,v.rx*0.07)); cx.clip();
    fillOnion(v.x, y0+h*0.52, v.rx*1.05, (h*0.52)*lerp(0.66,1,lvl), v.x*5+7, crisp);
    gloss(v.x-v.rx*0.3, y0+h*0.32, v.rx*0.42, h*0.12, -0.1, .28);
    cx.restore();
    /* a few strands spilling over the lip — the ward is always overflowing */
    for(let i=0;i<5;i++){
      const sx=v.x+(sr(i*4.3)-.5)*v.rx*2.1, sy=y0+h+(2+sr(i)*5);
      cx.strokeStyle=INK; cx.lineWidth=iw(0.42);
      cx.beginPath(); cx.moveTo(sx-5,sy); cx.quadraticCurveTo(sx,sy+3,sx+5,sy); cx.stroke();
      cx.strokeStyle=crisp>.6?'#FFAE3C':'#C08434'; cx.lineWidth=iw(0.22);
      cx.beginPath(); cx.moveTo(sx-5,sy); cx.quadraticCurveTo(sx,sy+3,sx+5,sy); cx.stroke();
    }
    if(has('fan')){
      cx.save(); cx.globalAlpha=.22+Math.sin(tm*.02)*.10; cx.strokeStyle='#CFEBFF';
      cx.lineWidth=iw(0.30); cx.lineCap='round';
      for(let i=0;i<3;i++){ cx.beginPath();
        cx.moveTo(x0+v.rx*0.1, y0-8-i*6); cx.lineTo(x0+v.rx*0.1+w*(0.80-i*0.14), y0-8-i*6); cx.stroke(); }
      cx.restore();
    }
  }
  cx.strokeStyle='#F2F8FF'; cx.lineWidth=iw(0.45);
  rr(x0+2, y0+2, w-4, h*0.22, Math.max(4,v.rx*0.08)); cx.stroke();
  vatLabel(v, empty, y0 + h + Math.max(12,H*0.021));
}
function vatLabel(v,empty,ly){
  const label = (ch().slang && S.slangOn) ? slangOf(v.k) : (L==='ar'?ING[v.k].ar:ING[v.k].en);
  const lh = Math.max(17, Math.min(22, H*0.028));
  let fs = Math.min(lh*0.64, 13.5);
  cx.font = '800 '+fs+'px Cairo, system-ui, sans-serif';
  let tw = cx.measureText(label).width;
  const maxW = v.rx*2.15;
  if(tw > maxW-16){ fs = fs*(maxW-16)/tw; cx.font='800 '+fs+'px Cairo, system-ui, sans-serif';
                    tw = cx.measureText(label).width; }
  const lw = Math.min(maxW, tw+20);
  /* a little enamel sign, the kind screwed to the front of the vat */
  rr(v.x-lw/2, ly-lh/2, lw, lh, lh/2);
  inkFill(empty? '#8C2E26' : '#3A2517', 0.55);
  if(!empty){ cx.save(); cx.globalAlpha=.28; cx.fillStyle='#FFFFFF';
    rr(v.x-lw/2+3, ly-lh/2+2.5, lw-6, lh*0.32, lh*0.16); cx.fill(); cx.restore(); }
  txt(label, v.x, ly+.5, Math.max(9,fs), empty?'#FFD4CE':'#FFECC8', 800);
}

/* ==================================================== the bowl in your hand */
function drawBowl(b, tm){
  const {x,y,rx,ry} = LAY.bowl;
  const metal = has('bowl');
  /* the bowl tips toward whatever just landed in it, then settles */
  const tilt = Math.sin(tm*0.0016)*1.6 + (BOWLHIT>0? Math.sin(BOWLHIT*19)*BOWLHIT*7 : 0);
  const lift = BOWLHIT>0 ? -BOWLHIT*ry*0.55 : 0;
  cx.save();
  cx.translate(x,y+lift); cx.rotate(tilt*Math.PI/180); cx.translate(-x,-y);
  if(BOWLHIT>0) squashAt(x, y+ry*2.9, -BOWLHIT*0.07);
  /* drop shadow */
  cx.save(); cx.globalAlpha=.38; cx.fillStyle='#1E2B38';
  cx.beginPath(); cx.ellipse(x,y+ry*3.1,rx*0.92,ry*0.44,0,0,6.283); cx.fill(); cx.restore();
  /* the outside of the bowl, one outlined silhouette */
  cx.beginPath();
  cx.moveTo(x-rx,y);
  cx.quadraticCurveTo(x-rx*0.90, y+ry*2.6, x, y+ry*2.9);
  cx.quadraticCurveTo(x+rx*0.90, y+ry*2.6, x+rx, y);
  cx.ellipse(x,y,rx,ry,0,0,Math.PI,true);
  cx.closePath();
  inkFill(metal? '#C2CEDB' : '#E8D8BC', 1.25);
  cx.save(); cx.clip();
  cx.fillStyle= metal? 'rgba(50,70,94,.30)':'rgba(110,80,52,.30)';
  cx.fillRect(x+rx*0.22, y-ry, rx, ry*4);
  cx.fillStyle='rgba(255,255,255,.55)';
  rr(x-rx*0.78, y+ry*0.5, rx*0.20, ry*1.9, rx*0.10); cx.fill();
  cx.restore();
  /* foot */
  inkEll(x, y+ry*2.92, rx*0.30, ry*0.17, metal? '#8B9AAA':'#BCA98C', 0.42);
  /* the inside */
  inkEll(x,y,rx*0.92,ry*0.92, metal? '#7F8FA0':'#CFBC9C', 0.55);
  cx.save(); cx.globalAlpha=.30; cx.fillStyle='#000';
  ell(x,y-ry*0.10,rx*0.92,ry*0.62); cx.fill(); cx.restore();
  cx.save(); ell(x,y,rx*0.92,ry*0.92); cx.clip();
  drawBowlContents(b,x,y,rx*0.92,ry*0.92,tm);
  cx.restore();
  if(metal) steelRim(x,y,rx,ry,Math.max(3.4,ry*0.26));
  else {
    ell(x,y,rx,ry); cx.lineWidth=Math.max(3.4,ry*0.26); cx.strokeStyle='#F6ECD6'; cx.stroke();
    ell(x,y,rx+ry*0.13,ry+ry*0.13); inkPath(0.8);
    ell(x,y,rx-ry*0.13,ry-ry*0.13); inkPath(0.6);
  }
  /* over-filling shows: food heaped above the rim, and a warning */
  if(OVER>0){
    cx.save(); cx.globalAlpha=clamp(OVER,0,1);
    inkText(L==='ar'?'فايض!':'OVERFULL!', x, y-ry*3.0, Math.min(19,W*.05), '#FF5F52', 0.20,
            'Lalezar, Cairo, sans-serif', Math.sin(tm*0.01)*0.07);
    cx.restore();
  }
  cx.restore();
}
function drawBowlContents(b,x,y,rx,ry,tm){
  const tot = totalScoops(b);
  if(tot<=0) return;
  const carbs = ['rzmix','ruz','maca','ads'];
  let carbTot = 0; carbs.forEach(k=> carbTot += (b.amt[k]||0));
  const h = ry*0.55 + ry*1.55*clamp(carbTot/8,0,1);
  if(carbTot>0){
    cx.save();
    cx.beginPath(); cx.ellipse(x,y+ry*0.55,rx,ry*1.15,0,0,6.283); cx.clip();
    let acc=0;
    b.order.forEach((k,idx)=>{
      if(carbs.indexOf(k)<0) return;
      const frac=(b.amtByStep[idx]||1)/carbTot;
      const yb = y+ry*0.55 - h*acc, yt = y+ry*0.55 - h*(acc+frac);
      cx.save();
      cx.beginPath(); cx.rect(x-rx,yt-2,rx*2,(yb-yt)+4); cx.clip();
      FILL[k](x, (yt+yb)/2, rx*0.99, Math.max(5,(yb-yt)/2+ry*.26), idx*91+k.length*37, tm, 1);
      cx.restore();
      acc+=frac;
    });
    cx.restore();
    cx.fillStyle='rgba(255,246,224,.09)';
    ell(x, y+ry*0.55-h, rx*0.86, ry*0.44); cx.fill();
  }
  const surfY = y+ry*0.55 - h;
  const ck=b.amt.homos||0;
  for(let i=0;i<Math.round(ck*8);i++){
    const a=sr(i*2.3)*6.283, r=Math.sqrt(sr(i*5.7))*0.84;
    const px=x+Math.cos(a)*rx*r, py=surfY+ry*0.26+Math.sin(a)*ry*0.42*r;
    const s=rx*0.058+sr(i)*rx*0.022;
    cx.fillStyle=rg(px-s*.3,py-s*.4,s*.1,s*1.3,[[0,'#F5E3AF'],[.55,'#D9B974'],[1,'#A07D3B']]);
    cx.beginPath(); cx.ellipse(px,py,s,s*.84,sr(i+3)*3,0,6.283); cx.fill();
    cx.fillStyle='rgba(70,48,16,.28)';
    cx.beginPath(); cx.ellipse(px+s*.38,py+s*.38,s*.48,s*.28,0,0,6.283); cx.fill();
  }
  const sa=b.amt.salsa||0;
  if(sa>0){
    const spread=clamp(sa/2.0,0,1);
    cx.save(); cx.globalAlpha=.95;
    cx.fillStyle=rg(x,surfY+ry*.2,1,rx*1.1,[[0,'#CB4A2E'],[.5,'#AB2D18'],[1,'#7A1A0D']]);
    cx.beginPath();
    for(let i=0;i<=26;i++){
      const a=i/26*6.283, wob=0.76+0.24*Math.sin(a*3+sa);
      const px=x+Math.cos(a)*rx*spread*wob, py=surfY+ry*.26+Math.sin(a)*ry*.5*spread*wob;
      i? cx.lineTo(px,py) : cx.moveTo(px,py);
    }
    cx.closePath(); cx.fill();
    cx.fillStyle='rgba(255,196,168,.3)';
    cx.beginPath(); cx.ellipse(x-rx*.22,surfY+ry*.10,rx*.2*spread,ry*.12*spread,0,0,6.283); cx.fill();
    cx.restore();
  }
  const on=b.amt.taqleya||0;
  const crisp = S.batch.taqleya ? crispOf(S.batch.taqleya) : 1;
  for(let i=0;i<Math.round(on*30);i++){
    const a=sr(i*3.9)*6.283, r=Math.sqrt(sr(i*7.1))*0.88;
    const px=x+Math.cos(a)*rx*r, py=surfY+ry*0.16+Math.sin(a)*ry*0.46*r;
    const rot=sr(i*1.7)*3.14, len=rx*0.16+sr(i+9)*rx*0.11;
    cx.save(); cx.translate(px,py); cx.rotate(rot);
    const v=sr(i+41);
    cx.strokeStyle = v>.82?'#8A4F0C':(v>.45?(crisp>.6?'#F4B458':'#C88B34'):(crisp>.6?'#E0912C':'#A86A1F'));
    cx.lineWidth=1.7+sr(i)*1; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(-len/2,0);
    cx.quadraticCurveTo(0,(sr(i+13)-.5)*len*.7*crisp,len/2,0); cx.stroke();
    cx.restore();
  }
}

/* ==================================================== your hands & the spoon
   The spoon is the player's avatar, so it gets the full cartoon treatment:
   anticipation before the reach, a stretched trail on the flick, a squash on
   the rim strike, and an ink outline heavy enough to read against the vats. */
const SP = {tip:{x:0,y:0}, target:null, phase:'idle', t:0, dur:.3,
            from:{x:0,y:0}, kind:null, shake:0, carry:null, queue:[],
            trail:[], stretch:0};
let BOWLHIT = 0;     /* decays after each scoop lands */
let OVER = 0;        /* 0..1 how far past the ticket the bowl is heaped */
function spoonRest(){ return {x: W*0.645, y: H*0.775}; }
function drawHands(tm){
  const b = LAY.bowl;
  const sx = -W*0.10, sy = H*1.10;
  const hx = b.x - b.rx*0.66, hy = b.y + b.ry*2.0;
  /* ---- the arm holding the bowl */
  cx.save();
  cx.strokeStyle=INK; cx.lineWidth=W*0.125; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(sx,sy); cx.quadraticCurveTo(W*0.02,H*1.00,hx,hy); cx.stroke();
  cx.strokeStyle='#C98A5E'; cx.lineWidth=W*0.105;
  cx.beginPath(); cx.moveTo(sx,sy); cx.quadraticCurveTo(W*0.02,H*1.00,hx,hy); cx.stroke();
  /* rolled white sleeve */
  cx.strokeStyle=INK; cx.lineWidth=W*0.130;
  cx.beginPath(); cx.moveTo(sx,sy); cx.lineTo(W*-0.005,H*1.035); cx.stroke();
  cx.strokeStyle='#FFF8EC'; cx.lineWidth=W*0.112;
  cx.beginPath(); cx.moveTo(sx,sy); cx.lineTo(W*-0.005,H*1.035); cx.stroke();
  cx.restore();

  drawBowl(S.bowl, tm);

  /* ---- fingers curled over the near rim */
  cx.save();
  for(let i=0;i<3;i++){
    const a = Math.PI*(0.62 + i*0.105);
    const fx = b.x + Math.cos(a)*b.rx*0.94, fy = b.y + Math.sin(a)*b.ry*2.0 + b.ry*0.55;
    cx.save(); cx.translate(fx,fy); cx.rotate(a-Math.PI*0.5);
    rr(-W*0.015,-H*0.010, W*0.030, H*0.026, W*0.013);
    inkFill(i===1? '#D79B6B' : '#C98A5E', 0.42);
    gloss(-W*0.005,-H*0.004, W*0.007, H*0.006, 0, .40);
    cx.restore();
  }
  cx.save(); cx.translate(b.x-b.rx*0.90, b.y-b.ry*0.10); cx.rotate(-0.30);
  rr(-W*0.020,-H*0.018, W*0.040, H*0.044, W*0.019);
  inkFill('#D79B6B', 0.45);
  gloss(-W*0.009,-H*0.009, W*0.008, H*0.008, 0, .45);
  cx.restore(); cx.restore();

  /* ---- the spoon */
  const p = LAY.spoonPivot, tip = SP.tip;
  const ang = Math.atan2(tip.y-p.y, tip.x-p.x);
  const sh = SP.shake>0 ? Math.sin(tm*0.055)*SP.shake : 0;

  /* motion trail: ghosts of the last few tip positions */
  if(SP.trail.length>1 && (SP.phase==='flick'||SP.phase==='reach')){
    cx.save();
    for(let i=0;i<SP.trail.length-1;i++){
      const t0=SP.trail[i], t1=SP.trail[i+1];
      cx.globalAlpha = (i/SP.trail.length)*0.30;
      cx.strokeStyle='#FFF6E0'; cx.lineWidth=W*0.030*(i/SP.trail.length);
      cx.lineCap='round';
      cx.beginPath(); cx.moveTo(t0.x,t0.y); cx.lineTo(t1.x,t1.y); cx.stroke();
    }
    cx.restore();
  }

  cx.save(); cx.translate(sh,0);
  const gripD = W*0.26;
  const gripX = p.x+Math.cos(ang)*gripD, gripY = p.y+Math.sin(ang)*gripD;
  /* forearm */
  cx.strokeStyle=INK; cx.lineWidth=W*0.118; cx.lineCap='round';
  cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(gripX,gripY); cx.stroke();
  cx.strokeStyle='#C98A5E'; cx.lineWidth=W*0.098;
  cx.beginPath(); cx.moveTo(p.x,p.y); cx.lineTo(gripX,gripY); cx.stroke();
  cx.strokeStyle=INK; cx.lineWidth=W*0.128;
  cx.beginPath(); cx.moveTo(p.x+Math.cos(ang)*W*.015,p.y+Math.sin(ang)*W*.015);
  cx.lineTo(p.x+Math.cos(ang)*W*.125,p.y+Math.sin(ang)*W*.125); cx.stroke();
  cx.strokeStyle='#FFF8EC'; cx.lineWidth=W*0.108;
  cx.beginPath(); cx.moveTo(p.x+Math.cos(ang)*W*.015,p.y+Math.sin(ang)*W*.015);
  cx.lineTo(p.x+Math.cos(ang)*W*.125,p.y+Math.sin(ang)*W*.125); cx.stroke();
  /* fist */
  cx.beginPath(); cx.ellipse(gripX,gripY,W*0.055,W*0.046,ang,0,6.283);
  inkFill('#D79B6B', 0.9);
  cx.save(); cx.globalAlpha=.32; cx.fillStyle='#8A5230';
  for(let i=0;i<3;i++){
    cx.beginPath();
    cx.ellipse(gripX+Math.cos(ang+1.57)*(i-1)*W*0.026, gripY+Math.sin(ang+1.57)*(i-1)*W*0.026,
               W*0.012, W*0.030, ang, 0, 6.283); cx.fill();
  }
  cx.restore();
  /* shaft — stretches along its length while flicking */
  const stretch = 1 + SP.stretch*0.20;
  const headLen = W*0.060;
  const shaftEnd = {x: tip.x-Math.cos(ang)*headLen, y: tip.y-Math.sin(ang)*headLen};
  cx.strokeStyle=INK; cx.lineWidth=(has('spoon')? W*0.024 : W*0.020);
  cx.lineCap='round';
  cx.beginPath(); cx.moveTo(gripX,gripY); cx.lineTo(shaftEnd.x,shaftEnd.y); cx.stroke();
  cx.strokeStyle='#D9E4EF'; cx.lineWidth=(has('spoon')? W*0.015 : W*0.012);
  cx.beginPath(); cx.moveTo(gripX,gripY); cx.lineTo(shaftEnd.x,shaftEnd.y); cx.stroke();
  cx.strokeStyle='rgba(255,255,255,.9)'; cx.lineWidth=W*0.004;
  cx.beginPath(); cx.moveTo(gripX,gripY-1.8); cx.lineTo(shaftEnd.x,shaftEnd.y-1.8); cx.stroke();
  /* the bowl of the spoon */
  cx.save(); cx.translate(tip.x,tip.y); cx.rotate(ang); cx.scale(stretch, 1/stretch);
  const rL=W*0.058, rW=W*0.040;
  cx.beginPath(); cx.ellipse(0,0,rL,rW,0,0,6.283);
  inkFill('#C6D2DE', 1.0);
  inkEll(0,0,rL*.82,rW*.78,'#5C6B7C', 0.5);
  if(SP.carry){
    cx.save(); cx.beginPath(); cx.ellipse(0,0,rL*.80,rW*.76,0,0,6.283); cx.clip();
    const fn=FILL[SP.carry]; if(fn) fn(0,rW*.12,rL*.8,rW*.85, 777, tm, 1);
    cx.restore();
  }
  gloss(-rL*0.35, -rW*0.34, rL*0.26, rW*0.18, 0, .65);
  cx.restore();
  cx.restore();
}
/* ===================================================== batches and freshness */
function batchCap(k){
  let base = 26;
  if(k==='salsa') base = 34;
  if(k==='taqleya') base = 22;
  if(has('vat')) base = Math.round(base*1.45);
  if(k==='taqleya' && has('knife')) base = Math.round(base*1.35);
  return base;
}
/* crispness of the ward decays across service unless a fan is blowing */
function crispOf(q){
  if(!q) return 1;
  const mins = (S.clock||0) - (q.t0||0);
  let rate = has('fan') ? 0.00055 : 0.0016;
  rate *= (EV().crisp||1);          /* a heatwave softens the ward faster */
  return clamp(q.qual * (1 - mins*rate), 0.12, 1);
}
function qualOf(k){
  const q = S.batch[k];
  if(!q) return 0.55;
  if(k==='taqleya') return crispOf(q);
  if(k==='ruz'||k==='rzmix'||k==='maca'){
    const mins=(S.clock||0)-(q.t0||0);
    return clamp(q.qual*(1-mins*0.0006),0.2,1);
  }
  return q.qual;
}
function stocked(k){ return !ch().kitchen || (S.batch[k] && S.batch[k].qty>0); }

/* ================================================================= the bowl */
function blankBowl(){ return {amt:{}, order:[], amtByStep:[], t0:0, started:false, taken:false}; }
function totalScoops(b){ let n=0; for(const k in b.amt) n+=b.amt[k]; return n; }

/* ============================================================== the tickets */
let TICKET_NO = 100;
function pickArch(){
  const ev = EV();
  const avail = Object.keys(ARCH).filter(k=> S.chIdx >= (ARCH_FROM[k]||0));
  let tot=0; const wts={};
  avail.forEach(k=>{
    let w = ARCH[k].w;
    if(ev.archBias===k) w *= 4;
    if(ARCH[k].bigOnly && ch().sizes.indexOf('hella')<0) w = 0;
    wts[k]=w; tot+=w;
  });
  let r=Math.random()*tot;
  for(const k of avail){ r-=wts[k]; if(r<=0) return k; }
  return 'walkin';
}
function makeTicket(){
  const c = ch(), ev = EV();
  const arch = pickArch(), A2 = ARCH[arch];
  /* the archetype pulls the size around: a family takes the pot, a school
     trip takes smalls, payday takes larges */
  let sizes = c.sizes.filter(s=> s!=='hella' || Math.random()<0.12);
  if(A2.bigOnly) sizes = c.sizes.filter(s=> SIZES[s].scoops>=8);
  else if(ev.smallOrders && Math.random()<0.6) sizes = c.sizes.filter(s=> SIZES[s].scoops<=7);
  else if(ev.bigOrders && Math.random()<0.5) sizes = c.sizes.filter(s=> SIZES[s].scoops>=7);
  const size = pick(sizes.length?sizes:c.sizes);
  const sz = SIZES[size];
  const vats = c.vats;
  const spec = {};
  const carbs = vats.filter(v=>['rzmix','ruz','maca','ads'].indexOf(v)>=0);
  /* distribute the base scoops across the carbs, then the fixed toppings */
  let base = sz.scoops - (vats.indexOf('homos')>=0?1:0) - 1 - 1; /* homos, salsa, taqleya */
  base = Math.max(2, base);
  const share = [];
  carbs.forEach(()=> share.push(1));
  let left = base - carbs.length;
  while(left>0){ share[ri(0,carbs.length-1)]++; left--; }
  carbs.forEach((k,i)=> spec[k]=share[i]);
  if(vats.indexOf('homos')>=0) spec.homos = 1;
  spec.salsa = 1; spec.taqleya = 1;
  /* modifiers */
  const mods = [];
  const extraChance = arch==='regular' ? 0.55 : 0.34;
  if(Math.random()<extraChance){
    const k = pick(vats.filter(v=>v!=='salsa'));
    spec[k] = (spec[k]||0)+1; mods.push({k, kind:'extra'});
  }
  if(Math.random()<0.16){
    const k = pick(['salsa','taqleya','homos'].filter(v=>vats.indexOf(v)>=0));
    if(spec[k]){ spec[k]=0; mods.push({k, kind:'none'}); }
  }
  const takeaway = !!sz.takeaway || (c.till && Math.random()<0.22);
  /* the shatta gag: some people want it fiery, some want it nowhere near them */
  const hot = Math.random()<0.18;
  return {
    no: ++TICKET_NO, size, spec, mods, takeaway, arch, hot,
    look: makeLook(TICKET_NO*3+7, arch),
    pat: sz.pat * A2.pat * (ev.pat||1)
         * (has('runner')?1.25:1) * (has('music')?1.06:1) * (has('sign')?1.08:1),
    slang: (A2.slangAlways || (c.slang && Math.random()<0.5)) && c.slang
  };
}
function ticketPrice(tk){
  const idx = Math.min(S.chIdx,4);
  let p = SIZES[tk.size].price[idx];
  tk.mods.forEach(m=>{ if(m.kind==='extra') p += Math.round(p*0.12); });
  if(has('sign')) p = Math.round(p*1.10);
  p = Math.round(p * (EV().price||1));
  return p;
}

/* ============================================================== the service */
const SV = {
  active:false, tk:null, queue:[], served:0, target:0, endAt:0,
  pat:1, patMax:1, combo:0, comboBest:0, lastScoop:0, wrongSeq:false,
  pops:[], parts:[], stage:'wait', bagged:{},
  takings:0, tips:0, walked:0, perfectRun:0,
  /* --- the lunch flood --- */
  rush:false, rushLeft:0, rushAt:0, rushDone:false,
  /* --- the kemala top-up --- */
  kemala:null, kemalaDone:0,
  spill:0, dayStars:0
};
/* the combo is the koshary symphony made mechanical: keep the clangs coming
   and the whole bowl pays more. It decays if you stall. */
const COMBO_WINDOW = 1150;
function comboMult(){ return 1 + Math.min(SV.combo,12)*0.085; }
function comboDecay(dt){
  if(!SV.combo) return;
  if(performance.now() - SV.lastScoop > COMBO_WINDOW*1.9){ setCombo(0); }
}
function setCombo(n){
  SV.combo = Math.max(0,n);
  SV.comboBest = Math.max(SV.comboBest, SV.combo);
  renderCombo();
}
function renderCombo(){
  const el=$('#combo'); if(!el) return;
  if(SV.combo<2){ el.classList.remove('on'); return; }
  el.classList.add('on');
  $('#comboLbl').textContent = t('combo');
  $('#comboN').textContent = '×'+comboMult().toFixed(2).replace(/0$/,'');
  const since = performance.now()-SV.lastScoop;
  const f=$('#comboBar').firstElementChild;
  if(f) f.style.width = clamp(1 - since/(COMBO_WINDOW*1.9),0,1)*100+'%';
}

function startService(){
  SV.active=true; SV.served=0; SV.walked=0; SV.takings=0; SV.tips=0;
  SV.combo=0; SV.comboBest=0; SV.perfectRun=0; SV.pops=[]; SV.parts=[];
  SV.rush=false; SV.rushDone=false; SV.kemala=null; SV.kemalaDone=0; SV.spill=0;
  SV.target = dayCustomers();
  SV.queue = []; for(let i=0;i<SV.target;i++) SV.queue.push(makeTicket());
  /* the flood lands somewhere in the middle third of the day */
  SV.rushAt = S.chIdx>=1 ? Math.floor(SV.target*rnd(0.30,0.52)) : 999;
  S.bowl = blankBowl(); S.clock = 0; OVER=0;
  nextTicket();
  A.crowd(true);
}
function dayCustomers(){
  const c = ch(), ev = EV();
  let n = 6 + S.chIdx*3 + Math.min(6, Math.floor(S.rep/22));
  if(has('neon')) n += 4;
  if(has('mirror')) n += 2;
  n += (ev.extra||0);
  if(S.mode==='casual') n = 16 + Math.min(14, Math.floor(S.rep/14));
  return clamp(Math.round(n), 5, 40);
}
function beginRush(){
  SV.rush=true; SV.rushDone=true;
  SV.rushLeft = Math.max(4, Math.round(SV.queue.length*0.45));
  const el=$('#rush'); el.textContent=t('rush');
  el.classList.remove('on'); void el.offsetWidth; el.classList.add('on');
  $('#stage').classList.add('rushing');
  A.chord([392,523,659,784],.34,.17); A.bpm=126; kick(1);
  shout(L==='ar'?'الطابور وصل للرصيف!':'The queue is out to the pavement!');
}
function endRush(){
  SV.rush=false; $('#stage').classList.remove('rushing'); A.bpm=104;
  toast(t('rushOver'));
}
function nextTicket(){
  /* a kemala interrupts before the next person steps up */
  if(SV.kemala){ renderSlip(); renderDock(); return; }
  if(SV.queue.length===0){ endService(); return; }
  if(!SV.rushDone && SV.served>=SV.rushAt) beginRush();
  if(SV.rush){ SV.rushLeft--; if(SV.rushLeft<=0) endRush(); }
  SV.tk = SV.queue.shift();
  const rushPat = SV.rush ? 0.72 : 1;
  SV.pat = 1;
  SV.patMax = (7000*SV.tk.pat + SIZES[SV.tk.size].scoops*520) * rushPat;
  SV.stage='build'; SV.bagged={}; SP.queue.length=0;
  SV.wrongSeq=false; OVER=0;
  S.bowl = blankBowl();
  renderSlip(); renderDock();
  const A2 = ARCH[SV.tk.arch]||ARCH.walkin;
  if(SV.tk.slang && Math.random()<0.7) shout(slangCall(SV.tk));
  else if(SV.tk.hot) shout(L==='ar'?'شطة كتير يا أسطى 🌶':'Plenty of shatta, usta 🌶');
  else if(A2.showman && Math.random()<0.5) shout(L==='ar'?'اعمللي الرنّة! 📷':'Do the clang for me! 📷');
  else if(Math.random()<0.20) shout(pick(L==='ar'
    ? ['الشطة حامية نااار','ماترغّش الشطة','واحد سادة يا أسطى','الباشا الجميل مستني','ست الكل مستنية']
    : ['The chili is FIRE','Easy on the shatta','One plain, usta!','The nice gentleman is waiting','Madam is waiting']));
}
function slangCall(tk){
  const ar = L==='ar';
  const parts=[];
  for(const k in tk.spec){ if(tk.spec[k]>1) parts.push(slangOf(k)+(ar?' زيادة':' extra')); }
  tk.mods.forEach(m=>{ if(m.kind==='none') parts.push((ar?'من غير ':'no ')+slangOf(m.k)); });
  if(!parts.length) return ar ? ('واحد '+SIZES[tk.size].ar+' على السريع')
                              : ('One '+SIZES[tk.size].en.toLowerCase()+', quick!');
  return (ar?'واحد ':'One with ')+parts.join(ar?' و':', ');
}

/* ------------------------------------------------------------ the kemala
   "كمالة" is the documented top-up: a small second helping for someone still
   hungry. Serve a bowl well enough and they ask for one — a single fast
   scoop of one named component, worth a slice of the ticket, no new bowl. */
function maybeKemala(tk, quality){
  if(!has('kemala')) return false;
  if(tk.takeaway) return false;
  if(quality < 0.74) return false;
  const A2 = ARCH[tk.arch]||ARCH.walkin;
  const chance = 0.20 + (quality-0.74)*0.9 + (A2.slangAlways?0.18:0);
  if(Math.random() > chance) return false;
  const pool = ch().vats.filter(k=> stocked(k));
  if(!pool.length) return false;
  const want = pick(pool);
  SV.kemala = {tk, want, price: Math.max(2, Math.round(ticketPrice(tk)*0.30)), t0:performance.now()};
  SV.pat = 1; SV.patMax = 5200;
  SV.stage='kemala'; S.bowl = blankBowl(); OVER=0;
  shout(t('kemalaAsk'));
  A.tone(880,.09,'triangle',.15);
  renderSlip(); renderDock();
  return true;
}
function resolveKemala(served){
  const km = SV.kemala; if(!km) return;
  SV.kemala=null;
  if(served){
    const got = S.bowl.amt[km.want]||0;
    const extra = totalScoops(S.bowl)-got;
    const good = got>=1 && extra===0;
    const pay = good ? km.price : Math.round(km.price*0.4);
    S.money += pay; SV.takings += pay;
    const bb=LAY.bowl;
    pop(bb.x, bb.y-bb.ry*2.6, '+'+nf(pay)+' '+t('cur'), good?'#9BF0B2':'#FFC93C');
    if(good){
      SV.kemalaDone++; S.rep=clamp(S.rep+0.6,0,999);
      pop(bb.x, bb.y-bb.ry*4.4, t('kemala')+' ✓','#9BF0B2');
      A.chord([784,1046],.22,.14); confetti(bb.x, bb.y-bb.ry*2, H*0.22, 12);
    } else A.coin();
  }
  SV.stage='build'; S.bowl=blankBowl(); OVER=0;
  hud(); nextTicket();
}
/* ------------------------------------------------------------- the flick */
function scoopOrder(k){
  /* documented assembly sequence: carbs -> chickpeas -> sauce -> onions */
  if(['rzmix','ruz','maca','ads'].indexOf(k)>=0) return 0;
  if(k==='homos') return 1;
  if(k==='salsa') return 2;
  return 3;
}
/* how many scoops the current ticket actually asked for */
function bowlTarget(){
  if(SV.stage==='kemala') return 1;
  const tk=SV.tk; if(!tk) return 99;
  let n=0; for(const k in tk.spec) n+=tk.spec[k];
  return n;
}
function requestScoop(v){
  if(!SV.active) return;
  if(SV.stage!=='build' && SV.stage!=='kemala') return;
  /* the counter rewards fast hands, so queue the taps instead of dropping
     them — up to two ahead, which is about as far as a real arm gets. */
  if(SP.phase!=='idle'){
    /* buffer three ahead rather than two: at roughly half a second an arm,
       a player tapping out a full bowl was losing taps they had clearly made */
    if(SP.queue.length < 3) SP.queue.push(v);
    else { A.tone(140,.05,'sine',.06); }
    return;
  }
  const k = v.k;
  if(ch().kitchen && (!S.batch[k] || S.batch[k].qty<=0)){
    toast(L==='ar' ? (ING[k].ar+' خلص') : (ING[k].en+' is out'));
    A.bad(); kick(.5); return;
  }
  const b = S.bowl;
  if(!b.started){ b.started=true; b.t0=performance.now(); }
  /* sequence check */
  const last = b.order.length ? scoopOrder(b.order[b.order.length-1]) : -1;
  if(scoopOrder(k) < last) SV.wrongSeq = true;
  SP.phase='wind'; SP.t=0;                /* anticipation before the reach */
  SP.dur = (has('spoon')?0.200:0.275) * (has('dais')?0.86:1);
  SP.from = {x:SP.tip.x, y:SP.tip.y};
  SP.target = v; SP.kind = k;
}
function stepSpoon(dt,tm){
  const rest = spoonRest();
  /* keep a short tail of tip positions for the motion trail */
  SP.trail.push({x:SP.tip.x, y:SP.tip.y});
  if(SP.trail.length>7) SP.trail.shift();

  if(SP.phase==='idle'){
    SP.carry = null; SP.shake=Math.max(0,SP.shake-dt*30);
    SP.stretch = lerp(SP.stretch, 0, 1-Math.pow(0.002,dt));
    if(SP.queue.length && (SV.stage==='build'||SV.stage==='kemala')){
      const nx=SP.queue.shift(); requestScoop(nx); return;
    }
    SP.tip.x = lerp(SP.tip.x, rest.x, 1-Math.pow(0.001,dt));
    SP.tip.y = lerp(SP.tip.y, rest.y, 1-Math.pow(0.001,dt));
    return;
  }
  SP.t += dt;
  const v = SP.target;
  if(SP.phase==='wind'){
    /* pull back a touch first — the anticipation that sells the flick */
    const p = clamp(SP.t/(SP.dur*0.28),0,1);
    const back = Math.sin(p*Math.PI)*0.10;
    SP.tip.x = SP.from.x + (SP.from.x-v.x)*back;
    SP.tip.y = SP.from.y + (SP.from.y-v.y)*back;
    SP.stretch = -back*1.4;
    if(p>=1){ SP.phase='reach'; SP.t=0; SP.from={x:SP.tip.x,y:SP.tip.y}; }
  } else if(SP.phase==='reach'){
    const p = clamp(SP.t/SP.dur,0,1), e = easeOut(p);
    SP.tip.x = lerp(SP.from.x, v.x, e);
    SP.tip.y = lerp(SP.from.y, v.y + v.ry*0.55*Math.sin(p*Math.PI), e);
    SP.stretch = Math.sin(p*Math.PI)*0.42;
    if(p>=1){ SP.phase='dip'; SP.t=0; A.scoop(); }
  } else if(SP.phase==='dip'){
    const p = clamp(SP.t/0.10,0,1);
    SP.tip.x = v.x; SP.tip.y = v.y + v.ry*0.9*Math.sin(p*Math.PI);
    SP.carry = SP.kind; SP.stretch = -Math.sin(p*Math.PI)*0.22;
    if(p>=1){
      SP.phase='flick'; SP.t=0;
      /* the rim strike: pitch climbs with the combo, so a fast run of
         scoops literally plays a rising phrase on the pots */
      const semis = Math.min(SV.combo,10);
      A.clang((VATTONE[SP.kind]||440) * Math.pow(2, semis/12), 1);
      SP.shake = 3.6;
      nudgeVat(SP.kind);
      flair({kind:'burst', x:v.x, y:v.y-v.ry*0.2, r:v.rx*0.62, spikes:9,
             col: SV.combo>3? '#FF7AD9':'#FFEB9C', rot:rnd(0,1), dur:0.30});
      flair({kind:'ring', x:v.x, y:v.y, r:v.rx*0.9, col:'#FFF3D8', dur:0.34});
      commitScoop(SP.kind, v);
    }
  } else if(SP.phase==='flick'){
    const p = clamp(SP.t/(SP.dur*0.85),0,1);
    const rx = lerp(v.x, rest.x, ease(p));
    const ry = lerp(v.y - v.ry*1.4, rest.y, ease(p));
    SP.tip.x = rx; SP.tip.y = ry;
    SP.stretch = (1-p)*0.55;
    if(p>0.18) SP.carry = null;
    if(p>=1){ SP.phase='idle'; SP.t=0; }
  }
}
function commitScoop(k,v){
  const b = S.bowl;
  b.amt[k] = (b.amt[k]||0)+1;
  b.order.push(k); b.amtByStep.push(1);
  if(ch().kitchen && S.batch[k]) S.batch[k].qty = Math.max(0, S.batch[k].qty-1);
  spawnParts(k,v);
  BOWLHIT = 1;
  /* over-filling: past the ticket the bowl heaps, and past that it spills */
  const tot = totalScoops(b), want = bowlTarget();
  OVER = clamp((tot-want)/3, 0, 1);
  if(tot > want+3){
    SV.spill++; OVER=1;
    pop(LAY.bowl.x, LAY.bowl.y-LAY.bowl.ry*3.4, t('spill')+'!','#FF5F52');
    A.bad(); kick(1);
  }
  /* rhythm bonus: the "koshary symphony" made mechanical.
     Keeping the scoops coming builds the streak. The shop tape is a bonus on
     top of that, never a tax — landing on the beat jumps you two instead of
     one, but missing it does not cost you the run you already have. */
  const now = performance.now();
  const gap = now - SV.lastScoop;
  const inTime = SV.lastScoop && gap < COMBO_WINDOW;
  let step = inTime ? 1 : 0;
  if(has('music')){
    const beatMs = 60000/A.bpm;
    const off = Math.abs(((now % beatMs) / beatMs) - 0.5);
    if(off > 0.34 && inTime){
      step = 2;
      pop(v.x, v.y - v.ry*2, '♪', '#FF7AD9');
      A.tone(1760,.05,'triangle',.08);
    }
  }
  setCombo(step ? SV.combo+step : 1);
  if(SV.combo>0 && SV.combo%5===0){
    pop(v.x, v.y-v.ry*2.6, '×'+comboMult().toFixed(2), '#FF7AD9');
    A.tone(1320,.07,'triangle',.11);
  }
  SV.lastScoop = now;
  renderSlip();
}
function spawnParts(k,v){
  const b = LAY.bowl, n = k==='salsa'?16:14;
  for(let i=0;i<n;i++){
    const sx = v.x + rnd(-v.rx*.4, v.rx*.4), sy = v.y - v.ry*.4;
    const tx = b.x + rnd(-b.rx*.5, b.rx*.5), ty = b.y + rnd(-b.ry*.2, b.ry*.4);
    SV.parts.push({k, x:sx, y:sy, x0:sx, y0:sy, tx, ty, t:0,
      dur: rnd(0.26,0.40), arc: rnd(H*0.10,H*0.19), rot: rnd(0,6.283), vr: rnd(-9,9),
      s: k==='salsa'? rnd(2,4.4) : rnd(2.4,5.2)});
  }
}
function stepParts(dt){
  for(let i=SV.parts.length-1;i>=0;i--){
    const p=SV.parts[i]; p.t+=dt;
    const u=clamp(p.t/p.dur,0,1);
    p.x = lerp(p.x0,p.tx,u);
    p.y = lerp(p.y0,p.ty,u) - Math.sin(u*Math.PI)*p.arc;
    p.rot += p.vr*dt;
    if(u>=1) SV.parts.splice(i,1);
  }
}
function drawParts(){
  SV.parts.forEach(p=>{
    /* a stretched ghost behind each morsel: the arc reads as speed */
    const u=clamp(p.t/p.dur,0,1);
    cx.save(); cx.globalAlpha=0.22*(1-u);
    cx.strokeStyle='#FFF3D8'; cx.lineWidth=p.s*0.9; cx.lineCap='round';
    cx.beginPath(); cx.moveTo(p.x,p.y);
    cx.lineTo(lerp(p.x0,p.tx,clamp(u-0.11,0,1)),
              lerp(p.y0,p.ty,clamp(u-0.11,0,1)) - Math.sin(clamp(u-0.11,0,1)*Math.PI)*p.arc);
    cx.stroke(); cx.restore();

    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.rot);
    const I=ING[p.k];
    if(p.k==='salsa'){
      cx.beginPath(); cx.ellipse(0,0,p.s*1.2,p.s*.8,0,0,6.283);
      inkFill('#E0361F', 0.22);
      gloss(-p.s*.2,-p.s*.2,p.s*.4,p.s*.26,0,.55);
    } else if(p.k==='taqleya'){
      cx.strokeStyle=INK; cx.lineWidth=2.9; cx.lineCap='round';
      cx.beginPath(); cx.moveTo(-p.s,0); cx.quadraticCurveTo(0,p.s*.9,p.s,0); cx.stroke();
      cx.strokeStyle=I.col; cx.lineWidth=1.7;
      cx.beginPath(); cx.moveTo(-p.s,0); cx.quadraticCurveTo(0,p.s*.9,p.s,0); cx.stroke();
    } else if(p.k==='maca'){
      rr(-p.s,-p.s*.42,p.s*2,p.s*.84,p.s*.4); inkFill(I.col, 0.20);
    } else if(p.k==='homos'){
      cx.beginPath(); cx.arc(0,0,p.s,0,6.283); inkFill('#E0C177', 0.20);
      gloss(-p.s*.3,-p.s*.3,p.s*.34,p.s*.26,0,.6);
    } else {
      cx.beginPath(); cx.ellipse(0,0,p.s,p.s*.6,0,0,6.283); inkFill(I.col, 0.18);
    }

}
function pop(x,y,s,c,big){ SV.pops.push({x,y,s,c,t:0,big:!!big}); renderPops(); }

/* ------------------------------------------------------------- the scoring */
function gradeBowl(tk,b,ms){
  const spec = tk.spec, res = {};
  let acc = 0, n = 0, missing=0, over=0;
  for(const k in spec){
    const want = spec[k], got = b.amt[k]||0;
    const d = Math.abs(want-got);
    if(got<want) missing += want-got; else if(got>want) over += got-want;
    acc += clamp(1 - d/Math.max(1.6,want+0.6), 0, 1); n++;
  }
  for(const k in b.amt){ if(!(k in spec) && b.amt[k]>0){ over += b.amt[k]; acc -= 0.22; n += 0; } }
  const build = clamp(n? acc/n : 0, 0, 1);
  /* a real bowl is built in about five seconds */
  const target = (1400 + SIZES[tk.size].scoops*560) * (has('dais')?1.12:1);
  const speed = clamp(1 - Math.max(0, ms-target)/ (target*1.9), 0, 1);
  /* quality carried in from the kitchen, weighted by the ingredient */
  let qw=0, qs=0;
  for(const k in spec){ if(spec[k]>0){ const w=ING[k].w; qw+=w; qs+=w*qualOf(k); } }
  const quality = qw? qs/qw : 0.6;
  const seq = SV.wrongSeq ? 0.72 : 1;
  /* a critic weights the cooking itself far harder than the speed */
  const A2 = ARCH[tk.arch]||ARCH.walkin;
  const wB = A2.strict? 0.40 : 0.44;
  const wS = A2.strict? 0.10 : (A2.pat<0.8 ? 0.30 : 0.20);
  const wQ = 1 - wB - wS;
  let score = clamp((build*wB + speed*wS + quality*wQ) * seq, 0, 1);
  if(A2.strict) score = clamp(score*1.06 - 0.10, 0, 1);   /* harsher curve */
  const spillPen = clamp(SV.spill*0.06, 0, 0.3);
  score = clamp(score - spillPen, 0, 1);
  return {score, build, speed, quality, missing, over, seq: !SV.wrongSeq};
}
function handOver(){
  if(!SV.active) return;
  if(SV.stage==='kemala'){ resolveKemala(true); return; }
  if(!SV.tk) return;
  const tk = SV.tk, b = S.bowl;
  if(totalScoops(b)===0){ toast(L==='ar'?'الطبق فاضي':'The bowl is empty'); A.bad(); return; }
  if(tk.takeaway && SV.stage==='build'){ SV.stage='bag'; renderDock(); renderSlip(); return; }
  const ms = performance.now() - b.t0;
  const g = gradeBowl(tk,b,ms);
  let bagPen = 0;
  if(tk.takeaway){
    const missBag = Object.keys(SAUCES).length - Object.keys(SV.bagged).length;
    bagPen = missBag*0.11;
  }
  const final = clamp(g.score - bagPen, 0, 1);
  const A2 = ARCH[tk.arch]||ARCH.walkin;
  const ev = EV();
  const price = ticketPrice(tk);
  /* the combo multiplies the tip, not the price — showmanship is paid in
     goodwill, which is exactly how a counter works */
  const baseTip = price * (final>0.88?0.22:final>0.7?0.12:final>0.5?0.04:0);
  const tip = Math.round(baseTip * comboMult() * A2.tip * (ev.tip||1) * (has('hatly')?1.5:1));
  SV.takings += price; SV.tips += tip;
  S.money += price + tip;
  S.stats.bowls++;
  let repD = final>0.88? 2.4 : final>0.72? 1.2 : final>0.55? 0.2 : -1.6;
  repD *= A2.rep * (ev.rep||1);
  S.rep = clamp(S.rep + repD, 0, 999); S.repTotal += Math.max(0,repD);
  if(final>0.88){ S.stats.perfect++; SV.perfectRun++; } else SV.perfectRun=0;
  SV.served++; S.stats.served++;
  const b2 = LAY.bowl;
  pop(b2.x, b2.y-b2.ry*2.4, '+'+nf(price+tip)+' '+t('cur'),
      final>0.85?'#9BF0B2':final>0.6?'#FFD97A':'#FF5F52');
  if(final>0.88){
    A.chord([659,880,1046],.26,.14);
    pop(b2.x, b2.y-b2.ry*4.2, t('perfect')+'!','#9BF0B2', true);
    confetti(b2.x, b2.y-b2.ry*2.4, H*0.30, 20);
    flair({kind:'lines', x:b2.x, y:b2.y-b2.ry, r:W*0.28, n:10, ang:-1.57, spread:3.2,
           col:'rgba(255,240,200,.75)', dur:0.45});
    kick(1);
  }
  else if(final>0.6) A.coin();
  else { A.bad(); kick(.6); }
  if(SV.perfectRun>=3){
    shout(L==='ar'?'إيد الأسطى! 🔥':'The usta’s hand! 🔥');
    pop(W*0.5, H*0.30, SV.perfectRun+'× '+t('perfect'), '#FF7AD9', true);
  }
  hud();
  /* a well-fed customer may ask for a kemala before they leave */
  if(maybeKemala(tk, final)) return;
  nextTicket();
}
function walkOut(){
  if(SV.stage==='kemala'){ resolveKemala(false); return; }
  if(!SV.tk) return;
  SV.walked++; S.stats.walked++;
  setCombo(0);
  S.rep = clamp(S.rep-2.2, 0, 999);
  const b2=LAY.bowl; pop(b2.x, b2.y-b2.ry*3, L==='ar'?'مشي 😠':'Walked out 😠', '#FF5F52');

}

}

const MG = {
  on:false, key:null, stepIdx:0, scores:[], step:null,
  pot:{x:0,y:0,rx:0,ry:0},   /* where the pot mouth actually is this frame */
  /* gauge */ needle:0, dir:1, locked:false, lockT:0,
  /* reduce */ prog:0, stopped:false,
  /* skim */ foam:[], skimHits:0, skimTot:0, skimT:0,
  /* fry */ round:0, heat:0, temp:.18, done:0, burn:0, lifted:false, resultT:0,

function bandWidth(base){
  let w = base;
  if(has('gas')) w *= 1.30;
  if(has('sag')) w *= 1.12;
  w *= (EV().band||1);              /* a weak gas bottle narrows every window */
  return clamp(w, .05, .48);

function startCook(k){
  const r = recipeFor(k); if(!r) return;
  if(S.money < r.cost){ toast(t('cant')); A.bad(); return; }
  S.money -= r.cost; hud();
  MG.on=true; MG.key=k; MG.stepIdx=0; MG.scores=[]; MG.doneAll=false;
  S.screen='cook'; closeOv(); showHud(true); initStep(); renderDock();
  A.init(); A.resume();

function initStep(){
  const r = recipeFor(MG.key), st = r.steps[MG.stepIdx];
  MG.step = st; MG.locked=false; MG.lockT=0; MG.needle=0; MG.dir=1;
  MG.prog=0; MG.stopped=false; MG.resultT=0;
  MG.foam=[]; MG.skimHits=0; MG.skimTot=0; MG.skimT=0;
  MG.round=0; MG.heat=0; MG.temp=.18; MG.done=0; MG.burn=0; MG.lifted=false;

function stepScore(v){

  else setTimeout(()=>{ if(MG.on) initStep(); }, 620);

function finishCook(){
  A.fryStop();
  const r = recipeFor(MG.key), k = MG.key;
  let q = MG.scores.reduce((a,b)=>a+b,0)/Math.max(1,MG.scores.length);
  q *= soakPenalty(k);
  q = clamp(q, .12, 1);
  let qty = Math.round(batchCap(k) * r.yield * (0.62 + 0.38*q));
  const prev = S.batch[k];
  if(prev && prev.qty>0){
    const tq = prev.qty+qty;
    S.batch[k] = {qty:tq, qual:(prev.qual*prev.qty + q*qty)/tq, t0:S.clock||0};
  } else {
    S.batch[k] = {qty, qual:q, t0:S.clock||0};
  }
  MG.on=false; MG.doneAll=true;
  const grade = q>.88? (L==='ar'?'زي الفل':'Beautiful')
              : q>.7 ? (L==='ar'?'كويس':'Good')
              : q>.5 ? (L==='ar'?'ماشي':'It\u2019ll do')
              : (L==='ar'?'مش كويس':'Rough');
  if(q>.85) A.chord([523,659,784],.3,.15); else if(q>.55) A.coin(); else A.bad();
