function mgTap(px,py){
  const st = MG.step; if(!st || !MG.on) return;
  if(st.kind==='gauge'){
    if(MG.locked) return;
    MG.locked=true; MG.lockT=0;
    const bw = bandWidth(st.band);
    const d = Math.abs(MG.needle);             /* target is the centre, 0 */
    const sc = d<=bw ? 1 - (d/bw)*0.42 : clamp(1 - (d-bw)/0.55, 0, .55);
    A.clang(d<=bw?880:300, .8);
    MG.msg = d<=bw*0.28 ? (L==='ar'?'دهبي!':'Golden!')
           : d<=bw ? (L==='ar'?'كويس':'Good')
           : (MG.needle>0 ? (L==='ar'?'زوّدت':'Too far') : (L==='ar'?'بدري':'Too early'));
    MG.msgT=0;
    setTimeout(()=>{ if(MG.on) stepScore(sc); }, 520);
  } else if(st.kind==='reduce'){
    if(MG.stopped) return;
    MG.stopped=true;
    const [a,b]=st.band, mid=(a+b)/2, half=(b-a)/2*(has('gas')?1.3:1);
    const d=Math.abs(MG.prog-mid);
    const sc = d<=half ? 1-(d/half)*0.35 : clamp(1-(d-half)/0.42,0,.5);
    A.tone(d<=half?740:220,.2,'triangle',.16);
    MG.msg = d<=half*0.3 ? (L==='ar'?'مضبوط':'Spot on')
           : d<=half ? (L==='ar'?'كويس':'Good')
           : (MG.prog<mid ? (L==='ar'?'لسه نيّة':'Undercooked') : (L==='ar'?'زوّدت عليها':'Overdone'));
    MG.msgT=0;
    setTimeout(()=>{ if(MG.on) stepScore(sc); }, 620);
  } else if(st.kind==='skim'){
    /* generous hit box — a thumb is wider than a foam blob */
    let best=null, bd=1e9;
    for(let i=MG.foam.length-1;i>=0;i--){
      const f=MG.foam[i]; if(f.hit||f.miss) continue;
      const d=Math.hypot(px-f.x, py-(f.y-f.r*0.35));
      if(d<f.r*2.6 && d<bd){ bd=d; best=f; }
    }
    if(best){
      best.hit=true; best.t=0; MG.skimHits++;
      A.tone(620+MG.skimHits*80,.1,'sine',.12);
      flair({kind:'ring', x:best.x, y:best.y-best.r*0.35, r:best.r*1.6, col:'#9BF0B2', dur:0.32});
      pop(best.x, best.y-best.r, '✓','#9BF0B2');

  }

}
function stepMG(dt,tm){
  const st = MG.step; if(!MG.on||!st) return;
  MG.msgT += dt;
  if(st.kind==='gauge'){
    if(!MG.locked){
      MG.needle += MG.dir*dt*1.35*st.speed*(has('gas')?0.9:1);
      if(MG.needle>1){ MG.needle=1; MG.dir=-1; }
      if(MG.needle<-1){ MG.needle=-1; MG.dir=1; }
    } else MG.lockT+=dt;
  } else if(st.kind==='reduce'){
    if(!MG.stopped){
      MG.prog += dt/st.dur;
      if(MG.prog>=1.14){ MG.prog=1.14; MG.stopped=true; MG.msg=L==='ar'?'اتحرق!':'Burnt!'; MG.msgT=0;
        A.bad(); setTimeout(()=>{ if(MG.on) stepScore(.12); },700); }
      if(Math.random()<dt*7) A.bubbleTick();
    }
  } else if(st.kind==='skim'){
    MG.skimT += dt;
    if(MG.skimTot < (st.rounds||3) && Math.random() < dt*0.9){
      const P = MG.pot.rx ? MG.pot : {x:W*.5, y:H*.59, rx:W*.22, ry:H*.045};
      const a = rnd(0,6.283), r = Math.sqrt(Math.random())*0.62;
      MG.foam.push({x: P.x + Math.cos(a)*P.rx*r,
                    y: P.y + Math.sin(a)*P.ry*r,
                    r: Math.max(11, W*rnd(.030,.046)), t:0, hit:false});
      MG.skimTot++;
    }
    for(let i=MG.foam.length-1;i>=0;i--){
      const f=MG.foam[i]; f.t+=dt;
      if(f.t>1.7 && !f.hit){ f.miss=true; }
      if(f.t>2.2) MG.foam.splice(i,1);
    }
    const done = MG.skimTot>=(st.rounds||3) && MG.foam.filter(f=>!f.hit&&!f.miss).length===0;
    if(done && MG.skimT>2.4){
      const hits = MG.skimHits, total = st.rounds||3;
      const misses = MG.foam.filter(f=>f.miss).length;
      const sc = clamp((hits - misses*0.5) / total, 0, 1);
      MG.msg = misses===0 ? (L==='ar'?'نضيف':'Clean') : (L==='ar'?'فاتك '+misses:'Missed '+misses);
      MG.msgT=0; MG.on && (MG.step=null);
      setTimeout(()=>{ if(MG.on){ MG.step=st; stepScore(sc);} },500);
    }
  } else if(st.kind==='fry'){
    if(MG.lifted) return;
    const rate = has('gas')? 0.42 : 0.34;
    MG.temp += (MG.heat? rate : -0.26)*dt;
    MG.temp = clamp(MG.temp,0,1.12);
    /* how fast the onion colours, by oil temperature */
    let v;
    if(MG.temp<0.34) v = MG.temp*0.22;
    else if(MG.temp<0.80) v = 0.24 + (MG.temp-0.34)*0.62;
    else v = 0.52 + (MG.temp-0.80)*2.6;
    MG.done += v*dt*0.62;
    const over = Math.max(0, MG.temp-(has('sag')?0.90:0.84));
    MG.burn += over*dt*1.5 + Math.max(0,MG.done-1.05)*dt*1.1;
    MG.burn = clamp(MG.burn,0,1);
    A.fryLevel(clamp(MG.temp*1.1,0,1), MG.temp);
    if(MG.done>1.55 || MG.burn>=1){ liftBasket(); }
  }
}

  const tw=W*.165, th=tw*.82;

  cx.fillStyle=lg(0,0,0,by*.6,[[0,'rgba(30,16,10,.55)'],[1,'rgba(30,16,10,0)']]);
  cx.fillRect(0,0,W,by*.6);

  cx.beginPath(); cx.moveTo(0,railY); cx.lineTo(W,railY); cx.stroke();
  cx.strokeStyle='#C6D2DE'; cx.lineWidth=iw(0.5);
  cx.beginPath(); cx.moveTo(0,railY); cx.lineTo(W,railY); cx.stroke();
  for(let i=0;i<5;i++){

    if(i===1||i===3){

      gloss(ux+sway-W*.012, railY+H*.069, W*.010, H*.007, 0, .6);
    } else if(i===2){
      /* a bundle of onions, because this is a koshary kitchen */
      for(let k=0;k<3;k++)
        inkEll(ux+sway+(k-1)*W*.020, railY+H*.062+Math.abs(k-1)*H*.010, W*.019, H*.018,
               '#E8C98A', 0.45);
    } else {
      inkRR(ux+sway-W*.024, railY+H*.036, W*.048, H*.062, 4, '#B9C6D4', 0.5);
      gloss(ux+sway-W*.016, railY+H*.044, W*.010, H*.022, 0, .5);
    }
  }

  /* ---- sacks of rice and lentils slumped against the wall, half out of frame */
  for(let i=0;i<2;i++){
    const sx=W*(.055+i*.89), sy=by, wd=W*.155, ht=H*.105;
    cx.beginPath();
    cx.moveTo(sx-wd, sy);
    cx.quadraticCurveTo(sx-wd*1.05, sy-ht*.78, sx-wd*.42, sy-ht*.92);
    cx.quadraticCurveTo(sx, sy-ht*1.02, sx+wd*.42, sy-ht*.92);
    cx.quadraticCurveTo(sx+wd*1.05, sy-ht*.78, sx+wd, sy);
    cx.closePath();
    inkFill(i? '#C9AE7E' : '#DCC79C', 0.85);
    cx.save(); cx.clip();
    cx.fillStyle='rgba(96,64,38,.26)'; cx.fillRect(sx+wd*.18, sy-ht*1.2, wd, ht*1.6);
    cx.fillStyle='rgba(255,255,255,.26)'; rr(sx-wd*.72, sy-ht*.70, wd*.22, ht*.52, wd*.11); cx.fill();
    cx.restore();
    /* the gathered, tied neck */
    inkEll(sx, sy-ht*.94, wd*.34, ht*.13, i? '#B89A6A':'#CCB68A', 0.42);
    cx.strokeStyle=INK; cx.lineWidth=iw(0.42);
    cx.beginPath(); cx.moveTo(sx-wd*.30, sy-ht*.96); cx.lineTo(sx+wd*.30, sy-ht*.96); cx.stroke();
    /* a stencilled band, the way feed sacks are marked */
    cx.save(); cx.globalAlpha=.5;
    inkRR(sx-wd*.40, sy-ht*.52, wd*.80, ht*.20, 3, i?'#8E5C3A':'#A0442E', 0.26);
    cx.restore();
  }

  /* ---- the bench */
  cx.beginPath(); cx.rect(0,by,W,H-by);
  inkFill('#A6B6C6', 1.2);
  cx.save(); cx.clip();
  cx.fillStyle='rgba(56,78,104,.22)'; cx.fillRect(0,by+(H-by)*0.46,W,H-by);
  for(let i=0;i<8;i++){

  cx.restore();
  cx.strokeStyle='#F2F8FF'; cx.lineWidth=iw(0.7);

  const art = st ? (st.kind==='fry'?'fry':(recipeFor(MG.key)||{}).art||'pot') : 'pot';
  drawBurner(W*.5, by+H*0.022, tm, art);

  if(st) drawMGUi(tm);
}

function drawBurner(x,by,tm,art){
  const flame = (MG.step && (MG.step.kind==='reduce'||MG.step.kind==='gauge'||MG.step.kind==='skim'))
      ? 1 : (MG.step && MG.step.kind==='fry' ? (MG.heat?1:0.25) : .6);
  /* ring */
  inkEll(x, by-H*.006, W*.21, H*.030, '#3A4550', 0.9);
  inkEll(x, by-H*.006, W*.15, H*.021, '#2A333D', 0.5);
  /* gas flame, as flat outlined tongues */
  const fl = MG.step&&MG.step.kind==='fry' ? clamp(MG.heat?1:.18,0,1) : flame;
  if(fl>0.05){
    cx.save(); cx.globalAlpha=.14*fl; cx.fillStyle=rg(x,by-H*.02,2,W*.24,
      [[0,'rgba(90,168,224,.9)'],[1,'rgba(90,168,224,0)']]);
    cx.beginPath(); cx.arc(x,by-H*.02,W*.24,0,6.283); cx.fill(); cx.restore();
    for(let i=0;i<11;i++){
      const a=i/11*6.283, fx=x+Math.cos(a)*W*.135, fy=by-H*.014+Math.sin(a)*H*.019;
      const hgt=(H*.022+Math.sin(tm*.012+i)*H*.007)*fl;
      cx.beginPath(); cx.moveTo(fx-W*.010,fy);
      cx.quadraticCurveTo(fx,fy-hgt*1.8,fx+W*.010,fy); cx.closePath();
      inkFill('#5AA8E0', 0.26);
      cx.beginPath(); cx.moveTo(fx-W*.004,fy);
      cx.quadraticCurveTo(fx,fy-hgt*1.0,fx+W*.004,fy); cx.closePath();
      cx.fillStyle='#DCEEFF'; cx.fill();
    }
  }
  const py = by - H*.075;
  if(art==='fry') drawFryPan(x,py,tm);
  else if(art==='pan') drawSaucePan(x,py,tm);
  else drawBigPot(x,py,tm);
}
function drawBigPot(x,y,tm){
  const rx=W*.225, ry=H*.046, d=H*.120;
  MG.pot={x,y,rx,ry};
  steelBody(x,y,rx,ry,d,true);
  const boil = MG.step&&MG.step.kind==='reduce' ? clamp(MG.prog*1.3,0,1) : .55;
  /* the pot bubbles harder as it reduces — squash the whole body with it */
  cx.save(); ell(x,y,rx*.9,ry*.9); cx.clip();
  const k=MG.key;
  cx.fillStyle = k==='maca' ? '#EBD9A8' : k==='ads' ? '#7A5434' : k==='homos' ? '#D0B075' : '#E0C79A';
  ell(x,y,rx*.9,ry*.9); cx.fill();
  gloss(x-rx*.22, y-ry*.22, rx*.34, ry*.30, -.2, .26);
  for(let i=0;i<14;i++){
    const ph=((tm*.0012)+sr(i*3.7))%1;
    const bx=x+(sr(i)-.5)*rx*1.5, byy=y+(sr(i+9)-.5)*ry*1.3;
    const r=(2.4+sr(i+3)*4.6)*ph*boil;
    if(r<1) continue;
    cx.beginPath(); cx.arc(bx,byy,r,0,6.283);
    cx.save(); cx.globalAlpha=(1-ph)*.85*boil;
    inkFill('#FFF6EA', 0.22); cx.restore();
  }
  cx.restore();
  steelRim(x,y,rx,ry,Math.max(3.4,ry*.28));
  /* the foam rises OVER the rim, so it is drawn after the clip is released
     and stays big enough to actually hit with a thumb */
  if(MG.step&&MG.step.kind==='skim'){
    MG.foam.forEach(f=>{
      cx.save();
      cx.globalAlpha = f.hit? clamp(1-f.t*1.6,0,1) : (f.miss?.4:1);
      const grow = f.hit ? 1+ f.t*0.8 : clamp(f.t*3.2,0.35,1);
      cloud(f.x, f.y - f.r*0.35, f.r*1.35*grow, Math.floor(f.x*7), '#FFF8EC', 1, 0.34);
      if(!f.hit && !f.miss && f.t>1.2){
        cx.globalAlpha=0.5+0.5*Math.sin(tm*0.02);
        cx.beginPath(); cx.ellipse(f.x, f.y-f.r*0.35, f.r*1.8, f.r*1.6, 0,0,6.283);
        cx.lineWidth=iw(0.35); cx.strokeStyle='#FFC93C'; cx.stroke();
      }
      cx.restore();
    });
  }
  /* handles */
  cx.strokeStyle=INK; cx.lineWidth=iw(1.0);
  [-1,1].forEach(sg=>{ cx.beginPath();
    cx.arc(x+sg*rx, y+d*0.42, ry*0.72, sg>0?-1.1:2.05, sg>0?1.1:4.25); cx.stroke(); });
  cx.strokeStyle='#C6D2DE'; cx.lineWidth=iw(0.55);
  [-1,1].forEach(sg=>{ cx.beginPath();
    cx.arc(x+sg*rx, y+d*0.42, ry*0.72, sg>0?-1.1:2.05, sg>0?1.1:4.25); cx.stroke(); });
  steam(x,y-ry*1.5,rx*.72,boil*1.2,tm);
}

function drawFryPan(x,y,tm){
  const rx=W*.245, ry=H*.053, d=H*.078;
  steelBody(x,y,rx,ry,d,true);
  cx.save(); ell(x,y,rx*.92,ry*.92); cx.clip();
  /* oil, colouring with temperature */
  const tcol = clamp(MG.temp,0,1);
  cx.fillStyle='rgb('+((176+tcol*64)|0)+','+((132+tcol*38)|0)+','+((54+tcol*10)|0)+')';
  ell(x,y,rx*.92,ry*.92); cx.fill();
  gloss(x-rx*.18, y-ry*.24, rx*.38, ry*.26, -.15, .30);
  /* the onions */
  if(!MG.lifted || MG.resultT<0.4){
    const dn=clamp(MG.done,0,1.6), bn=MG.burn;
    for(let i=0;i<54;i++){
      const a=sr(i*3.3)*6.283, r=Math.sqrt(sr(i*7.7))*.93;
      const ox=x+Math.cos(a)*rx*.86*r, oy=y+Math.sin(a)*ry*.86*r + Math.sin(tm*.006+i)*1.6*clamp(MG.temp*2,0,1);
      const rot=sr(i*2.1)*3.14 + Math.sin(tm*.002+i)*.25;
      let R,G,B;
      if(dn<1){ R=lerp(250,240,dn); G=lerp(240,160,dn); B=lerp(210,52,dn); }
      else { const o=clamp(dn-1,0,.6)/.6; R=lerp(240,102,o); G=lerp(160,54,o); B=lerp(52,22,o); }
      R=lerp(R,36,bn); G=lerp(G,26,bn); B=lerp(B,20,bn);
      cx.save(); cx.translate(ox,oy); cx.rotate(rot);
      const len=8+sr(i+4)*7;
      const stroke=()=>{ cx.beginPath(); cx.moveTo(-len/2,0);
        cx.quadraticCurveTo(0,(sr(i+11)-.5)*7*clamp(dn,.2,1.2),len/2,0); cx.stroke(); };
      cx.lineCap='round';
      cx.strokeStyle=INK; cx.lineWidth=3.4; stroke();
      cx.strokeStyle='rgb('+(R|0)+','+(G|0)+','+(B|0)+')'; cx.lineWidth=2.0; stroke();
      cx.restore();
    }
    /* bubbling oil around them */
    const act=clamp(MG.temp*1.3,0,1);
    for(let i=0;i<18;i++){
      const ph=((tm*.0022)+sr(i*6.1))%1;
      const r=ph*4.6*act+1;
      cx.save(); cx.globalAlpha=(1-ph)*.8*act;
      cx.beginPath(); cx.arc(x+(sr(i)-.5)*rx*1.7, y+(sr(i+13)-.5)*ry*1.5, r,0,6.283);
      inkFill('#FFF6D2', 0.16); cx.restore();
    }
  }
  cx.restore();
  steelRim(x,y,rx,ry,Math.max(3.2,ry*.26));
  /* smoke when the oil is past it */
  if(MG.temp>.86 || MG.burn>.1){
    const sm=clamp((MG.temp-.86)*4+MG.burn*2,0,1.6);
    steam(x,y-ry*1.7,rx*.76,sm*1.3,tm,'#6B6058');
  } else {
    steam(x,y-ry*1.6,rx*.66,clamp(MG.temp*1.1,0,1),tm,'#FFE9C8');
  }
}

  const st = MG.step; if(!st) return;

  /* instruction plate, painted on a board and screwed to the wall */
  const ph = hint?H*.115:H*.078;
  rr(W*.05, H*.030, W*.90, ph, W*.035);
  inkFill('#3A2517', 1.0);
  cx.save(); cx.globalAlpha=.22; cx.fillStyle='#FFFFFF';
  rr(W*.065, H*.040, W*.87, ph*0.30, W*.025); cx.fill(); cx.restore();
  [W*.085, W*.915].forEach(bx=>{ inkEll(bx, H*.030+ph/2, W*.010, W*.010, '#C6D2DE', 0.28); });
  inkText(title, W/2, H*.030+ph*0.33, Math.min(18, W*.049), '#FFE9BC', 0.17);
  if(hint) txt(hint, W/2, H*.030+ph*0.74, Math.min(12.5, W*.034), '#D6C0A4', 700);

  if(st.kind==='gauge'){
    const y = H*.44, tx = W*.10, tw = W*.80, th = H*.030;
    const bw = bandWidth(st.band);
    /* the colour ramp you are judging by eye */
    const ramp = st.ramp==='garlic'
      ? [[0,'#F3E6B8'],[.5,'#E6C05E'],[.74,'#B4762A'],[1,'#4A2A0E']]
      : [[0,'#F0E4C0'],[.5,'#E3B45C'],[.72,'#B9742A'],[1,'#3E220C']];
    cx.fillStyle = lg(tx,0,tx+tw,0,ramp); rr(tx,y-th/2,tw,th,th/2); cx.fill();
    /* the good window */
    const cxp = tx+tw*0.5;
    cx.save(); cx.globalCompositeOperation='lighter';
    cx.fillStyle='rgba(255,255,255,.28)';
    rr(cxp-tw*bw/2, y-th/2, tw*bw, th, th/2); cx.fill(); cx.restore();
    cx.strokeStyle='rgba(255,255,255,.85)'; cx.lineWidth=2;
    rr(cxp-tw*bw/2, y-th*.78, tw*bw, th*1.56, th*.5); cx.stroke();
    /* needle */
    const nx = cxp + MG.needle*tw*0.5;
    cx.fillStyle='#150F0C'; rr(nx-3, y-th*1.25, 6, th*2.5, 3); cx.fill();
    cx.fillStyle= MG.locked ? '#F6C26B' : '#FFF6E2'; rr(nx-1.8, y-th*1.15, 3.6, th*2.3, 2); cx.fill();
    shadowOn('rgba(0,0,0,.6)',8,0,2);
    cx.fillStyle='#FFF6E2';
    cx.beginPath(); cx.moveTo(nx,y-th*1.5); cx.lineTo(nx-6,y-th*2.1); cx.lineTo(nx+6,y-th*2.1); cx.closePath(); cx.fill();
    shadowOff();
  }
  else if(st.kind==='reduce'){
    const y=H*.44, tx=W*.10, tw=W*.80, th=H*.032;
    cx.fillStyle='rgba(0,0,0,.5)'; rr(tx,y-th/2,tw,th,th/2); cx.fill();
    const [a,b]=st.band, half=(b-a)/2*(has('gas')?1.3:1), mid=(a+b)/2;
    cx.fillStyle='rgba(111,191,115,.35)';
    rr(tx+tw*(mid-half), y-th/2, tw*half*2, th, th/2); cx.fill();
    cx.strokeStyle='rgba(143,226,143,.9)'; cx.lineWidth=2;
    rr(tx+tw*(mid-half), y-th*.8, tw*half*2, th*1.6, th*.5); cx.stroke();
    /* burn zone */
    cx.fillStyle='rgba(228,87,76,.4)'; rr(tx+tw*1.0, y-th/2, tw*.14, th, th/2); cx.fill();
    const p=clamp(MG.prog,0,1.14);
    cx.fillStyle = lg(tx,0,tx+tw,0,[[0,'#8FE28F'],[.7,'#F6C26B'],[1,'#E4574C']]);
    rr(tx,y-th/2,tw*Math.min(p,1.14),th,th/2); cx.fill();
    const nx=tx+tw*p;
    cx.fillStyle='#FFF6E2'; rr(nx-2.2,y-th*1.15,4.4,th*2.3,2); cx.fill();
  }
  else if(st.kind==='skim'){
    const y=H*.44, n=(st.rounds||3);
    /* one pip per round, on a plate so they read against the tiles */
    const pw=W*.095*n+W*.05;
    inkRR(W/2-pw/2, y-H*.030, pw, H*.060, H*.030, '#3A2517', 0.42);
    for(let i=0;i<n;i++){
      const bx=W/2 + (i-(n-1)/2)*W*.095;
      const on = i<MG.skimHits;
      cx.beginPath(); cx.arc(bx,y,W*.026,0,6.283);
      inkFill(on? '#59D97C' : '#8A7460', 0.42);
      if(on) inkText('✓', bx, y+1, W*.032, '#0E2E19', 0.12, 'Cairo, sans-serif');
    }
  }
  else if(st.kind==='fry'){
    /* thermometer down the side */
    const gx=W*.115, gy0=H*.30, gy1=H*.66, gw=W*.060;
    cx.fillStyle='rgba(0,0,0,.5)'; rr(gx-gw/2,gy0,gw,gy1-gy0,gw/2); cx.fill();
    const ideal0=.55, ideal1=.80;
    cx.fillStyle='rgba(111,191,115,.35)';
    rr(gx-gw/2, gy1-(gy1-gy0)*ideal1, gw, (gy1-gy0)*(ideal1-ideal0), 3); cx.fill();
    cx.fillStyle='rgba(228,87,76,.35)';
    rr(gx-gw/2, gy0, gw, (gy1-gy0)*(1-(has('sag')?.90:.84)), 3); cx.fill();
    const th2 = clamp(MG.temp,0,1.12);
    cx.fillStyle = lg(0,gy1,0,gy0,[[0,'#5A93D8'],[.5,'#E8B341'],[.86,'#E4574C'],[1,'#7A1E12']]);
    rr(gx-gw/2+2, gy1-(gy1-gy0)*th2, gw-4, (gy1-gy0)*th2, 3); cx.fill();
    cx.strokeStyle='rgba(255,255,255,.3)'; cx.lineWidth=1.2;
    rr(gx-gw/2,gy0,gw,gy1-gy0,gw/2); cx.stroke();
    inkRR(gx-W*.055, gy0-H*.046, W*.110, H*.034, H*.017, '#3A2517', 0.36);
    txt(L==='ar'?'الزيت':'Oil', gx, gy0-H*.029, Math.min(12,W*.032), '#FFE0B0', 800);
    /* doneness arc on the right */
    const ax=W*.855, ay=H*.46, ar=W*.070;
    cx.strokeStyle='rgba(0,0,0,.5)'; cx.lineWidth=W*.03;
    cx.beginPath(); cx.arc(ax,ay,ar,Math.PI*.72,Math.PI*2.28); cx.stroke();
    const dn=clamp(MG.done,0,1.5)/1.5;
    cx.strokeStyle = MG.burn>.25? '#E4574C' : (MG.done>.86&&MG.done<1.14? '#8FE28F':'#E8B341');
    cx.lineWidth=W*.03; cx.lineCap='round';
    cx.beginPath(); cx.arc(ax,ay,ar,Math.PI*.72,Math.PI*.72+ (Math.PI*1.56)*dn); cx.stroke();
    /* the gold mark you are aiming at */
    const ma=Math.PI*.72+Math.PI*1.56*(1/1.5);
    cx.strokeStyle='#FFF6E2'; cx.lineWidth=2.6;
    cx.beginPath();
    cx.moveTo(ax+Math.cos(ma)*(ar-W*.022), ay+Math.sin(ma)*(ar-W*.022));
    cx.lineTo(ax+Math.cos(ma)*(ar+W*.022), ay+Math.sin(ma)*(ar+W*.022)); cx.stroke();
    inkRR(ax-W*.058, ay+ar+H*.012, W*.116, H*.034, H*.017, '#3A2517', 0.36);
    txt((L==='ar'?'الدهب':'Gold'), ax, ay+ar+H*.029, Math.min(12,W*.032), '#FFE0B0', 800);
    if(st.rounds>1) inkText((MG.round+1)+'/'+st.rounds, ax, ay, Math.min(17,W*.046), '#FFF1CF', 0.16);
  }
  /* verdict */
  if(MG.msg && MG.msgT<1.5){
    const al=clamp(1-(MG.msgT-1.0)/0.5,0,1);
    const pop2 = clamp(MG.msgT/0.16,0,1);
    cx.save(); cx.globalAlpha=al;
    inkText(MG.msg, W/2, H*.50, Math.min(30,W*.082)*(0.5+0.5*easeOut(pop2)+ (1-pop2)*0.3),
            '#FFF1CF', 0.18, 'Lalezar, Cairo, sans-serif', (1-pop2)*0.25);
    cx.restore();
  }
}

        nf(km.price)+' '+t('cur')+'</span></div>';

  }
  const sz=SIZES[tk.size];
  let rows='';
  Object.keys(tk.spec).forEach(k=>{
    const want=tk.spec[k]; if(want<=0) return;
    const got=b.amt[k]||0;

    const label = useSlang ? slangOf(k) : (L==='ar'?ING[k].ar:ING[k].en);

    rows += '<li class="no"><span>'+(L==='ar'?'من غير ':'no ')+label+'</span><b>'+(b.amt[m.k]||0)+'</b></li>';
  });
  const tag = tk.takeaway ? (L==='ar'?'سفري':'Takeaway') : (L==='ar'?'صالة':'Dine in');
  const A2 = ARCH[tk.arch]||ARCH.walkin;
  const who = A2.icon+' '+(L==='ar'?A2.ar:A2.en)+(tk.hot?' 🌶':'');
  const tot = totalScoops(b), want = bowlTarget();
  el.innerHTML =
    '<div class="sTop"><span class="sName">'+nm(sz)+'</span><span class="sNo">#'+tk.no+'</span></div>'+
    '<div class="sWho">'+who+'</div>'+
    '<ul>'+rows+'</ul>'+
    '<div class="sFoot"><span>'+tag+(tot>want?' · '+t('overfull'):'')+'</span><span>'+
      nf(ticketPrice(tk))+' '+t('cur')+'</span></div>';
  el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick');
}

/* ---------------------------------------------------------- little canvases
   Small icons drawn rather than shipped, so the page stays one file. */
function miniCanvas(w,h,fn){
  const c=document.createElement('canvas'); const dpr=Math.min(devicePixelRatio||1,2);
  c.width=w*dpr; c.height=h*dpr; c.style.width=w+'px'; c.style.height=h+'px';
  const g=c.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0);
  fn(g,w,h); return c;
}
/* Bake a drawn canvas into an <img>. Card markup is assembled as HTML strings,
   and a canvas serialised with .outerHTML loses every pixel it was holding —
   which is why these illustrations used to render as flat empty rectangles. */
function miniIMG(canvas, cls, alt){
  let src=''; try{ src = canvas.toDataURL('image/png'); }catch(e){}
  const i=document.createElement('img');
  i.src=src; i.alt=alt||''; i.decoding='async';
  i.style.display='block'; i.style.width='100%'; i.style.height='100%';
  if(cls) i.className=cls;
  return i.outerHTML;
}
function upIcon(id){
  return miniCanvas(38,38,(g,w,h)=>{
    g.fillStyle='rgba(0,0,0,0)'; g.fillRect(0,0,w,h);
    const c=w/2;
    const steel=g.createLinearGradient(4,0,w-4,0);
    steel.addColorStop(0,'#5A626B'); steel.addColorStop(.4,'#D4DBE2'); steel.addColorStop(1,'#4A5159');
    if(id==='sag'||id==='vat'){
      g.fillStyle=steel; g.beginPath(); g.ellipse(c,14,13,5,0,0,6.283); g.fill();
      g.fillStyle='#3A4149'; g.fillRect(c-13,14,26,12);
      g.beginPath(); g.ellipse(c,26,13,5,0,0,6.283); g.fill();
      g.strokeStyle='#EDF2F7'; g.lineWidth=1.8; g.beginPath(); g.ellipse(c,14,13,5,0,0,6.283); g.stroke();
    } else if(id==='knife'){
      g.fillStyle=steel; g.beginPath(); g.moveTo(6,26); g.lineTo(24,8); g.lineTo(28,12); g.lineTo(10,30); g.closePath(); g.fill();
      g.fillStyle='#5A3B22'; g.fillRect(4,26,8,6);
    } else if(id==='gas'){
      g.fillStyle='#3BA0F0'; for(let i=0;i<3;i++){ g.beginPath();
        g.moveTo(10+i*9,28); g.quadraticCurveTo(14+i*9,14,18+i*9,28); g.fill(); }
      g.fillStyle='#2C3239'; g.fillRect(6,28,26,4);
    } else if(id==='spoon'){
      g.strokeStyle=steel; g.lineWidth=3; g.lineCap='round';
      g.beginPath(); g.moveTo(8,30); g.lineTo(26,12); g.stroke();
      g.fillStyle=steel; g.beginPath(); g.ellipse(28,9,7,5,-0.7,0,6.283); g.fill();
    } else if(id==='fan'){
      g.strokeStyle='#9FB6C9'; g.lineWidth=2; g.beginPath(); g.arc(c,c,12,0,6.283); g.stroke();
      g.fillStyle='#C3D4E2';
      for(let i=0;i<3;i++){ g.save(); g.translate(c,c); g.rotate(i*2.09);
        g.beginPath(); g.ellipse(0,-6,3.6,7,0,0,6.283); g.fill(); g.restore(); }
      g.fillStyle='#5A626B'; g.beginPath(); g.arc(c,c,3,0,6.283); g.fill();
    } else if(id==='bowl'){
      g.fillStyle=steel; g.beginPath(); g.moveTo(5,15); g.quadraticCurveTo(c,34,33,15);
      g.ellipse(c,15,14,5,0,0,Math.PI,true); g.fill();
      g.strokeStyle='#EDF2F7'; g.lineWidth=2; g.beginPath(); g.ellipse(c,15,14,5,0,0,6.283); g.stroke();
    } else if(id==='till'){
      g.fillStyle='#8A6A3E'; g.fillRect(6,14,26,18);
      g.fillStyle='#C9A24A'; g.fillRect(9,17,20,7);
      g.fillStyle='#3A2C1C'; for(let i=0;i<3;i++) for(let j=0;j<2;j++) g.fillRect(10+i*6,26+j*3,4,2);
      g.fillStyle='#EFE3C8'; g.fillRect(14,6,10,9);
    } else if(id==='fridge'){
      g.fillStyle='#D8DEE4'; g.fillRect(9,5,20,28);
      g.fillStyle='#9FB0BE'; g.fillRect(9,5,20,12);
      g.fillStyle='#5A626B'; g.fillRect(25,10,2,6); g.fillRect(25,22,2,6);
      g.fillStyle='#C94B3A'; g.fillRect(12,20,4,8); g.fillStyle='#3A7BC9'; g.fillRect(18,20,4,8);
    } else if(id==='hatly'){
      g.fillStyle='#EFE6D2'; g.beginPath(); g.moveTo(9,14); g.lineTo(29,14); g.lineTo(26,32); g.lineTo(12,32); g.closePath(); g.fill();
      g.fillStyle='#D9C9A8'; g.beginPath(); g.ellipse(19,14,10,3.5,0,0,6.283); g.fill();
      g.fillStyle='#B0703A'; g.beginPath(); g.arc(16,12,1.6,0,6.283); g.arc(22,13,1.4,0,6.283); g.fill();
    } else if(id==='music'){
      g.fillStyle='#2E2A28'; g.fillRect(5,11,28,16);
      g.fillStyle='#C9C2B4'; g.beginPath(); g.arc(13,19,4,0,6.283); g.arc(25,19,4,0,6.283); g.fill();
      g.fillStyle='#2E2A28'; g.beginPath(); g.arc(13,19,1.5,0,6.283); g.arc(25,19,1.5,0,6.283); g.fill();
      g.fillStyle='#E8B341'; g.fillRect(5,11,28,2.5);
    } else if(id==='neon'){
      g.strokeStyle='#3BB0FF'; g.lineWidth=3; g.lineCap='round';
      g.shadowColor='#3BB0FF'; g.shadowBlur=7;
      g.beginPath(); g.moveTo(7,12); g.lineTo(31,12); g.stroke();
      g.strokeStyle='#FF3355'; g.shadowColor='#FF3355';
      g.beginPath(); g.moveTo(7,20); g.lineTo(31,20); g.stroke();
      g.beginPath(); g.moveTo(7,28); g.lineTo(24,28); g.stroke();
      g.shadowBlur=0;
    } else if(id==='mirror'){
      g.fillStyle='rgba(200,225,255,.22)'; g.fillRect(6,6,12,26); g.fillRect(20,6,12,26);
      g.strokeStyle='#C9A24A'; g.lineWidth=2; g.strokeRect(6,6,12,26); g.strokeRect(20,6,12,26);
      g.fillStyle='rgba(255,255,255,.35)'; g.beginPath();
      g.moveTo(7,30); g.lineTo(17,10); g.lineTo(13,30); g.closePath(); g.fill();
    } else if(id==='runner'){
      g.fillStyle='#C08D5F'; g.beginPath(); g.arc(19,10,5,0,6.283); g.fill();
      g.fillStyle='#3C5A70'; g.beginPath(); g.moveTo(12,32); g.quadraticCurveTo(19,14,26,32); g.closePath(); g.fill();
      g.fillStyle=steel; g.beginPath(); g.ellipse(28,16,6,2.5,0,0,6.283); g.fill();
    } else if(id==='relay'){
      /* a boy with his hands cupped, calling the order down */
      g.fillStyle='#D79B6B'; g.beginPath(); g.arc(15,13,6,0,6.283); g.fill();
      g.fillStyle='#5CC08A'; g.beginPath(); g.moveTo(7,33); g.quadraticCurveTo(15,16,23,33); g.closePath(); g.fill();
      g.strokeStyle='#FFD97A'; g.lineWidth=2; g.lineCap='round';
      for(let i=0;i<3;i++){ g.beginPath();
        g.arc(21,12,6+i*4.5,-0.8,0.8); g.stroke(); }
    } else if(id==='kemala'){
      /* a small warm pot with a second helping heaped over the rim */
      g.fillStyle=steel; g.beginPath(); g.ellipse(19,18,11,4.5,0,0,6.283); g.fill();

/* =================================================================== economy
   Prices climb chapter to chapter the way they actually did; costs are pegged
   to the same ladder so a day always roughly balances. */
const ECON = [0.17, 0.5, 1.0, 1.8, 3.1];
function econ(){ return ECON[Math.min(S.chIdx,4)]; }
function cookCost(k){
  const ev=EV(), mult = (ev.cook && ev.cook[k]) ? ev.cook[k] : 1;
  return Math.max(1, Math.round(RECIPE[k].cost*econ()*mult));
}
function rentToday(){ return S.chIdx===0 ? 0 : Math.round([0,26,70,150,260,200][Math.min(S.chIdx,5)]); }
function avgPrice(){
  const c=ch(), i=Math.min(S.chIdx,4);
  let s=0; c.sizes.forEach(k=> s+=SIZES[k].price[i]);
  return s/c.sizes.length;
}
function goalToday(){
  if(S.mode==='casual' || !ch().goal) return 0;
  const base = dayCustomers()*avgPrice()*0.60;
  return Math.round((base + rentToday()) / 5) * 5;
}

/* ---------------------------------------------------------------- key art
   Everything on the cards is drawn here rather than shipped as an image, so
   the game stays one portable file. These are painted flat and bright: the
   old chapter photos were sepia-on-black and read as a dead rectangle on a
   dark card, which is exactly the hole the title screen used to have. */

/* tiny local ink helpers — miniCanvas hands us its own context */
function mk(g){
  const o = {
    w:0,h:0,
    ink(lw){ g.lineJoin='round'; g.lineCap='round'; g.lineWidth=lw; g.strokeStyle='#241109'; g.stroke(); return o; },
    fillInk(col,lw){ g.fillStyle=col; g.fill(); o.ink(lw); return o; },
    rect(x,y,w,h,r,col,lw){
      const k=Math.min(r,w/2,h/2); g.beginPath();
      g.moveTo(x+k,y); g.arcTo(x+w,y,x+w,y+h,k); g.arcTo(x+w,y+h,x,y+h,k);
      g.arcTo(x,y+h,x,y,k); g.arcTo(x,y,x+w,y,k); g.closePath();
      return o.fillInk(col,lw);
    },
    el(x,y,rx,ry,col,lw){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,6.283); return o.fillInk(col,lw); },
    glow(x,y,r,col,a){ g.save(); g.globalAlpha=a; g.fillStyle=col;
      g.beginPath(); g.arc(x,y,r,0,6.283); g.fill(); g.restore(); return o; }
  };
  return o;
}

      o.el(w*(.30-i*.045), h*(.30+i*.085), 4, 3, c, 1.6);

    g.beginPath();

      o.rect(bx, h-bh-h*.22, bw, bh+6, 4, b%2?'#4A3E5E':'#5B4352', 2.2);
      for(let r=0;r<3;r++) for(let c=0;c<2;c++){
        const on=((b*7+r*2+c)%3)!==0;
        o.rect(bx+bw*(.2+c*.4), h-bh-h*.22+bh*(.15+r*.26), bw*.2, bh*.13, 2,
               on?'#FFD97A':'#2E2438', 1.4);
      }
    }
    /* pavement */
    g.fillStyle='#5A4436'; g.fillRect(0,h*.78,w,h*.22);
    g.strokeStyle='#241109'; g.lineWidth=2.6;
    g.beginPath(); g.moveTo(0,h*.78); g.lineTo(w,h*.78); g.stroke();
    if(kind===1){
      /* the wooden cart with three pots */
      o.rect(w*.28, h*.54, w*.44, h*.24, 5, '#A06A3E', 3);
      o.rect(w*.28, h*.54, w*.44, h*.05, 3, '#7A4E2C', 2.2);
      for(let i=0;i<3;i++) o.el(w*(.37+i*.13), h*.545, w*.048, h*.026, '#B9C6D4', 2.4);
      o.el(w*.33, h*.80, h*.055, h*.055, '#3A3038', 2.6);
      o.el(w*.67, h*.80, h*.055, h*.055, '#3A3038', 2.6);
      o.glow(w*.20, h*.46, h*.28, '#FFD98A', .30);
      o.el(w*.20, h*.46, h*.05, h*.05, '#FFE9A8', 2.4);
    } else if(kind===5){
      /* the record-breaking dish, ten metres across */
      o.el(w*.5, h*.68, w*.42, h*.15, '#B9C6D4', 3);
      o.el(w*.5, h*.645, w*.38, h*.125, '#E6D2A0', 2.6);
      o.el(w*.5, h*.62, w*.22, h*.07, '#E0361F', 2.4);
      g.save(); g.strokeStyle='#FFA82E'; g.lineWidth=2.6; g.lineCap='round';
      for(let i=0;i<24;i++){
        const ox=w*.5+((i*17)%120)-60, oy=h*.595+((i*7)%14)-7;
        g.beginPath(); g.moveTo(ox-4,oy); g.quadraticCurveTo(ox,oy+3,ox+4,oy); g.stroke();
      }
      g.restore();
      for(let i=0;i<5;i++){
        const x=w*(.12+i*.19);
        o.el(x, h*.50, h*.045, h*.05, '#D79B6B', 2.4);
        g.beginPath(); g.moveTo(x-h*.05,h*.78); g.quadraticCurveTo(x,h*.50,x+h*.05,h*.78);
        g.closePath(); o.fillInk(['#5AA8E0','#D14F7A','#5CC08A','#F0D77A','#8A6FB0'][i],2.2);
      }
    } else {
      /* the shopfront, floors stacked up */
      const fw=w*.56, fx=w*.22, fy=h*.36;
      o.rect(fx, fy, fw, h*.44, 6, '#6B4028', 3);
      o.rect(fx+8, fy+h*.12, fw-16, h*.26, 4, '#FFD97A', 2.4);
      if(kind===4||kind===99){
        ['#4FC8FF','#FF4F7A','#4FC8FF'].forEach((c,i)=>{
          g.save(); g.shadowColor=c; g.shadowBlur=10;
          g.strokeStyle=c; g.lineWidth=4; g.lineCap='round';
          g.beginPath(); g.moveTo(fx+6,fy+8+i*10); g.lineTo(fx+fw-6,fy+8+i*10); g.stroke();
          g.restore();
        });
      } else {
        o.rect(fx, fy, fw, h*.075, 3, '#D14F7A', 2.4);
      }
      /* the queue at the door */
      for(let i=0;i<4;i++){
        const px=fx+fw*(.16+i*.22);
        o.el(px, h*.62, h*.042, h*.046, '#D79B6B', 2.4);
        g.beginPath(); g.moveTo(px-h*.05,h*.80); g.quadraticCurveTo(px,h*.60,px+h*.05,h*.80);
        g.closePath(); o.fillInk(['#5AA8E0','#5CC08A','#D14F7A','#F0D77A'][i],2.2);
      }
      /* stacked takeaway tubs in the window — the shop's visual signature */
      for(let i=0;i<5;i++) o.rect(fx+fw-34, fy+h*.30-i*7, 26, 7, 2, '#EFF3F6', 1.4);
    }
    /* a light warm wash, not a black vignette */
    const vg=g.createRadialGradient(w/2,h*.45,h*.2,w/2,h*.5,h*1.1);
    vg.addColorStop(0,'rgba(255,225,160,.10)'); vg.addColorStop(1,'rgba(50,18,10,.38)');
    g.fillStyle=vg; g.fillRect(0,0,w,h);
  });
}

function dayEnd(){
  const goal=goalToday(), net=SV.takings+SV.tips-rentToday();
  const drink = has('fridge') ? Math.round(SV.served*avgPrice()*0.14) : 0;
  const sweet = has('hatly') ? Math.round(SV.served*avgPrice()*0.10) : 0;
  S.money += drink + sweet - rentToday();
  const total = net + drink + sweet;
  const ok = !goal || total>=goal;
  const ar=L==='ar';
  let rows =
   '<div class="row"><span>'+t('served')+'</span><b>'+SV.served+' / '+(SV.served+SV.walked)+'</b></div>'+
   '<div class="row"><span>'+t('perfect')+'</span><b>'+S.stats.perfect+' '+t('bowls')+'</b></div>'+
   '<div class="row"><span>'+t('earned')+'</span><b>'+nf(SV.takings)+'</b></div>'+
   '<div class="row"><span>'+t('tips')+'</span><b>'+nf(SV.tips)+'</b></div>';
  if(SV.kemalaDone) rows+='<div class="row pos"><span>'+t('kemala')+'</span><b>'+SV.kemalaDone+'</b></div>';
  if(SV.comboBest>=3) rows+='<div class="row pos"><span>'+t('combo')+'</span><b>'+SV.comboBest+'× '+t('streak')+'</b></div>';
  if(SV.spill) rows+='<div class="row neg"><span>'+t('spill')+'</span><b>'+SV.spill+'</b></div>';
  if(drink) rows+='<div class="row"><span>'+(ar?'صودا':'Soda')+'</span><b>'+nf(drink)+'</b></div>';
  if(sweet) rows+='<div class="row"><span>'+(ar?'رز بلبن':'Rice pudding')+'</span><b>'+nf(sweet)+'</b></div>';
  if(rentToday()) rows+='<div class="row neg"><span>'+(ar?'إيجار':'Rent')+'</span><b>−'+nf(rentToday())+'</b></div>';
  rows+='<div class="row tot"><span>'+t('net')+'</span><b>'+nf(total)+' '+t('cur')+'</b></div>';
  if(goal) rows+='<div class="row '+(ok?'pos':'neg')+'"><span>'+t('goal')+'</span><b>'+nf(goal)+'</b></div>';

  const c=ch();
  const lastDay = S.mode!=='casual' && S.dayInCh>=c.days;
  let btns;
  if(!ok){
    btns='<button class="btn" data-act="retry">'+t('again')+'</button>';
  } else if(lastDay && S.chIdx<CH.length-1){
    btns='<button class="btn ghost" data-act="shopFromEnd">'+t('shopT')+'</button>'+
         '<button class="btn" data-act="nextCh">'+t('newCh')+'</button>';
  } else {
    btns='<button class="btn ghost" data-act="shopFromEnd">'+t('shopT')+'</button>'+
         '<button class="btn" data-act="nextDay">'+t('nextDay')+'</button>';
  }
  const verdict = !ok
    ? (ar?'مقفلتش الهدف. اليوم يتعاد.':'Short of the target. Run the day again.')
    : SV.walked===0 ? (ar?'محدش مشي. يوم نضيف.':'Nobody walked out. A clean day.')
    : (ar?'يوم كويس.':'A good day.');
  /* three stars: did you hit the target, keep everyone, and cook well */
  let stars = 0;
  if(ok) stars++;
  if(SV.walked===0 && SV.served>0) stars++;
  if(SV.served>0 && S.stats.perfect >= Math.ceil(SV.served*0.4)) stars++;
  SV.dayStars = stars;
  if(total > (S.stats.best||0)) S.stats.best = total;
  S.stats.kemala = (S.stats.kemala||0) + SV.kemalaDone;
  S.stats.combo  = Math.max(S.stats.combo||0, SV.comboBest);
  const starHTML = '<div class="stars">'+[0,1,2].map(i=>
    '<span class="'+(i<stars?'lit':'')+'">★</span>').join('')+'</div>';
  openOv('<div class="card"><div class="eyebrow">'+t('dayL')+' '+S.day+'</div>'+
    '<h2>'+(ar?'الحساب':'The books')+'</h2>'+
    starHTML+
    '<p class="lead">'+verdict+'</p>'+
    '<div class="rows">'+rows+'</div>'+
    '<div class="ovBtns">'+btns+'</div></div>', true);
  if(stars>=2){ A.chord([523,659,784,1046],.3,.13); }
  hud(); saveGame();
}

function retryDay(){
  S.event = rollEvent().id;
  S.clock=0;
  for(const k in S.batch) if(S.batch[k]) S.batch[k].t0=0;
  S.stats.perfect=0;
  prepScreen();
}
function nextChapter(){
  S.chIdx=Math.min(S.chIdx+1, CH.length-1);
  S.dayInCh=1; S.day++; S.clock=0; S.stats.perfect=0;
  S.event = rollEvent().id;
  if(ch().kitchen && !S.batch.ruz){ /* first kitchen day starts empty on purpose */ }
  layout(); storyCard(); saveGame();
}

/* ================================================================ save/load */
const SKEY='koshary_usta_v2';
function saveGame(){
  try{ localStorage.setItem(SKEY, JSON.stringify({
    v:2, mode:S.mode, chIdx:S.chIdx, day:S.day, dayInCh:S.dayInCh, money:S.money,
    rep:S.rep, ups:S.ups, batch:S.batch, soaked:S.soaked, stats:S.stats,
    event:S.event, slangOn:S.slangOn, seenHelp:S.seenHelp, lang:L
  })); }catch(e){}
}
function loadGame(peek){
  try{
    /* v1 saves still load — the new fields simply default */
    const raw=localStorage.getItem(SKEY) || localStorage.getItem('koshary_usta_v1');
    if(!raw) return null;
    const d=JSON.parse(raw); if(peek) return d;
    S=newGame(d.mode); Object.assign(S,d);
    S.screen='prep'; S.clock=0; S.bowl=blankBowl();
    if(!S.event || !EVENTS.some(e=>e.id===S.event)) S.event='calm';
    S.stats = Object.assign({served:0,walked:0,perfect:0,bowls:0,best:0,kemala:0,combo:0}, S.stats||{});
    if(d.lang) L=d.lang;
    return d;
  }catch(e){ return null; }
}

/* ==================================================================== loop */
let last=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (ts-last)/1000 || 0); last=ts;
  const tm = ts;
  cx.clearRect(0,0,W,H);
  if(S.screen==='service'){
    S.clock += dt*60;                     /* an in-game minute a second */
    BOWLHIT = Math.max(0, BOWLHIT - dt*4.6);
    OVER = Math.max(0, OVER - dt*0.25);
    stepVats(dt); stepFlair(dt); comboDecay(dt);
    drawBeyond(tm); drawQueue(tm);
    drawCounter(tm);
    LAY.vats.filter(v=>v.row===0).forEach(v=>drawVat(v,tm));
    LAY.vats.filter(v=>v.row===1).forEach(v=>drawVat(v,tm));
    stepSpoon(dt,tm); stepParts(dt);
    drawParts(); drawHands(tm);
    drawFlair(tm);
    if(SV.stage==='bag') drawBagging(tm);
    if(SV.active && (SV.tk||SV.kemala)){
      SV.pat -= dt*1000/SV.patMax;
      const f=$('#patF'), pw=$('#pat');
      if(f){ f.style.width=Math.max(0,SV.pat*100)+'%';
             f.style.background = SV.pat>.5?'var(--good)':SV.pat>.22?'var(--warn)':'var(--bad)'; }
      if(pw) pw.classList.toggle('panic', SV.pat<=0.22);
      if(SV.pat<=0) walkOut();
    }
    if(SV.combo>=2) renderCombo();
  } else if(S.screen==='cook'){
    stepMG(dt,tm); drawKitchen(tm);
    stepFlair(dt); drawFlair(tm);
  } else if(S.screen==='prep'){
    drawKitchen(tm);
  } else {
    drawBeyond(tm); drawCounter(tm);
    LAY.vats.forEach(v=>drawVat(v,tm));
  }
}
function drawQueue(tm){
  const y = LAY.counterY + H*0.006;
  /* in the flood the room behind fills with heads — drawn first so the
     person at the counter still reads clearly in front of them */
  if(SV.rush){
    cx.save(); cx.globalAlpha=0.22;
    for(let i=0;i<6;i++){
      const hx=W*(0.06+i*0.175)+Math.sin(tm*0.0012+i)*W*0.012;
      const hh=H*0.185*(0.86+sr(i*5.1)*0.2);
      drawPerson(hx, y-H*0.045, hh, makeLook(900+i*7), tm, 5+i, 0.7);
    }
    cx.restore();
  }
  const who=[]; if(SV.tk) who.push(SV.tk);
  /* the relay boy lets you see one extra person deep into the queue */
  const depth = has('relay')? 4 : 3;
  for(let i=0;i<Math.min(depth,SV.queue.length);i++) who.push(SV.queue[i]);
  const spots=[0.30, 0.62, 0.80, 0.13, 0.92];
  for(let i=who.length-1;i>=0;i--){
    const tk=who[i];
    const x = W*spots[i], h = H*0.265*(i===0?1:0.86-i*0.04)*tk.look.h;
    /* only the person being served has real patience; the rest look calm */
    const mood = i===0 ? clamp(SV.pat,0,1) : clamp(0.72 - i*0.06,0,1);
    cx.save(); if(i>0) cx.globalAlpha=0.62-i*0.08;
    drawPerson(x, y, h, tk.look, tm, i, mood, tk.hot && i===0);
    cx.restore();
  }
}
/* Takeaway is its own small ritual: the three sauces never go into the box,
   they go into separate bags beside it, or the food arrives soggy. */
function drawBagging(tm){
  cx.fillStyle='rgba(18,9,5,.86)'; cx.fillRect(0,H*0.62,W,H*0.38);
  cx.strokeStyle=INK; cx.lineWidth=iw(1.0);
  cx.beginPath(); cx.moveTo(0,H*0.62); cx.lineTo(W,H*0.62); cx.stroke();
  const names={salsa:['صلصة','Salsa','#E0361F'],
               daqqa:['دقة','Daqqa','#FFF6E0'],
               shatta:['شطة','Shatta','#FF2D18']};
  inkText(L==='ar'?'كيّس الصلصة والدقة والشطة لوحدهم'
                 :'Bag the three sauces separately',
      W/2, H*0.675, Math.min(15,W*.040), '#FFE9BC', 0.16);
  Object.keys(SAUCES).forEach((s,i)=>{
    const x=W*(0.22+i*0.28), y=H*0.790, done=!!SV.bagged[s];
    const bob = done ? 0 : Math.sin(tm*0.004+i*1.6)*H*0.008;
    cx.save(); cx.translate(0,bob);
    if(!done) cx.globalAlpha=.88;
    /* the bag itself */
    cx.beginPath();
    cx.moveTo(x-W*.052,y-H*.018);
    cx.quadraticCurveTo(x-W*.062,y+H*.050,x,y+H*.058);
    cx.quadraticCurveTo(x+W*.062,y+H*.050,x+W*.052,y-H*.018);
    cx.closePath();
    inkFill('rgba(238,246,252,.82)', 0.75);
    /* the sauce sitting in the bottom of it */
    cx.save();
    cx.beginPath();
    cx.moveTo(x-W*.052,y-H*.018);
    cx.quadraticCurveTo(x-W*.062,y+H*.050,x,y+H*.058);
    cx.quadraticCurveTo(x+W*.062,y+H*.050,x+W*.052,y-H*.018);
    cx.closePath(); cx.clip();
    cx.fillStyle=names[s][2];
    cx.beginPath(); cx.ellipse(x,y+H*.040,W*.058,H*.034,0,0,6.283); cx.fill();
    cx.restore();
    gloss(x-W*.026, y+H*.006, W*.010, H*.016, 0, .45);
    /* the twisted, knotted neck */
    cx.beginPath();
    cx.moveTo(x-W*.052,y-H*.018); cx.lineTo(x-W*.014,y-H*.046);
    cx.lineTo(x+W*.014,y-H*.046); cx.lineTo(x+W*.052,y-H*.018);
    cx.closePath();
    inkFill('rgba(238,246,252,.66)', 0.45);
    inkEll(x, y-H*.048, W*.017, H*.010, '#E6EEF6', 0.35);
    if(done){
      burst(x, y+H*.014, W*.062, 9, '#59D97C', 0.3);
      inkText('✓', x, y+H*.014, Math.min(30,W*.080), '#FFFFFF', 0.16, 'Cairo, sans-serif');
    }
    cx.restore();
    inkText(L==='ar'?names[s][0]:names[s][1], x, y+H*.094,
            Math.min(15,W*.039), done?'#9BF0B2':'#F2DFC4', 0.16);
  });
}

/* =================================================================== input */
function pos(e){
  const r=cv.getBoundingClientRect();
  const p = e.touches? e.touches[0] : e;
  /* the rect is in visual px, the scene in unzoomed px — scale, don't just offset */
  return {x:(p.clientX-r.left)*(W/r.width), y:(p.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('pointerdown', e=>{
  e.preventDefault(); A.init(); A.resume();
  const p=pos(e);
  if(S.screen==='service' && (SV.stage==='build'||SV.stage==='kemala')){
    const v=vatAt(p.x,p.y); if(v) requestScoop(v);
  } else if(S.screen==='cook'){
    mgTap(p.x,p.y);
  }
});
$('#dock').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  A.init(); A.resume();
  if(b.dataset.bag){
    SV.bagged[b.dataset.bag]=true; A.tone(520,.08,'sine',.12); renderDock(); return;
  }
  const a=b.dataset.act;
  if(a==='hand'||a==='seal') handOver();
  else if(a==='kemalaNo') resolveKemala(false);
  else if(a==='clear'){ S.bowl=blankBowl(); SV.wrongSeq=false; OVER=0; setCombo(0);
                        renderSlip(); renderDock(); A.tone(180,.14,'sine',.12); kick(.4); }
  else if(a==='mgtap') mgTap(W/2,H/2);
  else if(a==='lift'){ if(!MG.lifted) liftBasket(); }
  else if(a==='prep') prepCard();
  else if(a==='open') startDay();
});
/* ---- keyboard, so the game is playable on a desktop too.
   1..6 pick vats left-to-right along the counter, space hands over, C dumps. */
addEventListener('keydown', e=>{
  if(e.repeat) return;
  if($('#ov').classList.contains('on')){
    if(e.key==='Enter'||e.key===' '){
      const b=$('#ovIn').querySelector('.ovBtns button:last-child');
      if(b){ e.preventDefault(); b.click(); }
    }
    return;
  }
  A.init(); A.resume();
  if(S.screen==='service'){
    const n = parseInt(e.key,10);
    if(n>=1 && n<=9){
      const ordered = LAY.vats.slice().sort((p,q)=> (p.row-q.row) || (p.x-q.x));
      const v = ordered[n-1]; if(v){ e.preventDefault(); requestScoop(v); }
    }
    else if(e.key===' '){ e.preventDefault(); handOver(); }
    else if(e.key.toLowerCase()==='c'){ e.preventDefault();
      S.bowl=blankBowl(); SV.wrongSeq=false; OVER=0; setCombo(0); renderSlip(); renderDock(); }
    else if(e.key.toLowerCase()==='x'){ e.preventDefault(); if(SV.stage==='kemala') resolveKemala(false); }
  } else if(S.screen==='cook'){
    if(e.key===' '){ e.preventDefault(); mgTap(W/2,H/2); }
  }
});
/* holding the heat with a key during the frying step */
addEventListener('keydown', e=>{ if(e.key==='Shift' && MG.step && MG.step.kind==='fry') MG.heat=1; });
addEventListener('keyup',   e=>{ if(e.key==='Shift' && MG.step && MG.step.kind==='fry') MG.heat=0; });

/* hold-to-heat */
(function(){
  const set=v=>{ MG.heat=v?1:0; };
  const d=$('#dock');
  d.addEventListener('pointerdown',e=>{ const b=e.target.closest('#heatBtn'); if(b){ set(1);} });
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>
    addEventListener(ev,()=>{ if(MG.step&&MG.step.kind==='fry') set(0); }));
})();
$('#ov').addEventListener('click', e=>{
  const t2=e.target;
  const cook=t2.closest('[data-cook]');
  if(cook){ startCook(cook.dataset.cook); return; }
  const buy=t2.closest('[data-buy]');
  if(buy){ buyUp(buy.dataset.buy); return; }
  const row=t2.closest('[data-act]'); if(!row) return;
  A.init(); A.resume();
  const a=row.dataset.act;
  const acts={
    new(){ S=newGame('story'); S.money=25; S.batch=starterBatches(); S.event='calm';
           layout(); storyCard(); },
    load(){ if(loadGame()){ layout(); hud(); prepScreen(); } },
    casual(){ S=newGame('casual'); S.money=900; S.batch=starterBatches();
              S.event=rollEvent().id; layout(); storyCard(); },
    help(){ S.__helpFrom = S.screen; helpCard(); },
    closeHelp(){ if(S.__helpFrom && S.__helpFrom!=='title'){
                   S.__helpFrom=null;
                   if(S.screen==='prep') prepCard(); else closeOv();
                 } else titleCard(); },
    lang(){ toggleLang(); titleCard(); },
    beginDay(){ closeOv(); prepScreen(); },
    afterNews(){ afterNews(); },
    kemalaNo(){ resolveKemala(false); },
    soak(){ S.nextSoak=!S.nextSoak; S.soaked=S.nextSoak; prepCard(); },
    shop(){ shopCard(); },
    shopFromEnd(){ S.__fromEnd=true; shopCard(); },
    backPrep(){ if(S.__fromEnd){ S.__fromEnd=false; dayEnd(); } else prepCard(); },
    open(){ startDay(); },
    nextDay(){ nextDay(); },
    retry(){ retryDay(); },
    nextCh(){ nextChapter(); },
    menuClose(){ closeOv(); if(S.screen==='prep') prepCard(); }
  };
  if(acts[a]) acts[a]();
});
function starterBatches(){
  const b={};
  ch().vats.forEach(k=>{ b[k]={qty:batchCap(k), qual:0.78, t0:0}; });
  return b;
}
function toggleLang(){
  L = L==='ar'?'en':'ar';
  document.documentElement.lang = L==='ar'?'ar':'en';
  document.documentElement.dir  = L==='ar'?'rtl':'ltr';
  hud(); renderDock(); if(SV.tk) renderSlip(); saveGame();
}
$('#bLang').onclick=()=>{ toggleLang(); if($('#ov').classList.contains('on')){
  if(S.screen==='title') titleCard(); else if(S.screen==='prep') prepCard(); } };
$('#bSnd').onclick=()=>{ A.on=!A.on; if(!A.on){A.fryStop();A.crowd(false);} hud(); };
$('#bMenu').onclick=()=>{
  const ar=L==='ar';
  openOv('<div class="card"><h2>'+t('menu')+'</h2>'+
    '<div class="rows">'+
    '<div class="row"><span>'+(ar?'الفصل':'Chapter')+'</span><b>'+
      (ch().id===99?(ar?'كمالة':'Kemala'):(ch().id+' · '+(L==='ar'?ch().year:ch().yearEn)))+'</b></div>'+
    '<div class="row"><span>'+(ar?'أطباق اتعملت':'Bowls built')+'</span><b>'+S.stats.bowls+'</b></div>'+
    '<div class="row"><span>'+(ar?'زباين مشيت':'Walked out')+'</span><b>'+S.stats.walked+'</b></div>'+
    '</div>'+
    (ch().slang?'<div class="row" style="border-radius:9px;margin-bottom:8px" data-act="slang"><span>'+
      (ar?'لغة المحل على اللافتات (ورد / مونة / كهرمان)':'House slang on the labels')+
      '</span><b>'+(S.slangOn?'✓':'○')+'</b></div>':'')+
    '<div class="ovBtns"><button class="btn ghost" data-act="help">'+t('how')+'</button>'+
    '<button class="btn" data-act="menuClose">'+t('close')+'</button></div>'+
    '<div class="hintline" data-act="wipe">'+(ar?'ابدأ من الأول':'Start over')+'</div></div>');
};
$('#ov').addEventListener('click',e=>{
  const r=e.target.closest('[data-act]'); if(!r) return;
  if(r.dataset.act==='slang'){ S.slangOn=!S.slangOn; $('#bMenu').onclick(); }
  if(r.dataset.act==='wipe'){ try{localStorage.removeItem(SKEY)}catch(e2){}; S=newGame('story'); titleCard(); }
});

/* ==================================================================== boot */
function boot(){
  S=newGame('story');
  S.bowl=blankBowl(); S.clock=0;
  fit(); SP.tip=spoonRest(); hud();
  titleCard();
  requestAnimationFrame(loop);
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ fit(); });
boot();

</script>
