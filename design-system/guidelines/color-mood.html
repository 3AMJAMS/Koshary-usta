<!-- @dsCard group="Colors" viewport="700x170" name="Customer mood" subtitle="The same ramp, named for the face it drives" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:6px">
<div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--mood-delighted);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">delighted</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--mood-happy);color:var(--cream-50);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">happy</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--mood-neutral);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">neutral</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--mood-impatient);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">impatient</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--mood-annoyed);color:var(--cream-50);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">annoyed</div></div>
<p class="mono" style="margin:10px 0 0">Portrait ring, tint halo and patience bar all read this — they can never disagree.</p></body></html>
