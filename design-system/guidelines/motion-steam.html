<!-- @dsCard group="Motion" viewport="700x200" name="Steam & sparkle" subtitle="The two ambient loops that make the scene feel alive" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:20px;align-items:flex-end">
<div style="position:relative;width:120px;height:88px;border-radius:var(--radius-2xl);background:linear-gradient(180deg,#cfd3d6,#8e9498 42%,#6d7377);border:3px solid #5b6266;box-shadow:var(--shadow-rim),var(--shadow-2);overflow:hidden">
<div style="position:absolute;inset-inline:0;inset-block-end:0;height:70%;background:linear-gradient(180deg,var(--ing-rice),var(--ing-rice-shade));animation:ks-simmer 2.6s var(--ease-inout) infinite"></div>
<div style="position:absolute;inset-block-start:8px;inset-inline-start:24px;width:16px;height:16px;border-radius:50%;background:var(--ing-steam);filter:blur(5px);animation:ks-steam-rise var(--dur-steam) var(--ease-steam) infinite"></div>
<div style="position:absolute;inset-block-start:8px;inset-inline-start:56px;width:16px;height:16px;border-radius:50%;background:var(--ing-steam);filter:blur(5px);animation:ks-steam-rise var(--dur-steam) var(--ease-steam) 900ms infinite"></div>
<div style="position:absolute;inset-block-start:8px;inset-inline-start:84px;width:16px;height:16px;border-radius:50%;background:var(--ing-steam);filter:blur(5px);animation:ks-steam-rise var(--dur-steam) var(--ease-steam) 1800ms infinite"></div></div>
<div style="display:inline-flex;align-items:center;padding:var(--space-4) var(--space-7);border-radius:var(--radius-pill);background:linear-gradient(180deg,var(--brass-300),var(--brass-400));border:2px solid var(--brass-600);color:var(--char-900);font:400 28px/1 var(--font-display);box-shadow:var(--shadow-rim),var(--shadow-2),var(--glow-brass);transform:rotate(-2deg);animation:ks-pop-in var(--dur-slow) var(--ease-pop)">Kemala!</div>
<p class="mono" style="flex:1;margin:0">Steam: 3 blurred cream blobs, 3.2s rise, staggered 900ms, opacity 0 → .85 → 0. Only on hot vats. Sparkle burst: 6 brass dots on --ease-out, 40ms stagger — perfect and kemala only.</p></div></body></html>
