<!-- @dsCard group="Brand" viewport="700x195" name="Scene grounds" subtitle="The three backgrounds everything sits on" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:12px">
<div style="flex:1;height:104px;border-radius:var(--radius-md);background:var(--surface-page);border:2px solid var(--line-rim);display:flex;align-items:flex-end;padding:10px;font:var(--fw-bold) 11px/1 var(--font-ui)">--surface-page<br></div>
<div style="flex:1;height:104px;border-radius:var(--radius-md);background:linear-gradient(180deg,#a8703f,var(--surface-counter));display:flex;align-items:flex-end;padding:10px;color:var(--cream-50);font:var(--fw-bold) 11px/1 var(--font-ui);box-shadow:var(--shadow-rim)">--surface-counter</div>
<div style="flex:1;height:104px;border-radius:var(--radius-md);background:linear-gradient(180deg,#5d3a22,var(--surface-street));display:flex;align-items:flex-end;padding:10px;color:var(--cream-50);font:var(--fw-bold) 11px/1 var(--font-ui);box-shadow:var(--shadow-rim-dark)">--surface-street</div>
<div style="flex:1.1"><p class="mono" style="margin:0">Menus sit on page cream. Gameplay sits on the counter, warm wood under a top-down key light. Street is the out-of-focus backdrop behind the queue — always blurred 6–10px so customers stay legible.</p></div></div></body></html>
