<!-- @dsCard group="Brand" viewport="700x200" name="Mirroring" subtitle="Every layout survives dir="rtl" without a second stylesheet" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}.p{flex:1;padding:14px;border-radius:var(--radius-md);background:var(--surface-card);box-shadow:var(--shadow-rim),var(--shadow-1);display:flex;align-items:center;gap:12px}</style>
</head><body><div style="display:flex;gap:12px">
<div class="p" dir="ltr"><i class="ph-fill ph-bowl-food" style="font-size:26px;color:var(--clay-500)"></i><div style="flex:1"><div style="font:var(--fw-black) 15px/1.2 var(--font-ui)">Order ready</div><div style="font:var(--fw-regular) 12px/1.4 var(--font-ui);color:var(--text-muted)">Table 4</div></div><i class="ph-fill ph-arrow-right" data-ks-flip style="font-size:20px;color:var(--text-muted)"></i></div>
<div class="p" dir="rtl"><i class="ph-fill ph-bowl-food" style="font-size:26px;color:var(--clay-500)"></i><div style="flex:1"><div style="font:var(--fw-black) 15px/1.35 var(--font-ui)">الطلب جاهز</div><div style="font:var(--fw-regular) 12px/1.5 var(--font-ui);color:var(--text-muted)">ترابيزة ٤</div></div><i class="ph-fill ph-arrow-right" data-ks-flip style="font-size:20px;color:var(--text-muted)"></i></div></div>
<p class="mono" style="margin:11px 0 0">Rules: logical properties only (padding-inline, inset-inline-start, margin-block). Directional glyphs opt in with [data-ks-flip]; food, faces and numerals never flip. Numerals stay LTR via [data-ks-numeric].</p></body></html>
