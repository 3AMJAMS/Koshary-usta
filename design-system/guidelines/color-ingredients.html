<!-- @dsCard group="Colors" viewport="700x175" name="Ingredients" subtitle="Face + shade pair per ingredient, with the grain overlay" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:8px">
<div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-rice),var(--ing-rice-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-rice-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Rice</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-lentil),var(--ing-lentil-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-lentil-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Lentils</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-pasta),var(--ing-pasta-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-pasta-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Pasta</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-chickpea),var(--ing-chickpea-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-chickpea-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Chickpeas</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-sauce),var(--ing-sauce-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-sauce-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Sauce</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-onion),var(--ing-onion-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-onion-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Onion</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-daqqa),var(--ing-daqqa-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-daqqa-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Daqqa</span></div><div style="flex:1;display:flex;flex-direction:column;gap:6px;align-items:center">
<div style="width:100%;height:58px;border-radius:var(--radius-sm);background:linear-gradient(180deg,var(--ing-shatta),var(--ing-shatta-shade));box-shadow:var(--shadow-rim);position:relative;overflow:hidden"><div style="position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:radial-gradient(var(--ing-shatta-shade) 1px,transparent 1.4px);background-size:6px 6px"></div></div>
<span class="lbl">Shatta</span></div></div>
<p class="mono" style="margin:10px 0 0">Vat, ticket dot and bowl layer all pull the same pair, so one colour = one ingredient everywhere.</p></body></html>
