<!-- @dsCard group="Type" viewport="700x215" name="Bilingual pairing" subtitle="The same block, LTR and RTL — one voice, mirrored layout" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}.b{flex:1;padding:14px;border-radius:var(--radius-md);background:var(--surface-card);box-shadow:var(--shadow-rim),var(--shadow-1)}</style>
</head><body><div style="display:flex;gap:12px">
<div class="b" dir="ltr"><div style="font:var(--fw-black) var(--fs-title-sm)/1.2 var(--font-ui)">Friday rush</div>
<p style="margin:6px 0 0;font:var(--fw-regular) var(--fs-body-sm)/var(--lh-normal) var(--font-ui)">The queue fills twice as fast. Keep the rice vat topped up.</p>
<div style="margin-top:10px;padding-inline-start:10px;border-inline-start:3px solid var(--clay-500);font:var(--fw-bold) var(--fs-caption)/1.3 var(--font-ui)">−20% patience</div></div>
<div class="b" dir="rtl"><div style="font:var(--fw-black) var(--fs-title-sm)/1.35 var(--font-ui)">زحمة الجمعة</div>
<p style="margin:6px 0 0;font:var(--fw-regular) var(--fs-body-sm)/1.7 var(--font-ui)">الطابور بيمتلي بسرعة الضعف. خلي حلة الرز مليانة.</p>
<div style="margin-top:10px;padding-inline-start:10px;border-inline-start:3px solid var(--clay-500);font:var(--fw-bold) var(--fs-caption)/1.4 var(--font-ui)">−٢٠٪ صبر</div></div></div>
<p class="mono" style="margin:10px 0 0">Arabic gets +0.25 line-height and --scale-arabic on display sizes. Borders use inline-start, never left.</p></body></html>
