<!-- @dsCard group="Colors" viewport="700x170" name="Game state" subtitle="One ramp every meter, ticket rim and judgement pop shares" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:6px">
<div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-perfect);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">perfect</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-kemala);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">kemala</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-good);color:var(--cream-50);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">good</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-ok);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">ok</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-warn);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">warn</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-fail);color:var(--cream-50);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">fail</div><div style="flex:1;height:86px;border-radius:var(--radius-sm);background:var(--state-combo);color:var(--char-900);display:flex;align-items:flex-end;padding:8px;box-shadow:var(--shadow-rim);font:var(--fw-bold) 10px/1.3 var(--font-ui)">combo</div></div>
<p class="mono" style="margin:10px 0 0">Patience thresholds are fixed: &gt;60 good · 60–30 warn · &lt;30 fail + pulse.</p></body></html>
