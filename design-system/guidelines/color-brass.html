<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:8px;box-shadow:var(--shadow-rim)}</style>
</head><body><div style="display:flex;gap:6px"><div class="sw" style="background:var(--brass-100);color:var(--char-900)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-100</span></div><div class="sw" style="background:var(--brass-200);color:var(--char-900)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-200</span></div><div class="sw" style="background:var(--brass-300);color:var(--char-900)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-300</span></div><div class="sw" style="background:var(--brass-400);color:var(--char-900)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-400</span></div><div class="sw" style="background:var(--brass-500);color:var(--char-900)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-500</span></div><div class="sw" style="background:var(--brass-600);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-600</span></div><div class="sw" style="background:var(--brass-700);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">brass-700</span></div></div><p class="mono" style="margin:10px 0 0">Brass is scarce on purpose: money, stars, perfect, kemala. Nothing else.</p></body></html>
