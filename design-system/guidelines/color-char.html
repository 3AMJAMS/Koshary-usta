<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}.sw{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:96px;border-radius:var(--radius-sm);padding:8px;box-shadow:var(--shadow-rim)}</style>
</head><body><div style="display:flex;gap:6px"><div class="sw" style="background:var(--char-400);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-400</span></div><div class="sw" style="background:var(--char-500);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-500</span></div><div class="sw" style="background:var(--char-600);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-600</span></div><div class="sw" style="background:var(--char-700);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-700</span></div><div class="sw" style="background:var(--char-800);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-800</span></div><div class="sw" style="background:var(--char-900);color:var(--cream-50)"><span style="font:var(--fw-bold) 10px/1.3 var(--font-ui)">char-900</span></div></div><p class="mono" style="margin:10px 0 0">Body copy is 800, headings 900, secondary 500. 400 is decoration only.</p></body></html>
