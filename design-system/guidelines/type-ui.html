<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body><div style="display:flex;flex-direction:column;gap:7px">

<span style="font:var(--fw-bold) var(--fs-body-lg)/var(--lh-snug) var(--font-ui)">Second rice vat — 700 / 19px</span>
<span style="font:var(--fw-semibold) var(--fs-body)/var(--lh-normal) var(--font-ui)">Hold twice as much rice — 600 / 17px</span>
