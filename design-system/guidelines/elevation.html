<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Three lifts, one sunken well, two glows" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-page);font-family:var(--font-ui);color:var(--text-body)}.lbl{font:var(--fw-bold) 10px/1.2 var(--font-ui);letter-spacing:var(--ls-caps);text-transform:uppercase;color:var(--text-muted)}.mono{font:var(--fw-semibold) 11px/1.4 ui-monospace,monospace;color:var(--text-muted)}.e{flex:1;height:74px;border-radius:var(--radius-md);background:var(--cream-50);display:grid;place-items:center;font:var(--fw-bold) 11px/1 var(--font-ui);color:var(--text-muted)}</style>
</head><body><div style="display:flex;gap:14px">
<div class="e" style="box-shadow:var(--shadow-rim),var(--shadow-1)">shadow-1</div>
<div class="e" style="box-shadow:var(--shadow-rim),var(--shadow-2)">shadow-2</div>
<div class="e" style="box-shadow:var(--shadow-rim),var(--shadow-3)">shadow-3</div>
<div class="e" style="box-shadow:var(--shadow-sunken);background:var(--cream-200)">sunken</div>
<div class="e" style="box-shadow:var(--shadow-rim),var(--glow-brass)">glow-brass</div>
<div class="e" style="box-shadow:var(--shadow-rim),var(--glow-danger)">glow-danger</div></div>
<p class="mono" style="margin:12px 0 0">Shadows are warm (char at 12–42%), never neutral grey. Glows mark state, never hierarchy.</p></body></html>
